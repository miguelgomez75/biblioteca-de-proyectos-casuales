<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renombrador Masivo de Archivos - Comic & Sprites</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0d0f12;
      --panel: #161a20;
      --border: #2a2f38;
      --text: #e8eaed;
      --muted: #9aa3af;
      --accent: #ffb020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; text-align: center; }
    p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.85rem; text-align: center; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 800px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .input-group {
      background: var(--bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type=file], input[type=text], input[type=number] {
      width: 100%;
      font-size: 0.85rem;
      color: var(--text);
      background: #101318;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 4px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      background: var(--accent);
      color: #1a1200;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 16px;
      padding: 8px;
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .preview-list {
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      max-height: 250px;
      overflow-y: auto;
      padding: 12px;
      font-size: 0.8rem;
    }
    .preview-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #1a202c;
    }
    .preview-item:last-child { border-bottom: none; }
    .old-name { color: var(--muted); }
    .arrow { color: var(--accent); margin: 0 8px; }
    .new-name { color: #4deeea; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Renombrador Masivo de Archivos</h1>
  <p class="sub">Renombra tus archivos manteniendo la extensión original de cada uno</p>

  <div class="card">
    <div class="form-grid">
      <div class="input-group" style="grid-column: 1 / -1;">
        <label>1. Selecciona o arrastra los archivos (Cualquier formato)</label>
        <input type="file" id="fileInput" multiple>
      </div>

      <div class="input-group">
        <label>Prefijo (Opcional)</label>
        <input type="text" id="prefixInput" placeholder="Ej: pagina_ o vacio">
      </div>

      <div class="input-group">
        <label>Número de inicio</label>
        <input type="number" id="startNumInput" value="1" min="0">
      </div>

      <div class="input-group">
        <label>Dígitos (Ceros a la izq.)</label>
        <input type="number" id="digitsInput" value="3" min="1" max="10">
      </div>
    </div>

    <div class="actions">
      <button id="processBtn" disabled>Descargar Archivos Renombrados (.ZIP)</button>
    </div>

    <div id="status">Selecciona uno o varios archivos para comenzar.</div>

    <div id="previewContainer" style="display:none;">
      <span style="font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; display: block;">
        Previsualización del renombrado:
      </span>
      <div class="preview-list" id="previewList"></div>
    </div>
  </div>

  <script>
    let filesList = [];

    const fileInput = document.getElementById('fileInput');
    const prefixInput = document.getElementById('prefixInput');
    const startNumInput = document.getElementById('startNumInput');
    const digitsInput = document.getElementById('digitsInput');
    const processBtn = document.getElementById('processBtn');
    const statusEl = document.getElementById('status');
    const previewContainer = document.getElementById('previewContainer');
    const previewList = document.getElementById('previewList');

    // Ordenar los archivos por nombre natural de archivo (para mantener 1, 2, ..., 10 en orden correcto)
    function sortFiles(files) {
      return Array.from(files).sort((a, b) => 
        a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })
      );
    }

    function getFormattedName(originalName, index) {
      // Extrae la extensión del archivo original (ej: .png, .gif, .jpeg)
      const lastDotIndex = originalName.lastIndexOf('.');
      const ext = lastDotIndex !== -1 ? originalName.slice(lastDotIndex) : '';

      const prefix = prefixInput.value;
      const startNum = parseInt(startNumInput.value) || 1;
      const totalDigits = parseInt(digitsInput.value) || 3;

      const currentNum = startNum + index;
      const paddedNum = String(currentNum).padStart(totalDigits, '0');

      return `${prefix}${paddedNum}${ext}`;
    }

    function updatePreview() {
      if (filesList.length === 0) {
        previewContainer.style.display = 'none';
        processBtn.disabled = true;
        statusEl.textContent = "Selecciona uno o varios archivos para comenzar.";
        return;
      }

      previewList.innerHTML = '';
      filesList.forEach((file, idx) => {
        const newName = getFormattedName(file.name, idx);

        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `
          <span class="old-name">${file.name}</span>
          <span><span class="arrow">➔</span><span class="new-name">${newName}</span></span>
        `;
        previewList.appendChild(item);
      });

      previewContainer.style.display = 'block';
      processBtn.disabled = false;
      statusEl.textContent = `${filesList.length} archivo(s) listo(s) para procesar.`;
    }

    fileInput.addEventListener('change', (e) => {
      filesList = sortFiles(e.target.files);
      updatePreview();
    });

    // Actualiza la vista previa al cambiar las opciones
    [prefixInput, startNumInput, digitsInput].forEach(el => {
      el.addEventListener('input', updatePreview);
    });

    processBtn.addEventListener('click', async () => {
      processBtn.disabled = true;
      statusEl.textContent = "Comprimiendo y guardando en ZIP...";

      const zip = new JSZip();

      filesList.forEach((file, idx) => {
        const newName = getFormattedName(file.name, idx);
        zip.file(newName, file);
      });

      const zipBlob = await zip.generateAsync({ type: "blob" });

      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipBlob);
      link.download = "archivos_renombrados.zip";
      link.click();

      statusEl.textContent = `¡Listo! Se han descargado ${filesList.length} archivos renombrados.`;
      processBtn.disabled = false;
    });
  </script>
</body>
</html>
