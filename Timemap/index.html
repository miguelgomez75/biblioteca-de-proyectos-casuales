<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timemap::hub</title>
<meta name="description" content="Crea líneas de tiempo por orden de sucesión: añade, edita, elimina y reordena eventos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c10; --surface: #13131a; --surface-2: #1c1c26; --border: #25253a;
    --text: #e2e2f0; --text-2: #8080a0; --text-3: #454560; --accent: #e8a030;
    --good: #34d399; --bad: #f87171;
    --font-ui: 'Inter', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', monospace;
    --radius: 10px; --radius-lg: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 3rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; }
  .logo { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 600; letter-spacing: -0.03em; }
  .logo span { color: var(--accent); }
  .tagline { font-size: 12.5px; color: var(--text-3); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }

  .shell { width: 100%; max-width: 760px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.4rem; margin-bottom: 1rem; }
  .section-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }

  label { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); margin-bottom: 5px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--font-ui); font-size: 13px; padding: 9px 11px; outline: none;
  }
  textarea { resize: vertical; min-height: 56px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .field { margin-bottom: 12px; }

  button.btn {
    font-family: var(--font-ui); font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px;
    background: var(--surface-2); color: var(--text); transition: border-color 0.15s, transform 0.08s;
  }
  button.btn:hover { border-color: #40405a; }
  button.btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-danger { color: var(--bad); }
  .btn-small { padding: 5px 9px; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .file-input { display: none; }

  .color-row { display: flex; gap: 8px; align-items: center; }
  .color-row input[type=color] { width: 40px; height: 34px; padding: 2px; flex: 0 0 auto; cursor: pointer; }

  /* ── línea de tiempo (vertical) ── */
  .view-toggle { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .view-toggle .seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .view-toggle .seg button {
    font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; padding: 7px 13px; cursor: pointer;
    background: var(--surface-2); color: var(--text-2); border: none; border-right: 1px solid var(--border);
  }
  .view-toggle .seg button:last-child { border-right: none; }
  .view-toggle .seg button.active { background: var(--accent-dim, #271d08); color: var(--accent); }

  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border);
  }
  .tl-node { position: relative; padding-bottom: 18px; }
  .tl-node:last-child { padding-bottom: 0; }
  .tl-dot {
    position: absolute; left: -26px; top: 3px; width: 14px; height: 14px; border-radius: 50%;
    border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--border);
  }
  .tl-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .tl-card.dragover { box-shadow: 0 0 0 2px var(--accent); }
  .tl-main { flex: 1; min-width: 0; cursor: grab; }
  .tl-main:active { cursor: grabbing; }
  .tl-index { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); margin-bottom: 2px; }
  .tl-title { font-size: 14px; font-weight: 600; }
  .tl-desc { font-size: 12.5px; color: var(--text-2); margin-top: 3px; line-height: 1.5; white-space: pre-wrap; }
  .tl-actions { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
  .tl-actions .row2 { display: flex; gap: 4px; }
  .empty-hint { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); text-align: center; padding: 20px 0; }

  /* ── línea de tiempo (horizontal) ── */
  .timeline-h-wrap { overflow-x: auto; padding: 10px 4px 18px; }
  .timeline-h {
    position: relative; display: flex; align-items: stretch; min-height: 300px;
    padding: 130px 30px 0; width: max-content; min-width: 100%;
  }
  .timeline-h::before {
    content: ''; position: absolute; left: 0; right: 0; top: 150px; height: 2px; background: var(--border);
  }
  .th-node { position: relative; flex: 0 0 220px; }
  .th-dot {
    position: absolute; left: 50%; top: 150px; width: 14px; height: 14px; border-radius: 50%;
    transform: translate(-50%, -50%); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--border); z-index: 2;
    cursor: grab;
  }
  .th-stem { position: absolute; left: 50%; width: 2px; background: var(--border); transform: translateX(-50%); }
  .th-stem.above { top: 74px; height: 76px; }
  .th-stem.below { top: 150px; height: 76px; }
  .th-card {
    position: absolute; left: 50%; width: 196px; transform: translateX(-50%);
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 11px;
  }
  .th-card.above { top: 66px; transform: translate(-50%, -100%); }
  .th-card.below { top: 234px; }
  .th-card.dragover { box-shadow: 0 0 0 2px var(--accent); }
  .th-index { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); margin-bottom: 2px; }
  .th-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .th-desc { font-size: 11.5px; color: var(--text-2); margin-top: 3px; line-height: 1.5; white-space: pre-wrap; max-height: 90px; overflow-y: auto; }
  .th-actions { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
  .th-actions button { font-size: 10.5px; padding: 3px 6px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 18px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50;
  }
  .toast.show { opacity: 1; }

  .footer-note { text-align: center; font-size: 11.5px; color: var(--text-3); margin-top: 1.5rem; font-family: var(--font-mono); line-height: 1.6; }

  @media (max-width: 560px) {
    .card { padding: 1rem; }
    .tl-card { flex-direction: column; }
    .tl-actions { flex-direction: row; flex-wrap: wrap; }
  }
</style>
<!-- bc-theme --><script src="../theme.js"></script>
</head>
<body>

<header>
  <div class="logo">timemap<span>::</span>hub</div>
  <div class="tagline">Líneas de tiempo por orden de sucesión</div>
</header>

<div class="shell">

  <!-- ── gestión ── -->
  <div class="card">
    <div class="section-title">Línea de tiempo</div>
    <div class="toolbar">
      <select id="mapSelect" style="flex:1; min-width:160px;"></select>
      <button class="btn" id="newMapBtn">+ Nueva</button>
      <button class="btn" id="renameMapBtn">Renombrar</button>
      <button class="btn btn-danger" id="deleteMapBtn">Eliminar</button>
    </div>
    <div class="toolbar" style="margin-top:8px;">
      <button class="btn" id="exportBtn">Descargar JSON</button>
      <button class="btn" id="importBtn">Importar JSON</button>
      <input type="file" id="fileInput" class="file-input" accept=".json,application/json">
    </div>
  </div>

  <!-- ── editor de evento ── -->
  <div class="card">
    <div class="section-title" id="editorTitle">Nuevo evento</div>
    <div class="field">
      <label for="evTitle">Título</label>
      <input type="text" id="evTitle" placeholder="Qué ocurrió">
    </div>
    <div class="field">
      <label for="evDesc">Descripción (opcional)</label>
      <textarea id="evDesc" placeholder="Detalles, contexto…"></textarea>
    </div>
    <div class="row">
      <div class="field" style="flex:0 0 140px;">
        <label for="evColor">Color</label>
        <div class="color-row">
          <input type="color" id="evColor" value="#e8a030">
        </div>
      </div>
      <div class="field" style="flex:1; align-self:flex-end; display:flex; gap:8px;">
        <button class="btn btn-primary" id="saveBtn" style="flex:0 0 auto;">Añadir evento</button>
        <button class="btn" id="cancelBtn" style="display:none; flex:0 0 auto;">Cancelar edición</button>
      </div>
    </div>
  </div>

  <!-- ── línea de tiempo ── -->
  <div class="card">
    <div class="section-title">Sucesión de eventos</div>
    <div class="view-toggle">
      <span style="font-family:var(--font-mono); font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.05em;">Vista</span>
      <div class="seg">
        <button id="viewVerticalBtn" class="active">Vertical</button>
        <button id="viewHorizontalBtn">Horizontal</button>
      </div>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="timeline-h-wrap" id="timelineHWrap" style="display:none;">
      <div class="timeline-h" id="timelineH"></div>
    </div>
  </div>

  <div class="footer-note">
    Todo se guarda en este navegador — nada se envía a ningún servidor.<br>
    Arrastra un evento para reordenarlo, o usa las flechas. El orden es de sucesión, no tiene por qué llevar fechas.
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'timemaphub:maps';
  var LAST_KEY = 'timemaphub:last';

  function $(id) { return document.getElementById(id); }
  function uid() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function newMapData(name) { return { name: name, events: [] }; }

  function loadAll() {
    try { var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  }
  function saveAll(all) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); } catch (e) {} }

  var allMaps = loadAll();
  var currentName = localStorage.getItem(LAST_KEY);
  if (!currentName || !allMaps[currentName]) {
    var names = Object.keys(allMaps);
    currentName = names.length ? names[0] : 'Mi línea de tiempo';
  }
  if (!allMaps[currentName]) allMaps[currentName] = newMapData(currentName);
  var map = allMaps[currentName];

  var editingId = null;

  function persist() {
    allMaps[currentName] = map;
    saveAll(allMaps);
    localStorage.setItem(LAST_KEY, currentName);
  }

  function findEvent(id) {
    for (var i = 0; i < map.events.length; i++) if (map.events[i].id === id) return map.events[i];
    return null;
  }

  /* ── selector de líneas de tiempo ── */
  function renderMapSelect() {
    var sel = $('mapSelect');
    sel.innerHTML = '';
    Object.keys(allMaps).sort().forEach(function (name) {
      var opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if (name === currentName) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  $('mapSelect').addEventListener('change', function () {
    currentName = this.value;
    map = allMaps[currentName];
    editingId = null;
    persist();
    clearForm();
    renderTimeline();
  });

  $('newMapBtn').addEventListener('click', function () {
    var name = prompt('Nombre de la nueva línea de tiempo:');
    if (name === null) return;
    name = name.trim();
    if (!name) { toast('Escribe un nombre'); return; }
    if (allMaps[name]) { toast('Ya existe una con ese nombre'); return; }
    allMaps[name] = newMapData(name);
    currentName = name;
    map = allMaps[currentName];
    persist();
    renderMapSelect();
    clearForm();
    renderTimeline();
    toast('Línea de tiempo creada');
  });

  $('renameMapBtn').addEventListener('click', function () {
    var name = prompt('Nuevo nombre para «' + currentName + '»:', currentName);
    if (name === null) return;
    name = name.trim();
    if (!name || name === currentName) return;
    if (allMaps[name]) { toast('Ya existe una con ese nombre'); return; }
    delete allMaps[currentName];
    map.name = name;
    allMaps[name] = map;
    currentName = name;
    persist();
    renderMapSelect();
    toast('Renombrada');
  });

  $('deleteMapBtn').addEventListener('click', function () {
    var names = Object.keys(allMaps);
    if (names.length <= 1) { toast('No puedes borrar la única línea de tiempo'); return; }
    if (!confirm('¿Eliminar «' + currentName + '» y todos sus eventos?')) return;
    delete allMaps[currentName];
    currentName = Object.keys(allMaps)[0];
    map = allMaps[currentName];
    persist();
    renderMapSelect();
    clearForm();
    renderTimeline();
    toast('Eliminada');
  });

  /* ── editor ── */
  function clearForm() {
    $('evTitle').value = '';
    $('evDesc').value = '';
    $('evColor').value = '#e8a030';
    editingId = null;
    $('editorTitle').textContent = 'Nuevo evento';
    $('saveBtn').textContent = 'Añadir evento';
    $('cancelBtn').style.display = 'none';
  }

  $('cancelBtn').addEventListener('click', clearForm);

  $('saveBtn').addEventListener('click', function () {
    var title = $('evTitle').value.trim();
    if (!title) { toast('Escribe un título'); return; }
    var ev = {
      title: title,
      desc: $('evDesc').value.trim(),
      color: $('evColor').value
    };
    if (editingId) {
      var existing = findEvent(editingId);
      existing.title = ev.title; existing.desc = ev.desc; existing.color = ev.color;
      toast('Evento actualizado');
    } else {
      ev.id = uid();
      map.events.push(ev);
      toast('Evento añadido');
    }
    persist();
    clearForm();
    renderTimeline();
  });

  function editEvent(id) {
    var ev = findEvent(id);
    if (!ev) return;
    editingId = id;
    $('evTitle').value = ev.title;
    $('evDesc').value = ev.desc || '';
    $('evColor').value = ev.color || '#e8a030';
    $('editorTitle').textContent = 'Editando evento';
    $('saveBtn').textContent = 'Guardar cambios';
    $('cancelBtn').style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteEvent(id) {
    map.events = map.events.filter(function (e) { return e.id !== id; });
    if (editingId === id) clearForm();
    persist();
    renderTimeline();
  }

  function moveEvent(from, to) {
    if (to < 0 || to >= map.events.length || to === from) return;
    var item = map.events.splice(from, 1)[0];
    map.events.splice(to, 0, item);
    persist();
    renderTimeline();
  }

  /* ── timeline ── */
  var dragFromIndex = null;

  function renderTimeline() {
    var box = $('timeline');
    box.innerHTML = '';
    if (!map.events.length) {
      box.innerHTML = '<div class="empty-hint">Aún no hay eventos. Añade el primero arriba.</div>';
      return;
    }
    map.events.forEach(function (ev, i) {
      var node = document.createElement('div');
      node.className = 'tl-node';

      var dot = document.createElement('div');
      dot.className = 'tl-dot';
      dot.style.background = ev.color || '#e8a030';
      node.appendChild(dot);

      var card = document.createElement('div');
      card.className = 'tl-card';
      card.draggable = true;
      card.dataset.index = i;

      var main = document.createElement('div');
      main.className = 'tl-main';
      var idx = document.createElement('div');
      idx.className = 'tl-index';
      idx.textContent = '#' + (i + 1) + ' de ' + map.events.length;
      var title = document.createElement('div');
      title.className = 'tl-title';
      title.textContent = ev.title;
      main.appendChild(idx);
      main.appendChild(title);
      if (ev.desc) {
        var desc = document.createElement('div');
        desc.className = 'tl-desc';
        desc.textContent = ev.desc;
        main.appendChild(desc);
      }
      card.appendChild(main);

      var acts = document.createElement('div');
      acts.className = 'tl-actions';
      var row1 = document.createElement('div');
      row1.className = 'row2';
      var up = mkBtn('↑', function () { moveEvent(i, i - 1); }); up.disabled = i === 0;
      var down = mkBtn('↓', function () { moveEvent(i, i + 1); }); down.disabled = i === map.events.length - 1;
      row1.appendChild(up); row1.appendChild(down);
      var row2 = document.createElement('div');
      row2.className = 'row2';
      row2.appendChild(mkBtn('Editar', function () { editEvent(ev.id); }));
      row2.appendChild(mkBtn('×', function () { deleteEvent(ev.id); }, 'btn-danger'));
      acts.appendChild(row1);
      acts.appendChild(row2);
      card.appendChild(acts);

      card.addEventListener('dragstart', function (e) {
        dragFromIndex = i;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(i));
      });
      card.addEventListener('dragover', function (e) { e.preventDefault(); card.classList.add('dragover'); });
      card.addEventListener('dragleave', function () { card.classList.remove('dragover'); });
      card.addEventListener('drop', function (e) {
        e.preventDefault();
        card.classList.remove('dragover');
        var from = dragFromIndex;
        if (from === null || from === undefined) return;
        moveEvent(from, i);
        dragFromIndex = null;
      });

      node.appendChild(card);
      box.appendChild(node);
    });
  }

  function mkBtn(label, fn, extra) {
    var b = document.createElement('button');
    b.className = 'btn btn-small' + (extra ? ' ' + extra : '');
    b.type = 'button';
    b.textContent = label;
    b.onclick = fn;
    return b;
  }

  /* ── import/export ── */
  $('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(map, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (currentName || 'timemap').replace(/[^a-z0-9\-_ ]/gi, '').trim().replace(/\s+/g, '_') + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('importBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.events)) throw new Error('Formato no reconocido');
        var name = data.name || file.name.replace(/\.json$/i, '');
        var finalName = name, n = 2;
        while (allMaps[finalName]) { finalName = name + ' (' + n + ')'; n++; }
        data.name = finalName;
        data.events.forEach(function (e) { if (!e.id) e.id = uid(); });
        allMaps[finalName] = data;
        currentName = finalName;
        map = allMaps[currentName];
        persist();
        renderMapSelect();
        clearForm();
        renderTimeline();
        toast('Importada como «' + finalName + '»');
      } catch (err) {
        toast('No se pudo importar: ' + err.message);
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  });

  renderMapSelect();
  clearForm();
  renderTimeline();
})();
</script>
</body>
</html>
