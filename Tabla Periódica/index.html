<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>periodic::hub — Tabla periódica interactiva</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--surface:#13131a;--surface-2:#1c1c26;--border:#25253a;--border-2:#40405a;--text:#e2e2f0;--text-2:#8080a0;--text-3:#454560;--accent:#e8a030;--accent-dim:#271d08;--font-ui:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;--radius:10px;--radius-lg:16px;
--c-alkali:#f2716b;--c-alkaline:#f2a35b;--c-transition:#e0b35c;--c-post:#6ea8d8;--c-metalloid:#7cc98a;--c-nonmetal:#7bc4e8;--c-halogen:#e87ba0;--c-noble:#b18ae8;--c-lanthanide:#5fc9c9;--c-actinide:#c98ae8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(2rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
.logo{font:600 1.9rem var(--font-mono);letter-spacing:-.03em}.logo span{color:var(--accent)}
.tagline{font-size:12.5px;color:var(--text-3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
header{text-align:center;margin-bottom:1.4rem}
.shell{width:100%;max-width:1080px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem;margin-bottom:1rem}
.section-title{font:11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:.8rem}

.top-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
input[type=text]{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:13.5px var(--font-ui);padding:9px 12px;outline:none;flex:1;min-width:160px}
input:focus{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.leg-item{display:flex;align-items:center;gap:5px;font:11px var(--font-ui);color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 8px;cursor:pointer}
.leg-item.off{opacity:.35}
.dot{width:9px;height:9px;border-radius:50%}

.ptable-wrap{overflow-x:auto;padding-bottom:6px}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));gap:3px;min-width:800px;margin-bottom:8px}
.fblock{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));gap:3px;min-width:800px}
.elem{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--border-2);border-radius:6px;padding:3px 4px;cursor:pointer;font-family:var(--font-mono);text-align:left;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s,border-color .12s}
.elem:hover{transform:translateY(-2px);border-color:var(--accent)}
.elem.dim{opacity:.18;pointer-events:none}
.elem.active{outline:2px solid var(--accent)}
.elem .z{font-size:9px;color:var(--text-3)}
.elem .sym{font-size:15px;font-weight:600;line-height:1}
.elem .nm{font-size:7.5px;color:var(--text-3);font-family:var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{visibility:hidden}
.fplaceholder{background:none;border:1px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font:10px var(--font-mono);color:var(--text-3);aspect-ratio:1;cursor:pointer}

#detail{display:none}
#detail.show{display:flex}
.detail-sym{font:600 3rem var(--font-mono);width:100px;height:100px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border)}
.detail-info{flex:1;min-width:200px}
.detail-name{font:600 1.3rem var(--font-ui)}
.detail-sub{font:11.5px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.7rem}
.detail-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.dstat{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem}
.dstat b{display:block;font:600 .95rem var(--font-ui)}
.dstat span{font:10px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.03em}

@media(max-width:820px){.logo{font-size:1.5rem}}
</style>
</head>
<body>
<header><div class="logo">periodic<span>::</span>hub</div><div class="tagline">Tabla periódica interactiva de los 118 elementos</div></header>

<div class="shell">
  <div class="card">
    <div class="top-row">
      <input type="text" id="search" placeholder="Buscar por nombre, símbolo o número atómico…">
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <div class="ptable-wrap">
      <div class="ptable" id="ptable"></div>
      <div style="height:14px"></div>
      <div class="fblock" id="fblock"></div>
    </div>
  </div>

  <div class="card" id="detail">
    <div class="detail-sym" id="d-sym"></div>
    <div class="detail-info">
      <div class="detail-name" id="d-name"></div>
      <div class="detail-sub" id="d-sub"></div>
      <div class="detail-stats">
        <div class="dstat"><b id="d-mass"></b><span>Masa atómica</span></div>
        <div class="dstat"><b id="d-group"></b><span>Grupo</span></div>
        <div class="dstat"><b id="d-period"></b><span>Periodo</span></div>
        <div class="dstat"><b id="d-state"></b><span>Estado (25 °C)</span></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

/* ══════════════════════════════════════════════
   DATOS — [Z, símbolo, nombre, masa, categoría]
══════════════════════════════════════════════ */
const ELEMENTS = [
[1,'H','Hidrógeno',1.008,'nonmetal'],[2,'He','Helio',4.003,'noble'],
[3,'Li','Litio',6.94,'alkali'],[4,'Be','Berilio',9.012,'alkaline'],[5,'B','Boro',10.81,'metalloid'],[6,'C','Carbono',12.011,'nonmetal'],[7,'N','Nitrógeno',14.007,'nonmetal'],[8,'O','Oxígeno',15.999,'nonmetal'],[9,'F','Flúor',18.998,'halogen'],[10,'Ne','Neón',20.180,'noble'],
[11,'Na','Sodio',22.990,'alkali'],[12,'Mg','Magnesio',24.305,'alkaline'],[13,'Al','Aluminio',26.982,'post'],[14,'Si','Silicio',28.085,'metalloid'],[15,'P','Fósforo',30.974,'nonmetal'],[16,'S','Azufre',32.06,'nonmetal'],[17,'Cl','Cloro',35.45,'halogen'],[18,'Ar','Argón',39.948,'noble'],
[19,'K','Potasio',39.098,'alkali'],[20,'Ca','Calcio',40.078,'alkaline'],[21,'Sc','Escandio',44.956,'transition'],[22,'Ti','Titanio',47.867,'transition'],[23,'V','Vanadio',50.942,'transition'],[24,'Cr','Cromo',51.996,'transition'],[25,'Mn','Manganeso',54.938,'transition'],[26,'Fe','Hierro',55.845,'transition'],[27,'Co','Cobalto',58.933,'transition'],[28,'Ni','Níquel',58.693,'transition'],[29,'Cu','Cobre',63.546,'transition'],[30,'Zn','Zinc',65.38,'transition'],[31,'Ga','Galio',69.723,'post'],[32,'Ge','Germanio',72.630,'metalloid'],[33,'As','Arsénico',74.922,'metalloid'],[34,'Se','Selenio',78.971,'nonmetal'],[35,'Br','Bromo',79.904,'halogen'],[36,'Kr','Kriptón',83.798,'noble'],
[37,'Rb','Rubidio',85.468,'alkali'],[38,'Sr','Estroncio',87.62,'alkaline'],[39,'Y','Itrio',88.906,'transition'],[40,'Zr','Circonio',91.224,'transition'],[41,'Nb','Niobio',92.906,'transition'],[42,'Mo','Molibdeno',95.95,'transition'],[43,'Tc','Tecnecio',98,'transition'],[44,'Ru','Rutenio',101.07,'transition'],[45,'Rh','Rodio',102.906,'transition'],[46,'Pd','Paladio',106.42,'transition'],[47,'Ag','Plata',107.868,'transition'],[48,'Cd','Cadmio',112.414,'transition'],[49,'In','Indio',114.818,'post'],[50,'Sn','Estaño',118.710,'post'],[51,'Sb','Antimonio',121.760,'metalloid'],[52,'Te','Telurio',127.60,'metalloid'],[53,'I','Yodo',126.904,'halogen'],[54,'Xe','Xenón',131.293,'noble'],
[55,'Cs','Cesio',132.905,'alkali'],[56,'Ba','Bario',137.327,'alkaline'],
[57,'La','Lantano',138.905,'lanthanide'],[58,'Ce','Cerio',140.116,'lanthanide'],[59,'Pr','Praseodimio',140.908,'lanthanide'],[60,'Nd','Neodimio',144.242,'lanthanide'],[61,'Pm','Prometio',145,'lanthanide'],[62,'Sm','Samario',150.36,'lanthanide'],[63,'Eu','Europio',151.964,'lanthanide'],[64,'Gd','Gadolinio',157.25,'lanthanide'],[65,'Tb','Terbio',158.925,'lanthanide'],[66,'Dy','Disprosio',162.500,'lanthanide'],[67,'Ho','Holmio',164.930,'lanthanide'],[68,'Er','Erbio',167.259,'lanthanide'],[69,'Tm','Tulio',168.934,'lanthanide'],[70,'Yb','Iterbio',173.045,'lanthanide'],[71,'Lu','Lutecio',174.967,'lanthanide'],
[72,'Hf','Hafnio',178.49,'transition'],[73,'Ta','Tantalio',180.948,'transition'],[74,'W','Wolframio',183.84,'transition'],[75,'Re','Renio',186.207,'transition'],[76,'Os','Osmio',190.23,'transition'],[77,'Ir','Iridio',192.217,'transition'],[78,'Pt','Platino',195.084,'transition'],[79,'Au','Oro',196.967,'transition'],[80,'Hg','Mercurio',200.592,'transition'],[81,'Tl','Talio',204.38,'post'],[82,'Pb','Plomo',207.2,'post'],[83,'Bi','Bismuto',208.980,'post'],[84,'Po','Polonio',209,'post'],[85,'At','Astato',210,'halogen'],[86,'Rn','Radón',222,'noble'],
[87,'Fr','Francio',223,'alkali'],[88,'Ra','Radio',226,'alkaline'],
[89,'Ac','Actinio',227,'actinide'],[90,'Th','Torio',232.038,'actinide'],[91,'Pa','Protactinio',231.036,'actinide'],[92,'U','Uranio',238.029,'actinide'],[93,'Np','Neptunio',237,'actinide'],[94,'Pu','Plutonio',244,'actinide'],[95,'Am','Americio',243,'actinide'],[96,'Cm','Curio',247,'actinide'],[97,'Bk','Berkelio',247,'actinide'],[98,'Cf','Californio',251,'actinide'],[99,'Es','Einstenio',252,'actinide'],[100,'Fm','Fermio',257,'actinide'],[101,'Md','Mendelevio',258,'actinide'],[102,'No','Nobelio',259,'actinide'],[103,'Lr','Lawrencio',266,'actinide'],
[104,'Rf','Rutherfordio',267,'transition'],[105,'Db','Dubnio',268,'transition'],[106,'Sg','Seaborgio',269,'transition'],[107,'Bh','Bohrio',270,'transition'],[108,'Hs','Hasio',269,'transition'],[109,'Mt','Meitnerio',278,'transition'],[110,'Ds','Darmstadtio',281,'transition'],[111,'Rg','Roentgenio',282,'transition'],[112,'Cn','Copernicio',285,'transition'],[113,'Nh','Nihonio',286,'post'],[114,'Fl','Flerovio',289,'post'],[115,'Mc','Moscovio',290,'post'],[116,'Lv','Livermorio',293,'post'],[117,'Ts','Teneso',294,'halogen'],[118,'Og','Oganesón',294,'noble'],
].map(([z,sym,name,mass,cat]) => ({ z, sym, name, mass, cat }));

const CAT_LABEL = { alkali:'Alcalino', alkaline:'Alcalinotérreo', transition:'Transición', post:'Post-transición', metalloid:'Metaloide', nonmetal:'No metal', halogen:'Halógeno', noble:'Gas noble', lanthanide:'Lantánido', actinide:'Actínido' };
const GAS = new Set(['H','He','N','O','F','Ne','Cl','Ar','Kr','Xe','Rn','Og']);
const LIQUID = new Set(['Br','Hg']);

function pos(z) {
  if (z === 1) return { period:1, group:1 };
  if (z === 2) return { period:1, group:18 };
  if (z >= 3 && z <= 10) return { period:2, group:[1,2,13,14,15,16,17,18][z-3] };
  if (z >= 11 && z <= 18) return { period:3, group:[1,2,13,14,15,16,17,18][z-11] };
  if (z >= 19 && z <= 36) return { period:4, group:z-18 };
  if (z >= 37 && z <= 54) return { period:5, group:z-36 };
  if (z === 55 || z === 56) return { period:6, group:z-54 };
  if (z >= 57 && z <= 71) return { f:1, frow:1, fcol:z-57 };
  if (z >= 72 && z <= 86) return { period:6, group:z-68 };
  if (z === 87 || z === 88) return { period:7, group:z-86 };
  if (z >= 89 && z <= 103) return { f:1, frow:2, fcol:z-89 };
  if (z >= 104 && z <= 118) return { period:7, group:z-100 };
}

/* ══════════════════════════════════════════════
   RENDER TABLA
══════════════════════════════════════════════ */
const ptable = $('#ptable'), fblock = $('#fblock');
let cells = [];
ELEMENTS.forEach(el => {
  const p = pos(el.z);
  const cell = document.createElement('div');
  cell.className = 'elem'; cell.dataset.z = el.z; cell.dataset.cat = el.cat;
  cell.style.borderLeftColor = `var(--c-${el.cat})`;
  cell.innerHTML = `<div class="z">${el.z}</div><div class="sym">${el.sym}</div><div class="nm">${el.name}</div>`;
  cell.onclick = () => showDetail(el);
  if (p.f) {
    fblock.appendChild(cell);
    cell.style.gridColumn = (p.fcol + 3) + '';
    cell.style.gridRow = p.frow;
  } else {
    ptable.appendChild(cell);
    cell.style.gridColumn = p.group;
    cell.style.gridRow = p.period;
  }
  cells.push(cell);
});
// placeholders de enlace en la tabla principal
[[6,3,'57–71'],[7,3,'89–103']].forEach(([period,group,label]) => {
  const ph = document.createElement('div');
  ph.className = 'fplaceholder'; ph.textContent = label;
  ph.style.gridColumn = group; ph.style.gridRow = period;
  ph.onclick = () => fblock.scrollIntoView({ behavior:'smooth', block:'center' });
  ptable.appendChild(ph);
});

/* ══════════════════════════════════════════════
   LEYENDA / FILTROS
══════════════════════════════════════════════ */
let activeFilters = new Set(Object.keys(CAT_LABEL));
const legend = $('#legend');
legend.innerHTML = Object.entries(CAT_LABEL).map(([cat,label]) =>
  `<div class="leg-item" data-cat="${cat}"><span class="dot" style="background:var(--c-${cat})"></span>${label}</div>`).join('');
legend.querySelectorAll('.leg-item').forEach(el => el.onclick = () => {
  const cat = el.dataset.cat;
  if (activeFilters.has(cat)) activeFilters.delete(cat); else activeFilters.add(cat);
  el.classList.toggle('off');
  applyFilters();
});
function applyFilters() {
  const q = $('#search').value.trim().toLowerCase();
  cells.forEach(cell => {
    const el = ELEMENTS.find(e => e.z == cell.dataset.z);
    const matchesCat = activeFilters.has(el.cat);
    const matchesSearch = !q || el.name.toLowerCase().includes(q) || el.sym.toLowerCase().includes(q) || String(el.z) === q;
    cell.classList.toggle('dim', !(matchesCat && matchesSearch));
  });
}
$('#search').addEventListener('input', applyFilters);

/* ══════════════════════════════════════════════
   DETALLE
══════════════════════════════════════════════ */
function showDetail(el) {
  cells.forEach(c => c.classList.toggle('active', +c.dataset.z === el.z));
  const p = pos(el.z);
  $('#detail').classList.add('show');
  $('#d-sym').textContent = el.sym;
  $('#d-sym').style.color = `var(--c-${el.cat})`;
  $('#d-name').textContent = el.name;
  $('#d-sub').textContent = `Z = ${el.z} · ${CAT_LABEL[el.cat]}`;
  $('#d-mass').textContent = el.mass;
  $('#d-group').textContent = p.f ? '3 (f-block)' : p.group;
  $('#d-period').textContent = p.f ? (p.frow === 1 ? '6 (lantánidos)' : '7 (actínidos)') : p.period;
  $('#d-state').textContent = GAS.has(el.sym) ? 'Gas' : LIQUID.has(el.sym) ? 'Líquido' : 'Sólido';
  $('#detail').scrollIntoView({ behavior:'smooth', block:'nearest' });
}
showDetail(ELEMENTS.find(e => e.z === 79)); // Oro por defecto
</script>
</body>
</html>
