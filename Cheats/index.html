<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheat::hub</title>
<meta name="description" content="Chuletas de git, regex, atajos y códigos HTTP con buscador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #0c0c10;
    --surface:      #13131a;
    --surface-2:    #1c1c26;
    --border:       #25253a;
    --text:         #e2e2f0;
    --text-2:       #8080a0;
    --text-3:       #454560;
    --accent:       #e8a030;
    --accent-dim:   #271d08;
    --good:         #34d399;
    --good-dim:     #0b2218;
    --bad:          #f87171;
    --bad-dim:      #2a1212;
    --font-ui:      'Inter', system-ui, sans-serif;
    --font-mono:    'IBM Plex Mono', monospace;
    --radius:       10px;
    --radius-lg:    16px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }

  header { text-align: center; margin-bottom: 1.75rem; }
  .logo { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 600; letter-spacing: -0.03em; }
  .logo span { color: var(--accent); }
  .tagline {
    font-size: 12.5px;
    color: var(--text-3);
    margin-top: 4px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .shell { width: 100%; max-width: 720px; }

  /* ── tabs ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .tab {
    flex: 1 1 0;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: border-color 0.15s, color 0.15s;
  }
  .tab .tab-icon { font-family: var(--font-mono); color: var(--text-3); }
  .tab:hover { border-color: #40405a; }
  .tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
  .tab.active .tab-icon { color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
  }

  /* ── buscador ── */
  .search-wrap { position: relative; margin-bottom: 1rem; }
  .search-input {
    width: 100%;
    appearance: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 11px 44px 11px 12px;
    outline: none;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:focus { border-color: var(--accent); }
  .kbd {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 7px;
    pointer-events: none;
  }

  .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  /* ── filas ── */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .item:hover { border-color: #40405a; }
  .item-main { flex: 1; min-width: 0; }
  .item-code {
    font-family: var(--font-mono);
    font-size: 13.5px;
    color: var(--text);
    overflow-x: auto;
    white-space: nowrap;
    display: block;
    background: none;
  }
  .item-desc { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
  .item-tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--text-3);
    text-transform: uppercase;
    flex: 0 0 auto;
  }
  .item-code.http { font-weight: 600; }
  .item-code.c2 { color: var(--good); }
  .item-code.c3 { color: var(--accent); }
  .item-code.c4, .item-code.c5 { color: var(--bad); }

  .btn-copy {
    font-family: var(--font-ui);
    font-size: 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    color: var(--text-2);
    cursor: pointer;
    flex: 0 0 auto;
    min-width: 62px;
  }
  .btn-copy:hover { border-color: #40405a; }

  .empty {
    text-align: center;
    font-size: 13px;
    color: var(--text-2);
    padding: 2rem 0.5rem;
    display: none;
  }

  .footer-note {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 1.5rem;
    font-family: var(--font-mono);
  }

  @media (max-width: 480px) {
    .item-tag { display: none; }
    .card { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">cheat<span>::</span>hub</div>
  <div class="tagline">Chuletas de git, regex, atajos y HTTP</div>
</header>

<div class="shell">

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all"><span class="tab-icon">*</span>Todo</button>
    <button class="tab" data-cat="git"><span class="tab-icon">$</span>Git</button>
    <button class="tab" data-cat="regex"><span class="tab-icon">.*</span>Regex</button>
    <button class="tab" data-cat="keys"><span class="tab-icon">⌘</span>Atajos</button>
    <button class="tab" data-cat="http"><span class="tab-icon">#</span>HTTP</button>
  </div>

  <div class="card">
    <div class="search-wrap">
      <input class="search-input" id="search" type="text" placeholder="Buscar comando, patrón, atajo o código…" autocomplete="off" spellcheck="false">
      <span class="kbd">/</span>
    </div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty">Sin resultados. Prueba con otra palabra.</div>
  </div>

  <div class="footer-note">Todo se procesa en tu navegador — nada se envía a ningún servidor.</div>
</div>

  function copyText(text, btn) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(function () {
      var original = btn.textContent;
      btn.textContent = 'Copiado ✓';
      setTimeout(function () { btn.textContent = original; }, 1200);
    }).catch(function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

    code.textContent = item[1];

    var desc = document.createElement('div');
    desc.className = 'item-desc';
    desc.textContent = item[2];

    main.appendChild(code);
    main.appendChild(desc);

    var tag = document.createElement('span');
    tag.className = 'item-tag';
    tag.textContent = currentCat === 'all' ? CAT_LABEL[cat] + ' · ' + item[3] : item[3];

    btn.type = 'button';
    btn.textContent = 'Copiar';

    row.addEventListener('click', function () { copyText(item[1], btn); });

    row.appendChild(main);
    row.appendChild(tag);
    row.appendChild(btn);
    return row;
  }

  function render() {
    var q = norm(searchEl.value.trim());
    var words = q ? q.split(/\s+/) : [];
    var matches = DATA.filter(function (item) {
      if (currentCat !== 'all' && item[0] !== currentCat) return false;
      var hay = norm(item[1] + ' ' + item[2] + ' ' + item[3] + ' ' + CAT_LABEL[item[0]]);
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    });

    listEl.textContent = '';
    matches.forEach(function (item) { listEl.appendChild(buildRow(item)); });

    emptyEl.style.display = matches.length ? 'none' : 'block';
    countEl.textContent = matches.length + (matches.length === 1 ? ' RESULTADO' : ' RESULTADOS');
  }

  tabsEl.addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    tabsEl.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
    render();
  });

  searchEl.addEventListener('input', render);

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault();
      searchEl.focus();
    } else if (e.key === 'Escape') {
      searchEl.value = '';
      searchEl.blur();
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
