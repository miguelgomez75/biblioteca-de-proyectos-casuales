<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>repo::path</title>
<meta name="description" content="Navegador en cascada de carpetas de GitHub — selecciona nivel a nivel hasta llegar al archivo y obtén su ruta relativa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #0c0c10;
    --surface:      #13131a;
    --surface-2:    #1c1c26;
    --border:       #25253a;
    --text:         #e2e2f0;
    --text-2:       #8080a0;
    --text-3:       #454560;
    --accent:       #e8a030;
    --accent-dim:   #271d08;
    --good:         #34d399;
    --good-dim:     #0b2218;
    --bad:          #f87171;
    --bad-dim:      #2a1212;
    --font-ui:      'Inter', system-ui, sans-serif;
    --font-mono:    'IBM Plex Mono', monospace;
    --radius:       10px;
    --radius-lg:    16px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }

  header { text-align: center; margin-bottom: 1.75rem; }
  .logo {
    font-family: var(--font-mono);
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .logo span { color: var(--accent); }
  .tagline {
    font-size: 12.5px;
    color: var(--text-3);
    margin-top: 4px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .shell { width: 100%; max-width: 640px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 10px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1.2fr 1.2fr 0.8fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

  .field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 12px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field input::placeholder { color: var(--text-3); }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  button.btn {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 15px;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color 0.15s, transform 0.08s, opacity 0.15s;
  }
  button.btn:hover { border-color: #40405a; }
  button.btn:active { transform: scale(0.97); }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { opacity: 0.9; border-color: var(--accent); }

  .status {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-2);
  }
  .status.error { color: var(--bad); }
  .status.ok { color: var(--good); }

  /* ── selects en cascada ── */
  .levels { display: flex; flex-direction: column; gap: 10px; }

  .level-row { display: flex; flex-direction: column; gap: 6px; }
  .level-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
  }

  select.level-select { display: none; } /* legado, ya no se usa */

  .combo { position: relative; }
  .combo-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 12px;
  }
  .combo-input:focus { outline: none; border-color: var(--accent); }
  .combo-input::placeholder { color: var(--text-3); }
  .combo-input:disabled { opacity: 0.4; cursor: not-allowed; }

  .combo-list {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 240px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .combo-list.open { display: block; }

  .combo-item {
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .combo-item:hover, .combo-item.active { background: var(--accent-dim); color: var(--accent); }
  .combo-empty {
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-3);
  }

  .levels-empty {
    color: var(--text-3);
    font-family: var(--font-mono);
    font-size: 12.5px;
    text-align: center;
    padding: 20px 16px;
  }

  /* ── resultado ── */
  .result-box {
    background: var(--bg);
    border: 1px solid var(--good);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-top: 4px;
    display: none;
  }
  .result-box.show { display: block; }
  .result-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--good);
    margin-bottom: 6px;
  }
  .result-path {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text);
    word-break: break-all;
    margin-bottom: 10px;
  }
  .result-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .thumb-wrap {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    max-width: 220px;
    background: var(--surface-2);
  }
  .thumb-wrap img { display: block; width: 100%; height: auto; }

  footer {
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="logo">repo<span>::</span>path</div>
  <div class="tagline">navegador en cascada de github</div>
</header>

<div class="shell">

  <div class="card">
    <div class="section-title">Repositorio</div>
    <div class="form-grid">
      <div class="field">
        <label for="owner">Owner</label>
        <input id="owner" type="text" placeholder="ej. octocat" value="miguelgomez75">
      </div>
      <div class="field">
        <label for="repo">Repositorio</label>
        <input id="repo" type="text" placeholder="ej. hello-world" value="biblioteca-de-proyectos-casuales">
      </div>
      <div class="field">
        <label for="branch">Branch</label>
        <input id="branch" type="text" placeholder="main" value="Biblioteca-Mc">
      </div>
    </div>
    <div class="form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom:0;">
      <div class="field">
        <label for="basePath">Carpeta de inicio</label>
        <input id="basePath" type="text" placeholder="ej. imgs" value="imgs">
      </div>
      <div class="field">
        <label for="token">Token (opcional)</label>
        <input id="token" type="password" placeholder="ghp_...">
      </div>
    </div>
    <div class="controls-row">
      <button class="btn btn-primary" id="btnStart">Empezar navegación</button>
      <span class="status" id="statusEl"></span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Navegación</div>
    <div class="levels" id="levelsBox">
      <div class="levels-empty">Pulsa «Empezar navegación» para listar la carpeta de inicio.</div>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-label">Ruta relativa</div>
    <div class="result-path" id="resultPath"></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="btnCopyResult">Copiar ruta</button>
      <button class="btn" id="btnReset">Volver a empezar</button>
    </div>
    <div class="thumb-wrap" id="thumbWrap" style="display:none">
      <img id="thumbImg" alt="vista previa">
    </div>
  </div>

</div>

<footer>Usa la GitHub Contents API · las peticiones se hacen directamente desde tu navegador.</footer>

<script>
(function () {
  "use strict";

  var elOwner = document.getElementById('owner');
  var elRepo = document.getElementById('repo');
  var elBranch = document.getElementById('branch');
  var elBasePath = document.getElementById('basePath');
  var elToken = document.getElementById('token');
  var elStatus = document.getElementById('statusEl');
  var elLevelsBox = document.getElementById('levelsBox');
  var elResultBox = document.getElementById('resultBox');
  var elResultPath = document.getElementById('resultPath');
  var elThumbWrap = document.getElementById('thumbWrap');
  var elThumbImg = document.getElementById('thumbImg');
  var btnStart = document.getElementById('btnStart');
  var btnCopyResult = document.getElementById('btnCopyResult');
  var btnReset = document.getElementById('btnReset');

  var config = null;   // { owner, repo, branch, token, base }
  var basePrefix = ''; // carpeta de inicio, para recortarla de la ruta final

  function setStatus(msg, type) {
    elStatus.textContent = msg || '';
    elStatus.className = 'status' + (type ? ' ' + type : '');
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).catch(function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  function apiHeaders() {
    var headers = { Accept: 'application/vnd.github+json' };
    if (config.token) headers.Authorization = 'Bearer ' + config.token;
    return headers;
  }

  /* ── ls de una carpeta vía Contents API ── */
  async function lsDir(path) {
    var url = 'https://api.github.com/repos/' + encodeURIComponent(config.owner) + '/' +
               encodeURIComponent(config.repo) + '/contents/' + path.split('/').map(encodeURIComponent).join('/') +
               '?ref=' + encodeURIComponent(config.branch);
    var res = await fetch(url, { headers: apiHeaders() });
    if (!res.ok) {
      var body = await res.json().catch(function () { return {}; });
      throw new Error('Error ' + res.status + ': ' + (body.message || res.statusText));
    }
    var data = await res.json();
    if (!Array.isArray(data)) throw new Error('Esa ruta no es una carpeta.');
    // carpetas primero, luego archivos, alfabético
    data.sort(function (a, b) {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
    return data;
  }

  /* ── construir un nivel de combobox buscable ── */
  function buildLevelCombobox(items, levelIndex, parentPath) {
    var row = document.createElement('div');
    row.className = 'level-row';

    var label = document.createElement('div');
    label.className = 'level-label';
    label.textContent = 'Nivel ' + (levelIndex + 1) + (parentPath ? ' — ' + parentPath : '');
    row.appendChild(label);

    var combo = document.createElement('div');
    combo.className = 'combo';

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'combo-input';
    input.placeholder = 'Escribe para buscar (' + items.length + ') o haz click...';
    input.autocomplete = 'off';

    var list = document.createElement('div');
    list.className = 'combo-list';

    combo.appendChild(input);
    combo.appendChild(list);
    row.appendChild(combo);

    var activeIndex = -1;
    var visibleItems = items.slice();

    function selectItem(item) {
      input.value = item.name;
      list.classList.remove('open');

      // al elegir en este nivel, se eliminan todos los niveles posteriores
      var rows = Array.prototype.slice.call(elLevelsBox.querySelectorAll('.level-row'));
      var thisRowIndex = rows.indexOf(row);
      for (var i = rows.length - 1; i > thisRowIndex; i--) {
        rows[i].remove();
      }
      elResultBox.classList.remove('show');

      if (item.type === 'dir') {
        handleSelectDir(item.path, levelIndex + 1);
      } else {
        handleSelectFile(item);
      }
    }

    function renderList(filterText) {
      var filter = (filterText || '').trim().toLowerCase();
      visibleItems = filter ? items.filter(function (it) {
        return it.name.toLowerCase().indexOf(filter) !== -1;
      }) : items;

      list.innerHTML = '';
      activeIndex = -1;

      if (visibleItems.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'combo-empty';
        empty.textContent = 'Sin coincidencias.';
        list.appendChild(empty);
        return;
      }

      visibleItems.forEach(function (item) {
        var opt = document.createElement('div');
        opt.className = 'combo-item';
        opt.textContent = (item.type === 'dir' ? '📁 ' : '📄 ') + item.name;
        opt.addEventListener('mousedown', function (e) {
          e.preventDefault(); // evita que el blur cierre la lista antes del click
          selectItem(item);
        });
        list.appendChild(opt);
      });
    }

    function highlight(idx) {
      var opts = list.querySelectorAll('.combo-item');
      opts.forEach(function (o) { o.classList.remove('active'); });
      if (idx >= 0 && idx < opts.length) {
        opts[idx].classList.add('active');
        opts[idx].scrollIntoView({ block: 'nearest' });
      }
      activeIndex = idx;
    }

    input.addEventListener('focus', function () {
      renderList(input.value);
      list.classList.add('open');
    });

    input.addEventListener('input', function () {
      renderList(input.value);
      list.classList.add('open');
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!list.classList.contains('open')) { renderList(input.value); list.classList.add('open'); }
        highlight(Math.min(activeIndex + 1, visibleItems.length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlight(Math.max(activeIndex - 1, 0));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex >= 0 && visibleItems[activeIndex]) {
          selectItem(visibleItems[activeIndex]);
        } else if (visibleItems.length === 1) {
          selectItem(visibleItems[0]);
        }
      } else if (e.key === 'Escape') {
        list.classList.remove('open');
      }
    });

    document.addEventListener('click', function (e) {
      if (!combo.contains(e.target)) list.classList.remove('open');
    });

    return row;
  }

  async function handleSelectDir(path, nextLevelIndex) {
    setStatus('Listando ' + path + ' ...', '');
    try {
      var items = await lsDir(path);
      setStatus('Listo ✓', 'ok');
      var row = buildLevelCombobox(items, nextLevelIndex, path);
      elLevelsBox.appendChild(row);
    } catch (err) {
      setStatus(err.message || 'Error al listar la carpeta.', 'error');
    }
  }

  function relativePath(fullPath) {
    var rel = fullPath;
    if (basePrefix && fullPath.indexOf(basePrefix + '/') === 0) {
      rel = fullPath.slice(basePrefix.length + 1);
    }
    // codifica cada segmento (espacios -> %20, etc.) sin tocar las barras "/"
    return rel.split('/').map(encodeURIComponent).join('/');
  }

  function handleSelectFile(item) {
    var rel = relativePath(item.path);
    elResultPath.textContent = rel;
    elResultBox.classList.add('show');
    copyText(rel);
    setStatus('Ruta copiada ✓', 'ok');

    var isImage = /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(item.name);
    if (isImage && item.download_url) {
      elThumbImg.src = item.download_url;
      elThumbWrap.style.display = 'block';
    } else {
      elThumbWrap.style.display = 'none';
      elThumbImg.src = '';
    }
  }

  btnCopyResult.addEventListener('click', function () {
    copyText(elResultPath.textContent);
    setStatus('Ruta copiada ✓', 'ok');
  });

  btnReset.addEventListener('click', function () {
    startNavigation();
  });

  async function startNavigation() {
    var owner = elOwner.value.trim();
    var repo = elRepo.value.trim();
    var branch = elBranch.value.trim() || 'main';
    var token = elToken.value.trim();
    var base = elBasePath.value.trim().replace(/^\/+|\/+$/g, '');

    if (!owner || !repo) {
      setStatus('Completa owner y repositorio.', 'error');
      return;
    }

    config = { owner: owner, repo: repo, branch: branch, token: token };
    basePrefix = base;

    elLevelsBox.innerHTML = '';
    elResultBox.classList.remove('show');
    elThumbWrap.style.display = 'none';

    setStatus('Listando ' + (base || '/') + ' ...', '');
    try {
      var items = await lsDir(base || '');
      setStatus('Listo ✓', 'ok');
      var row = buildLevelCombobox(items, 0, base);
      elLevelsBox.appendChild(row);
    } catch (err) {
      setStatus(err.message || 'Error al listar la carpeta de inicio.', 'error');
      elLevelsBox.innerHTML = '<div class="levels-empty">No se pudo listar la carpeta de inicio.</div>';
    }
  }

  btnStart.addEventListener('click', startNavigation);
  [elOwner, elRepo, elBranch, elBasePath, elToken].forEach(function (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') startNavigation();
    });
  });

})();
</script>
</body>
</html>
