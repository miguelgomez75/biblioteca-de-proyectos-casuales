<style>

    --bg: #0c0c10; --surface: #13131a; --surface-2: #1c1c26; --border: #25253a;

    --good: #34d399; --good-dim: #0b2218;
    --font-ui: 'Inter', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', monospace;
    --radius: 10px; --radius-lg: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 3rem;
  }
  header { text-align: center; margin-bottom: 1.5rem; }
  .logo { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 600; letter-spacing: -0.03em; }
  .logo span { color: var(--accent); }
  .tagline { font-size: 12.5px; color: var(--text-3); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }

  .shell { width: 100%; max-width: 600px; }

  .date-line { text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }

  .message-card {
    background: linear-gradient(165deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 2.4rem 2rem; text-align: center; position: relative; overflow: hidden;
  }
  .message-card::before {
    content: '"'; position: absolute; top: -18px; left: 14px; font-size: 110px; font-family: Georgia, serif;
    color: var(--accent); opacity: 0.12; line-height: 1;
  }
  .message-text {
    font-size: 21px; line-height: 1.55; font-weight: 500; position: relative; z-index: 1;
  }
  .message-emoji { font-size: 34px; margin-bottom: 14px; }

  .streak-row {
    display: flex; justify-content: center; gap: 18px; margin-top: 1.4rem; flex-wrap: wrap;
  }
  .streak-stat { text-align: center; }
  .streak-val { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--accent); }
  .streak-label { font-size: 10.5px; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.4rem; margin-top: 1rem; }
  .section-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }

  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .history-item {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px;
    font-size: 12.5px; color: var(--text-2); display: flex; gap: 10px;
  }
  .history-date { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); flex: 0 0 auto; white-space: nowrap; }
  .empty-hint { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); text-align: center; padding: 14px 0; }

  .footer-note { text-align: center; font-size: 11.5px; color: var(--text-3); margin-top: 1.5rem; font-family: var(--font-mono); line-height: 1.6; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message-card.animate { animation: fadeIn 0.4s ease; }
</style>
<!-- bc-theme --><script src="../theme.js"></script>

<header>
  <div class="logo">moralsupport<span>::</span>hub</div>

</header>

    </div>
    <div class="streak-stat">
      <div class="streak-val" id="totalDays">0</div>

    </div>
  </div>

  <div class="card">
    <div class="section-title">Mensajes anteriores</div>
    <div class="history-list" id="historyList"></div>
  </div>

    El mensaje de hoy es el mismo para todo el mundo que abra la página hoy — no aleatorio en cada visita.<br>
    Tu racha se guarda en este navegador — nada se envía a ningún servidor.
  </div>
</div>

  var EMOJIS = ['✨', '🌱', '☀️', '🌤️', '💛', '🫂', '🌊', '🍃', '🕊️', '🌼', '⭐', '🌈', '🪴', '🔋', '🧭', '🎨', '🚀', '🔮', '🍀', '🕯️'];

  function $(id) { return document.getElementById(id); }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  function messageForDate(dateStr) {
    var h = hashStr(dateStr);
    return {
      text: MESSAGES[h % MESSAGES.length],
      emoji: EMOJIS[h % EMOJIS.length]
    };
  }

  function fmtDateLong(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function loadStreak() {
    try { var raw = localStorage.getItem(STREAK_KEY); return raw ? JSON.parse(raw) : { days: [], lastDate: null }; }
    catch (e) { return { days: [], lastDate: null }; }
  }
  function saveStreak(s) { try { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch (e) {} }

  function updateStreak() {
    var s = loadStreak();
    var today = todayISO();
    if (s.days.indexOf(today) === -1) s.days.push(today);
    s.days = s.days.sort();

    var streak = 0;
    var cursor = today;
    var daySet = {};
    s.days.forEach(function (d) { daySet[d] = true; });
    while (daySet[cursor]) {
      streak++;
      var d = new Date(cursor + 'T00:00:00');
      d.setDate(d.getDate() - 1);
      cursor = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    s.lastDate = today;
    saveStreak(s);
    return { streak: streak, total: s.days.length, allDays: s.days };
  }

  function renderHistory(days) {
    var box = $('historyList');
    box.innerHTML = '';
    if (!days.length) { box.innerHTML = '<div class="empty-hint">Aún no hay historial.</div>'; return; }
    var recent = days.slice().sort().reverse().slice(0, 14);
    recent.forEach(function (d) {
      var row = document.createElement('div');
      row.className = 'history-item';
      var date = document.createElement('div');
      date.className = 'history-date';
      var dd = new Date(d + 'T00:00:00');
      date.textContent = dd.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
      var msg = document.createElement('div');
      msg.textContent = messageForDate(d).text;
      row.appendChild(date);
      row.appendChild(msg);
      box.appendChild(row);
    });
  }

  function render() {
    var today = todayISO();
    var m = messageForDate(today);
    $('dateLine').textContent = fmtDateLong(today);
    $('messageEmoji').textContent = m.emoji;
    $('messageText').textContent = m.text;
    $('messageCard').classList.add('animate');

    var stats = updateStreak();
    $('streakDays').textContent = stats.streak;
    $('totalDays').textContent = stats.total;
    renderHistory(stats.allDays);
  }

  render();
