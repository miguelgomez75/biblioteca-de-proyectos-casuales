<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>solar::hub — Sistema solar 3D</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0c0c10;--surface:#13131a;--surface-2:#1c1c26;--border:#25253a;--border-2:#40405a;--text:#e2e2f0;--text-2:#8080a0;--text-3:#454560;--accent:#e8a030;--accent-dim:#271d08;--font-ui:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;--radius:10px;--radius-lg:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui)}
#scene-wrap{position:fixed;inset:0}
#scene-wrap canvas{display:block;touch-action:none}

header{position:fixed;top:calc(1.1rem + env(safe-area-inset-top,0px));left:1.2rem;z-index:5;pointer-events:none}
.logo{font:600 1.5rem var(--font-mono);letter-spacing:-.03em}.logo span{color:var(--accent)}
.tagline{font-size:11px;color:var(--text-3);margin-top:2px;letter-spacing:.06em;text-transform:uppercase}

.panel{position:fixed;z-index:5;background:rgba(19,19,26,.88);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem}
#toolbar{bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));left:1.2rem;right:1.2rem;max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.tb-group{display:flex;align-items:center;gap:8px}
.tb-label{font:10.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font:500 12.5px var(--font-ui);cursor:pointer;transition:border-color .15s,transform .08s}
.btn:hover{border-color:var(--border-2)}.btn:active{transform:scale(.96)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn.icon{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px}
input[type=range]{accent-color:var(--accent);width:100px}
.chk-row{display:flex;align-items:center;gap:6px;font:12px var(--font-ui);color:var(--text-2)}
.chk-row input{accent-color:var(--accent)}

#planet-list{top:calc(1.1rem + env(safe-area-inset-top,0px));right:1.2rem;width:190px;max-height:70vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.planet-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font:12.5px var(--font-ui)}
.planet-item:hover{background:var(--surface-2)}
.planet-item.active{background:var(--accent-dim);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

#info{bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));right:1.2rem;width:250px;display:none}
#info.show{display:block}
#info-name{font:600 1.1rem var(--font-mono);margin-bottom:2px}
#info-sub{font:11px var(--font-mono);color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.6rem}
#info-desc{font:12.5px/1.5 var(--font-ui);color:var(--text-2);margin-bottom:.7rem}
.info-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font:11px var(--font-mono);color:var(--text-3)}
.info-stats b{color:var(--text-2);display:block;font:12px var(--font-ui)}
#info-close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px}
#info-close:hover{color:var(--text)}

#hint{position:fixed;top:calc(1.1rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;font:11.5px var(--font-ui);color:var(--text-3);background:rgba(19,19,26,.7);border:1px solid var(--border);border-radius:20px;padding:6px 14px;pointer-events:none;transition:opacity .5s}

@media(max-width:720px){#planet-list{width:150px;font-size:11.5px}#info{width:200px}#toolbar{gap:8px;padding:.7rem}.tb-label{display:none}}
</style>
</head>
<body>
<div id="scene-wrap"></div>

<header><div class="logo">solar<span>::</span>hub</div><div class="tagline">Sistema solar en 3D · escala no realista</div></header>
<div id="hint">Arrastra para orbitar · rueda para zoom · clic en un planeta</div>

<div class="panel" id="planet-list"></div>

<div class="panel" id="info">
  <button id="info-close">✕</button>
  <div id="info-name"></div>
  <div id="info-sub"></div>
  <div id="info-desc"></div>
  <div class="info-stats">
    <div><b id="stat-diam"></b>Diámetro</div>
    <div><b id="stat-dist"></b>Dist. al Sol</div>
    <div><b id="stat-period"></b>Año</div>
    <div><b id="stat-day"></b>Día</div>
  </div>
</div>

<div class="panel" id="toolbar">
  <button class="btn icon go" id="play-btn">⏸</button>
  <div class="tb-group"><span class="tb-label">Velocidad</span><input type="range" id="speed" min="0" max="200" value="40"></div>
  <div class="chk-row"><input type="checkbox" id="chk-orbits" checked><label for="chk-orbits">Órbitas</label></div>
  <div class="chk-row"><input type="checkbox" id="chk-labels" checked><label for="chk-labels">Etiquetas</label></div>
  <button class="btn" id="reset-btn">Reiniciar vista</button>
</div>

<script>
const $ = s => document.querySelector(s);

/* ══════════════════════════════════════════════
   DATOS (escala visual, no astronómica real)
══════════════════════════════════════════════ */
const PLANETS = [
  { name:'Mercurio', color:0x9c9088, r:1.1, dist:14, periodDays:88,  daySec:'58.6 d', diamKm:'4 879 km', distAU:'0.39 UA', desc:'El planeta más pequeño y el más cercano al Sol, con temperaturas extremas entre el día y la noche.' },
  { name:'Venus',    color:0xe0c088, r:1.7, dist:19, periodDays:225, daySec:'243 d',  diamKm:'12 104 km', distAU:'0.72 UA', desc:'El más caliente del sistema solar por su densa atmósfera de CO₂ y su efecto invernadero extremo.' },
  { name:'Tierra',   color:0x3d7dd8, r:1.8, dist:25, periodDays:365, daySec:'24 h',   diamKm:'12 742 km', distAU:'1 UA',    desc:'Nuestro hogar, el único planeta conocido con vida y agua líquida en superficie.' },
  { name:'Marte',    color:0xc1440e, r:1.3, dist:32, periodDays:687, daySec:'24.6 h', diamKm:'6 779 km', distAU:'1.52 UA', desc:'El planeta rojo, con el volcán más grande del sistema solar y evidencias de agua antigua.' },
  { name:'Júpiter',  color:0xd8ac7a, r:5.4, dist:46, periodDays:4333,daySec:'9.9 h',  diamKm:'139 820 km', distAU:'5.2 UA', desc:'El gigante gaseoso más grande, con una Gran Mancha Roja: una tormenta más grande que la Tierra.' },
  { name:'Saturno',  color:0xe3c98a, r:4.6, dist:62, periodDays:10759,daySec:'10.7 h', diamKm:'116 460 km', distAU:'9.58 UA', desc:'Famoso por su espectacular sistema de anillos de hielo y roca.', ring:true },
  { name:'Urano',    color:0x9fd8d8, r:2.9, dist:76, periodDays:30687,daySec:'17.2 h', diamKm:'50 724 km', distAU:'19.2 UA', desc:'Gira casi de lado: su eje está inclinado unos 98°, único entre los planetas.' },
  { name:'Neptuno',  color:0x4468e0, r:2.8, dist:88, periodDays:60190,daySec:'16.1 h', diamKm:'49 244 km', distAU:'30.1 UA', desc:'El planeta más ventoso, con rachas que superan los 2 000 km/h.' },
];

/* ══════════════════════════════════════════════
   ESCENA THREE.JS
══════════════════════════════════════════════ */
const wrap = $('#scene-wrap');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 2000);
let camDist = 130, camTheta = 0.9, camPhi = 1.1, camTarget = new THREE.Vector3(0,0,0);
function updateCamera(){
  camera.position.set(
    camTarget.x + camDist*Math.sin(camPhi)*Math.sin(camTheta),
    camTarget.y + camDist*Math.cos(camPhi),
    camTarget.z + camDist*Math.sin(camPhi)*Math.cos(camTheta)
  );
  camera.lookAt(camTarget);
}
updateCamera();

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
wrap.appendChild(renderer.domElement);

/* estrellas de fondo */
{
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2500, pos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 400 + Math.random()*600, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0x8888aa, size:1.1, sizeAttenuation:true })));
}

/* sol */
const sun = new THREE.Mesh(new THREE.SphereGeometry(6,32,32), new THREE.MeshBasicMaterial({ color:0xe8a030 }));
scene.add(sun);
scene.add(new THREE.PointLight(0xfff4d8, 2.2, 0, 0));
scene.add(new THREE.AmbientLight(0x404050, 0.5));
{ // glow simple
  const glow = new THREE.Mesh(new THREE.SphereGeometry(8,32,32), new THREE.MeshBasicMaterial({ color:0xe8a030, transparent:true, opacity:0.15 }));
  scene.add(glow);
}

const orbitGroup = new THREE.Group(); scene.add(orbitGroup);
const bodies = PLANETS.map(p => {
  const pivot = new THREE.Object3D(); scene.add(pivot);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 28, 28), new THREE.MeshStandardMaterial({ color:p.color, roughness:0.85, metalness:0.05 }));
  mesh.position.x = p.dist;
  pivot.add(mesh);
  if (p.ring) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(p.r*1.5, p.r*2.4, 48), new THREE.MeshBasicMaterial({ color:0xcbb98a, side:THREE.DoubleSide, transparent:true, opacity:0.6 }));
    ring.rotation.x = Math.PI/2 - 0.4;
    mesh.add(ring);
  }
  // órbita (línea)
  const curve = new THREE.EllipseCurve(0,0,p.dist,p.dist,0,Math.PI*2);
  const pts = curve.getPoints(128).map(pt => new THREE.Vector3(pt.x,0,pt.y));
  const orbitLine = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color:0x40405a, transparent:true, opacity:0.5 }));
  orbitGroup.add(orbitLine);
  // etiqueta
  const label = document.createElement('div');
  label.textContent = p.name;
  label.style.cssText = 'position:fixed;font:500 11px "Inter",sans-serif;color:#c8c8dc;background:rgba(19,19,26,.72);padding:2px 7px;border-radius:6px;pointer-events:none;transform:translate(-50%,-140%);white-space:nowrap;z-index:4;';
  document.body.appendChild(label);

  return { data:p, pivot, mesh, label, angle: Math.random()*Math.PI*2 };
});

/* ══════════════════════════════════════════════
   CONTROLES DE CÁMARA (drag + wheel)
══════════════════════════════════════════════ */
let dragging = false, lastX=0, lastY=0;
renderer.domElement.addEventListener('pointerdown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
addEventListener('pointerup', () => dragging=false);
addEventListener('pointermove', e => {
  if(!dragging) return;
  camTheta -= (e.clientX-lastX)*0.006;
  camPhi = Math.min(Math.PI-0.15, Math.max(0.15, camPhi - (e.clientY-lastY)*0.006));
  lastX=e.clientX; lastY=e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.min(320, Math.max(12, camDist + e.deltaY*0.06));
  updateCamera();
}, { passive:false });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ══════════════════════════════════════════════
   UI — lista de planetas, info, toolbar
══════════════════════════════════════════════ */
const listEl = $('#planet-list');
listEl.innerHTML = bodies.map((b,i) => `<div class="planet-item" data-i="${i}"><span class="dot" style="background:#${b.data.color.toString(16).padStart(6,'0')}"></span>${b.data.name}</div>`).join('');
listEl.querySelectorAll('.planet-item').forEach(el => el.onclick = () => selectPlanet(+el.dataset.i));

let selected = -1;
function selectPlanet(i){
  selected = i;
  listEl.querySelectorAll('.planet-item').forEach((el,idx) => el.classList.toggle('active', idx===i));
  const b = bodies[i], p = b.data;
  $('#info').classList.add('show');
  $('#info-name').textContent = p.name;
  $('#info-sub').textContent = p.distAU + ' del Sol';
  $('#info-desc').textContent = p.desc;
  $('#stat-diam').textContent = p.diamKm;
  $('#stat-dist').textContent = p.distAU;
  $('#stat-period').textContent = p.periodDays >= 365 ? (p.periodDays/365).toFixed(1)+' años' : p.periodDays+' días';
  $('#stat-day').textContent = p.daySec;
  camTarget = b.mesh.getWorldPosition(new THREE.Vector3());
  camDist = Math.max(14, p.r*9);
  updateCamera();
}
$('#info-close').onclick = () => { $('#info').classList.remove('show'); selected=-1; listEl.querySelectorAll('.planet-item').forEach(el=>el.classList.remove('active')); };

let playing = true;
$('#play-btn').onclick = () => { playing = !playing; $('#play-btn').textContent = playing ? '⏸' : '▶'; };
$('#chk-orbits').onchange = e => orbitGroup.visible = e.target.checked;
let showLabels = true;
$('#chk-labels').onchange = e => { showLabels = e.target.checked; bodies.forEach(b => b.label.style.display = showLabels ? 'block' : 'none'); };
$('#reset-btn').onclick = () => { camTarget = new THREE.Vector3(0,0,0); camDist=130; camTheta=0.9; camPhi=1.1; updateCamera(); selected=-1; $('#info').classList.remove('show'); listEl.querySelectorAll('.planet-item').forEach(el=>el.classList.remove('active')); };

setTimeout(() => $('#hint').style.opacity = '0', 4500);

/* ══════════════════════════════════════════════
   LOOP
══════════════════════════════════════════════ */
function animate(){
  requestAnimationFrame(animate);
  const speed = parseFloat($('#speed').value) / 6000;
  if (playing) {
    bodies.forEach(b => {
      b.angle -= speed * (365 / b.data.periodDays);
      b.pivot.rotation.y = b.angle;
      b.mesh.rotation.y += 0.01;
    });
  }
  // seguir al planeta seleccionado
  if (selected >= 0) camTarget = bodies[selected].mesh.getWorldPosition(new THREE.Vector3());
  updateCamera();
  // proyectar etiquetas
  bodies.forEach(b => {
    const wp = b.mesh.getWorldPosition(new THREE.Vector3()).project(camera);
    const x = (wp.x*0.5+0.5)*innerWidth, y = (-wp.y*0.5+0.5)*innerHeight;
    const visible = wp.z < 1 && showLabels;
    b.label.style.display = visible ? 'block' : 'none';
    if (visible) { b.label.style.left = x+'px'; b.label.style.top = y+'px'; }
  });
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
