<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cryptic & Crossword Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Lora:ital,wght@0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #0c0c10;
      --surface:      #13131a;
      --surface-2:    #1c1c26;
      --border:       #25253a;
      --text:         #e2e2f0;
      --text-2:       #8080a0;
      --text-3:       #454560;
      --accent:       #e8a030;
      --accent-dim:   #271d08;
      --good:         #34d399;
      --font-ui:      'Inter', system-ui, sans-serif;
      --font-mono:    'IBM Plex Mono', monospace;
      --font-clue:    'Lora', Georgia, serif;
      --radius:       10px;
      --radius-lg:    16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    header { text-align: center; margin-bottom: 1.5rem; }
    .logo {
      font-family: var(--font-mono);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    .logo span { color: var(--accent); }
    .tagline {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .app-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      background: var(--surface);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--surface-2);
      color: var(--accent);
      font-weight: 600;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem;
    }

    .clue-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1rem;
      margin-bottom: 1.5rem;
    }
    .clue-text {
      font-family: var(--font-clue);
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text);
      font-style: italic;
    }

    /* Centrado de texto perfecto para casillas */
    .letter-boxes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-bottom: 1.5rem;
      justify-content: center;
    }
    .letter-box {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-3);
      background: var(--bg);
      text-align: center;
      transition: all 0.25s;
    }
    .letter-box.revealed {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }
    .letter-box.correct {
      border-color: #34d399;
      color: #34d399;
      background: #0b2218;
    }
    .letter-boxes .word { display: flex; gap: 6px; flex-wrap: nowrap; }
    .letter-boxes input.letter-box {
      width: var(--bw, 36px);
      height: var(--bw, 36px);
      flex: none;
      padding: 0;
      margin: 0;
      border-radius: 6px;
      font-size: clamp(11px, calc(var(--bw, 36px) * 0.45), 16px);
      caret-color: var(--accent);
      text-align: center;
      line-height: var(--bw, 36px);
    }
    .letter-boxes input.letter-box:focus {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    .letter-boxes input.letter-box.wrong { border-color: #f87171; }
    .letter-boxes input.letter-box.revealed,
    .letter-boxes input.letter-box.correct { pointer-events: none; }

    .grid-panel {
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .cw-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      text-align: center;
      margin-bottom: 12px;
    }
    .cw-wrap { display: flex; justify-content: center; }
    .cw-grid { display: grid; gap: 2px; }
    .cw-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }
    .cw-cell.block { background: var(--surface-2); cursor: default; }
    .cw-cell.sel { box-shadow: 0 0 0 2px var(--text); z-index: 1; }
    .cw-cell.typed .cw-letter { opacity: 0.45; }
    .cw-num {
      position: absolute;
      top: 1px;
      left: 2px;
      font-size: 8px;
      line-height: 1;
      font-weight: 400;
      color: var(--text-2);
    }
    .cw-cell.pop { animation: cwpop 0.45s ease both; }
    @keyframes cwpop {
      from { opacity: 0; transform: scale(0.4); }
      to   { opacity: 1; transform: none; }
    }
    .cw-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }
    .cw-chip {
      padding: 4px 10px;
      font-size: 12px;
      font-family: var(--font-mono);
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .cw-chip:hover { color: var(--text); }
    .cw-chip.active { color: var(--text); border-color: var(--text); }
    .cw-chip.done::after { content: ' ✓'; color: var(--good); }

    .input-row { display: flex; gap: 8px; margin-bottom: 6px; }
    input[type=text], select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type=text]:focus, select:focus { border-color: var(--accent); }

    button {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.3; cursor: default; }

    .btn-check, .btn-primary {
      background: var(--accent);
      color: #000;
      flex-shrink: 0;
      font-weight: 600;
    }
    .btn-check:hover:not(:disabled), .btn-primary:hover:not(:disabled) { opacity: 0.88; }

    .btn-next {
      background: var(--accent);
      color: #000;
      width: 100%;
      justify-content: center;
      margin-top: 0;
    }

    .hints {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 1.25rem;
    }
    .btn-hint {
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--border);
      font-size: 13px;
      padding: 8px 12px;
      justify-content: flex-start;
    }
    .btn-hint:hover:not(:disabled) { border-color: #40405a; color: var(--text); }
    .btn-hint.used { opacity: 0.25; }

    .hint-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .reset-row { text-align: center; margin-top: 1rem; min-height: 28px; }
    .btn-reset {
      background: none;
      color: var(--text-3);
      font-size: 12px;
      font-family: var(--font-mono);
      padding: 4px 10px;
    }
    .btn-reset:hover { color: var(--text-2); }

    .feedback {
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      font-family: var(--font-mono);
      margin-top: 6px;
      color: #f87171;
      transition: color 0.3s;
    }

    .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

    .explanation-box {
      background: #0b2218;
      border: 1px solid #1a4a35;
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.25rem;
    }
    .explanation-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #34d399;
      margin-bottom: 6px;
      font-family: var(--font-mono);
    }
    .explanation-text {
      font-size: 14px;
      color: #a0d4b8;
      line-height: 1.6;
      font-family: var(--font-clue);
    }
    .next-msg {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-2);
      text-align: center;
      margin-top: 10px;
      min-height: 16px;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-3);
      font-family: var(--font-mono);
    }

    .builder-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-2);
      text-transform: uppercase;
    }
    .puzzle-picker-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .picker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      background: var(--surface);
    }
    .picker-item:hover { background: var(--surface-2); }
    .picker-item input[type=checkbox] { accent-color: var(--accent); }

    .json-output {
      width: 100%;
      height: 120px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--good);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 8px;
      resize: vertical;
    }

    .nav-toggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 300;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-toggle:hover { color: var(--text); border-color: #40405a; }

    .nav-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 310;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .nav-overlay.open { opacity: 1; pointer-events: auto; }

    .nav-panel {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100dvh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 320;
      display: flex;
      flex-direction: column;
      transition: left 0.22s ease;
    }
    .nav-panel.open { left: 0; }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .nav-progress {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--good);
      margin-left: 8px;
    }
    .nav-close {
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }

    .nav-content { overflow-y: auto; flex: 1; padding: 0.5rem 0; }
    .nav-search { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .nav-search input[type=text] { width: 100%; font-size: 13px; text-align: left; }
    .nav-footer { padding: 0.75rem 1rem; border-top: 1px solid var(--border); flex-shrink: 0; }

    .btn-reset-all {
      width: 100%;
      justify-content: center;
      background: var(--surface-2);
      color: #f87171;
      border: 1px solid var(--border);
      font-size: 12px;
      padding: 8px 10px;
    }

    .nav-group-label, .nav-cat-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-2);
      padding: 0.85rem 1rem 0.35rem;
      font-family: var(--font-mono);
      cursor: pointer;
    }
    .nav-cat-label { font-size: 10px; color: var(--text-3); padding: 0.75rem 1rem 0.25rem; }
    .nav-group-list.collapsed, .nav-cat-list.collapsed { display: none; }
    .nav-group-list .nav-cat-label { padding-left: 1.5rem; }
    .nav-group-list .nav-puzzle-btn { padding-left: 2rem; }

    .nav-puzzle-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-2);
      font-size: 13px;
      padding: 6px 1rem;
      cursor: pointer;
    }
    .nav-puzzle-btn:hover { background: var(--surface-2); color: var(--text); }
    .nav-puzzle-btn.solved { color: #5fae92; }
    .nav-puzzle-btn.solved::before { content: '✓ '; color: var(--good); }
    .nav-puzzle-btn.started::before { content: '• '; color: var(--accent); }
    .nav-puzzle-btn.locked { opacity: 0.5; }
    .nav-puzzle-btn.locked::before { content: '🔒 '; }
    .nav-puzzle-btn.active { color: var(--accent); background: var(--accent-dim); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">cryp<span>tic</span></div>
    <div class="tagline">solve & create crosswords</div>
  </header>

  <div class="app-tabs">
    <button class="tab-btn active" id="tab-play">🎮 jugar</button>
    <button class="tab-btn" id="tab-create">🛠️ creador de crucigramas</button>
  </div>

  <button class="nav-toggle" id="nav-toggle" aria-label="Open puzzle list">☰</button>

  <div class="nav-overlay" id="nav-overlay"></div>
  <div class="nav-panel" id="nav-panel">
    <div class="nav-header">
      <span><span class="nav-title">Puzzles</span><span class="nav-progress" id="nav-progress"></span></span>
      <button class="nav-close" id="nav-close" aria-label="Close">✕</button>
    </div>
    <div class="nav-search">
      <input type="text" id="nav-search-input" placeholder="Buscar puzzle…" autocomplete="off" />
    </div>
    <div class="nav-content" id="nav-content"></div>
    <div class="nav-footer">
      <button class="btn-reset-all" id="reset-all-btn">↺ Borrar todo el progreso</button>
    </div>
  </div>

  <div class="card">
    <div id="loading" class="loading">Cargando acertijos…</div>

    <!-- MODO JUEGO -->
    <div id="game-view" class="hidden">
      <div class="grid-panel hidden" id="grid-panel">
        <div class="cw-title" id="cw-title"></div>
        <div class="cw-wrap"><div class="cw-grid" id="cw-grid"></div></div>
        <div class="cw-chips" id="cw-chips"></div>
      </div>

      <div class="clue-box">
        <div class="clue-text" id="clue-text"></div>
      </div>

      <div class="letter-boxes" id="letter-boxes"></div>

      <div id="input-area">
        <div class="input-row">
          <button class="btn-check" id="check-btn" style="width:100%;justify-content:center">Comprobar</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="hints">
        <button class="btn-hint" id="hint-fodder">
          <span class="hint-dot" style="background:#fbbf24"></span> Fodder
        </button>
        <button class="btn-hint" id="hint-indicator">
          <span class="hint-dot" style="background:#c084fc"></span> Indicator
        </button>
        <button class="btn-hint" id="hint-definition">
          <span class="hint-dot" style="background:#60a5fa"></span> Definition
        </button>
        <button class="btn-hint" id="hint-letter">
          <span>◆</span> <span id="hint-letter-label">Letter</span>
        </button>
      </div>

      <div class="reset-row">
        <button class="btn-reset hidden" id="reset-btn">↺ reiniciar pista</button>
      </div>

      <div id="win-area" class="hidden">
        <div class="divider"></div>
        <div class="explanation-box">
          <div class="explanation-label">✓ Resuelto</div>
          <div class="explanation-text" id="explanation-text"></div>
        </div>
        <button class="btn-next" id="next-btn">Siguiente Acertijo →</button>
        <div class="next-msg" id="next-msg"></div>
      </div>
    </div>

    <!-- MODO CREADOR -->
    <div id="creator-view" class="hidden">
      <div class="builder-section">
        <div class="cw-title">Configurador de Crucigrama Personalizado</div>
        
        <div class="form-group">
          <label>ID del Crucigrama</label>
          <input type="text" id="builder-grid-id" value="custom-crossword-1" placeholder="Ej: mi-crucigrama" />
        </div>

        <div class="form-group">
          <label>Modo de Selección</label>
          <select id="builder-mode">
            <option value="random">Aleatorio entre las pistas del JSON</option>
            <option value="manual">Seleccionar Pistas Manualmente</option>
          </select>
        </div>

        <div class="form-group" id="group-random-count">
          <label>Número de pistas involucradas (2 - 15)</label>
          <input type="number" id="builder-count" value="4" min="2" max="15" />
        </div>

        <div class="form-group hidden" id="group-manual-select">
          <label>Elige Pistas (Mínimo 2):</label>
          <div class="puzzle-picker-list" id="builder-picker-list"></div>
        </div>

        <button class="btn-primary" id="btn-generate-cw" style="justify-content:center; margin-top: 10px;">⚡ Generar Distribución de Crucigrama</button>

        <div class="divider"></div>

        <div class="form-group">
          <label>Resultado JSON Generado</label>
          <textarea class="json-output" id="builder-json-out" readonly placeholder="El JSON con el crucigrama generado aparecerá aquí..."></textarea>
        </div>

        <button class="btn-primary" id="btn-load-custom" style="justify-content:center; background:#34d399;">▶ Probar Crucigrama Creado en Vivo</button>
      </div>
    </div>

  </div>

  <script>
  (function () {

    var FALLBACK = [
      {
        clue: "Be quiet — anagram of listen (6)",
        answer: "SILENT",
        fodder: ["listen"], indicator: ["anagram of"], definition: ["Be quiet"],
        explanation: "Rearrange LISTEN to get SILENT."
      }
    ];

    function hasContent(arr) {
      return Array.isArray(arr) && arr.some(function (s) { return typeof s === 'string' && s.trim().length > 0; });
    }

    var LAYERS = [
      { type: 'definition', color: '#60a5fa', offset: 0  },
      { type: 'fodder',     color: '#fbbf24', offset: 5  },
      { type: 'indicator',  color: '#c084fc', offset: 10 }
    ];

    var STORE_KEY = 'cryptic.progress.v1';
    var progress  = loadStore();

    function loadStore() {
      try {
        var raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          var o = JSON.parse(raw);
          if (o && typeof o === 'object' && o.puzzles) return o;
        }
      } catch (e) {}
      return { puzzles: {}, last: null };
    }
    function saveStore() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
    }
    function pKey(p) {
      return [p.group || '', p.category || '', p.name || '', p.answer || ''].join('|');
    }
    function getState(p) { return progress.puzzles[pKey(p)] || null; }
    function isSolved(p) { var s = getState(p); return !!(s && s.solved); }

    var puzzles = [];
    var puzzle  = null;
    var usedHints       = new Set();
    var revealedLetters = new Set();
    var solved = false;
    var guess = [];   
    var cells = [];   
    var crossLocked = new Set();  
    var grids = {};   
    var currentPuzzleIndex = -1;

    var loadingEl      = document.getElementById('loading');
    var gameViewEl     = document.getElementById('game-view');
    var creatorViewEl  = document.getElementById('creator-view');
    var clueTextEl     = document.getElementById('clue-text');
    var letterBoxesEl  = document.getElementById('letter-boxes');
    var checkBtn       = document.getElementById('check-btn');
    var gridPanel      = document.getElementById('grid-panel');
    var cwTitleEl      = document.getElementById('cw-title');
    var cwGridEl       = document.getElementById('cw-grid');
    var cwChipsEl      = document.getElementById('cw-chips');
    var feedbackEl     = document.getElementById('feedback');
    var hintFodder     = document.getElementById('hint-fodder');
    var hintIndicator  = document.getElementById('hint-indicator');
    var hintDefinition = document.getElementById('hint-definition');
    var hintLetter     = document.getElementById('hint-letter');
    var hintLetterLbl  = document.getElementById('hint-letter-label');
    var winArea        = document.getElementById('win-area');
    var explanationEl  = document.getElementById('explanation-text');
    var nextBtn        = document.getElementById('next-btn');
    var nextMsg        = document.getElementById('next-msg');
    var resetBtn       = document.getElementById('reset-btn');
    var resetAllBtn    = document.getElementById('reset-all-btn');
    var navProgressEl  = document.getElementById('nav-progress');

    document.getElementById('tab-play').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('tab-create').classList.remove('active');
      gameViewEl.classList.remove('hidden');
      creatorViewEl.classList.add('hidden');
    });
    document.getElementById('tab-create').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('tab-play').classList.remove('active');
      creatorViewEl.classList.remove('hidden');
      gameViewEl.classList.add('hidden');
      populateBuilderPicker();
    });

    function init(data) {
      var valid = Array.isArray(data)
        ? data.filter(function (p) { return p.clue && p.answer; })
        : [];
      puzzles = valid.length ? valid : FALLBACK;
      loadingEl.classList.add('hidden');
      gameViewEl.classList.remove('hidden');
      buildGrids();
      buildNav();

      var startIdx = -1;
      if (progress.last) {
        for (var i = 0; i < puzzles.length; i++) {
          if (pKey(puzzles[i]) === progress.last) { startIdx = i; break; }
        }
      }
      if (startIdx === -1) startIdx = pickRandomUnsolved(-1);
      loadPuzzleAt(startIdx);
    }

    try {
      fetch('./puzzles.json')
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var clean = t.replace(/,\s*([\]\}])/g, '$1');
          init(JSON.parse(clean));
        })
        .catch(function () { init(FALLBACK); });
    } catch (e) {
      init(FALLBACK);
    }

    function pickRandomUnsolved(avoidIdx) {
      var pool = [];
      for (var i = 0; i < puzzles.length; i++) {
        if (i !== avoidIdx && !isSolved(puzzles[i]) && !isExtra(puzzles[i])) pool.push(i);
      }
      if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
      if (avoidIdx >= 0) return -1;
      return Math.floor(Math.random() * puzzles.length);
    }

    var GRID_COLORS = ['#34d399', '#fb923c', '#f472b6', '#60a5fa', '#c084fc', '#fbbf24', '#2dd4bf', '#f87171'];

    function buildGrids() {
      grids = {};
      puzzles.forEach(function (p, i) {
        delete p._ent; delete p._gr;
        var g = p.grid;
        if (!g || !g.id || typeof g.r !== 'number' || typeof g.c !== 'number') return;
        var gr  = grids[g.id] || (grids[g.id] = { id: g.id, entries: [], mainIdx: -1, cells: {}, rows: 0, cols: 0 });
        var dir = g.dir === 'down' ? 'down' : 'across';
        var ans = String(p.answer).toUpperCase();
        var e   = { pi: i, r: g.r, c: g.c, dir: dir, len: ans.length, isMain: false, num: 0, color: '', want: !!g.main };
        gr.entries.push(e);
        p._ent = e; p._gr = gr;
        if (g.main && gr.mainIdx === -1) gr.mainIdx = i;
        for (var k = 0; k < ans.length; k++) {
          var r = g.r + (dir === 'down' ? k : 0);
          var c = g.c + (dir === 'across' ? k : 0);
          var key  = r + ',' + c;
          var cell = gr.cells[key] || (gr.cells[key] = { r: r, c: c, letter: null, list: [] });
          if (r + 1 > gr.rows) gr.rows = r + 1;
          if (c + 1 > gr.cols) gr.cols = c + 1;
          if (ans[k] === ' ') continue;
          cell.letter = cell.letter || ans[k];
          cell.list.push({ pi: i, k: k });
        }
      });

      Object.keys(grids).forEach(function (id) {
        var gr = grids[id];
        if (gr.mainIdx === -1) gr.mainIdx = gr.entries[0].pi;
        gr.entries.sort(function (a, b) {
          return (a.r - b.r) || (a.c - b.c) || ((a.dir === 'across' ? 0 : 1) - (b.dir === 'across' ? 0 : 1));
        });
        var seen = {}, n = 0, colorIdx = 1;
        gr.entries.forEach(function (e, order) {
          e.order  = order;
          e.isMain = e.pi === gr.mainIdx;
          e.color  = e.isMain ? GRID_COLORS[0] : GRID_COLORS[1 + ((colorIdx++ - 1) % (GRID_COLORS.length - 1))];
          var sk = e.r + ',' + e.c;
          if (!seen[sk]) seen[sk] = ++n;
          e.num = seen[sk];
        });
      });
    }

    function isExtra(p)  { return !!(p && p._ent && !p._ent.isMain); }
    function mainOf(p)   { return p && p._gr ? puzzles[p._gr.mainIdx] : null; }
    function isLocked(i) { return revealedLetters.has(i) || crossLocked.has(i); }

    function knownCount() {
      var ans = puzzle.answer.toUpperCase(), n = 0;
      for (var i = 0; i < ans.length; i++) if (ans[i] !== ' ' && isLocked(i)) n++;
      return n;
    }

    function entryKnows(pi, k) {
      if (pi === currentPuzzleIndex) return solved || revealedLetters.has(k);
      var st = getState(puzzles[pi]);
      return !!(st && (st.solved || (st.letters || []).indexOf(k) !== -1));
    }

    function computeCrossLocked(p) {
      var set = new Set();
      if (!p._gr || !isExtra(p)) return set;
      var e = p._ent, ans = String(p.answer).toUpperCase();
      for (var k = 0; k < ans.length; k++) {
        if (ans[k] === ' ') continue;
        var r = e.r + (e.dir === 'down' ? k : 0);
        var c = e.c + (e.dir === 'across' ? k : 0);
        var cell = p._gr.cells[r + ',' + c];
        if (!cell) continue;
        cell.list.forEach(function (o) {
          if (o.pi !== e.pi && entryKnows(o.pi, o.k)) set.add(k);
        });
      }
      return set;
    }

    function gridNextIdx() {
      if (!puzzle || !puzzle._gr) return -1;
      var list = puzzle._gr.entries, start = list.indexOf(puzzle._ent);
      for (var s = 1; s <= list.length; s++) {
        var e = list[(start + s) % list.length];
        if (e.pi !== currentPuzzleIndex && !isSolved(puzzles[e.pi])) return e.pi;
      }
      return -1;
    }

    function renderGrid(animate) {
      var show = !!(puzzle && puzzle._gr && (isExtra(puzzle) || solved));
      gridPanel.classList.toggle('hidden', !show);
      if (!show) { cwGridEl.innerHTML = ''; cwChipsEl.innerHTML = ''; return; }

      var gr  = puzzle._gr;
      var avail = gridPanel.clientWidth || 400;
      var cs  = Math.max(18, Math.min(36, Math.floor((avail - (gr.cols - 1) * 2) / gr.cols)));
      cwGridEl.style.gridTemplateColumns = 'repeat(' + gr.cols + ', ' + cs + 'px)';
      cwGridEl.style.gridAutoRows = cs + 'px';
      cwGridEl.style.fontSize = Math.max(10, Math.floor(cs * 0.45)) + 'px';

      var numAt = {};
      gr.entries.forEach(function (e) { numAt[e.r + ',' + e.c] = e.num; });

      var html = '';
      for (var r = 0; r < gr.rows; r++) {
        for (var c = 0; c < gr.cols; c++) {
          var key  = r + ',' + c;
          var cell = gr.cells[key];
          if (!cell) { html += '<div></div>'; continue; }
          if (!cell.list.length) { html += '<div class="cw-cell block"></div>'; continue; }

          var known = false, typedLetter = '', sel = false;
          cell.list.forEach(function (o) {
            if (o.pi === currentPuzzleIndex) {
              sel = true;
              if (solved || isLocked(o.k)) known = true;
              else if (guess[o.k]) typedLetter = guess[o.k];
            } else if (entryKnows(o.pi, o.k)) known = true;
          });

          var col = puzzles[cell.list[0].pi]._ent.color;
          var shown = known ? cell.letter : typedLetter;
          html += '<div class="cw-cell' + (sel ? ' sel' : '') + (!known && typedLetter ? ' typed' : '')
                + (animate ? ' pop' : '') + '" data-key="' + key + '"'
                + ' style="background:' + col + '26;border-color:' + col + 'aa;color:' + col + '">'
                + (numAt[key] ? '<span class="cw-num">' + numAt[key] + '</span>' : '')
                + '<span class="cw-letter">' + escHtml(shown || '') + '</span></div>';
        }
      }
      cwGridEl.innerHTML = html;

      var doneCount = 0, chips = '';
      gr.entries.forEach(function (e) {
        var done = e.pi === currentPuzzleIndex ? solved : isSolved(puzzles[e.pi]);
        if (done) doneCount++;
        chips += '<button class="cw-chip' + (e.pi === currentPuzzleIndex ? ' active' : '') + (done ? ' done' : '')
               + '" data-pi="' + e.pi + '" style="border-left:3px solid ' + e.color + '">'
               + e.num + (e.dir === 'across' ? '→' : '↓') + ' (' + e.len + ')</button>';
      });
      cwChipsEl.innerHTML = chips;
      cwTitleEl.textContent = 'crucigrama · ' + doneCount + '/' + gr.entries.length;
    }

    cwGridEl.addEventListener('click', function (ev) {
      var t = ev.target.closest ? ev.target.closest('.cw-cell') : null;
      if (!t || !t.getAttribute('data-key') || !puzzle || !puzzle._gr) return;
      var cell = puzzle._gr.cells[t.getAttribute('data-key')];
      if (!cell || !cell.list.length) return;
      var pick = cell.list.filter(function (o) { return o.pi !== currentPuzzleIndex; })[0] || cell.list[0];
      if (pick.pi !== currentPuzzleIndex) loadPuzzleAt(pick.pi);
      else focusCell(firstEmptyEditable());
    });
    cwChipsEl.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('.cw-chip') : null;
      if (!b) return;
      var pi = parseInt(b.getAttribute('data-pi'), 10);
      if (pi !== currentPuzzleIndex) loadPuzzleAt(pi);
    });

    function updateNextButton() {
      var n = solved ? gridNextIdx() : -1;
      nextBtn.textContent = n !== -1 ? 'Siguiente pista del crucigrama →' : 'Siguiente puzzle →';
      if (solved && puzzle && puzzle._gr) {
        nextMsg.textContent = n === -1 ? '🎉 Crucigrama completado'
          : (puzzle._ent.isMain ? 'Crucigrama desplegado — pistas extra disponibles' : '');
      }
    }

    function hasTyped() {
      for (var i = 0; i < guess.length; i++) {
        if (guess[i] && !isLocked(i)) return true;
      }
      return false;
    }

    function persist() {
      if (!puzzle) return;
      var k = pKey(puzzle);
      var before     = getState(puzzle);
      var wasStarted = !!before;
      var wasSolved  = !!(before && before.solved);
      if (!solved && usedHints.size === 0 && revealedLetters.size === 0 && !hasTyped()) {
        delete progress.puzzles[k];
      } else {
        progress.puzzles[k] = {
          solved:  solved,
          hints:   Array.from(usedHints),
          letters: Array.from(revealedLetters),
          guess:   guess.map(function (g, i) { return (!solved && isLocked(i)) ? '' : (g || ''); })
        };
      }
      progress.last = k;
      saveStore();
      var now = getState(puzzle);
      if (!!now !== wasStarted || !!(now && now.solved) !== wasSolved) refreshNav();
    }

    function updateResetVisibility() {
      var has = solved || usedHints.size > 0 || revealedLetters.size > 0 || hasTyped();
      resetBtn.classList.toggle('hidden', !has);
      var multi = !!(puzzle && puzzle._ent && puzzle._ent.isMain && puzzle._gr.entries.length > 1);
      resetBtn.textContent = multi ? '↺ reiniciar pista y extras' : '↺ reiniciar esta pista';
    }

    function buildStyle(activeTypes) {
      var active = LAYERS.filter(function (l) { return activeTypes.has(l.type); });
      if (!active.length) return '';
      var imgs = active.map(function (l) { return 'linear-gradient(' + l.color + ',' + l.color + ')'; });
      var szs  = active.map(function () { return '100% 2px'; });
      var pos  = active.map(function (l) { return '0 calc(100% - ' + l.offset + 'px)'; });
      return 'background-image:' + imgs.join(',') + ';background-size:' + szs.join(',') + ';background-position:' + pos.join(',') + ';background-repeat:no-repeat';
    }

    function renderClue() {
      var clue  = puzzle.clue;
      var lower = clue.toLowerCase();
      var n     = clue.length;
      var chars = [];
      for (var i = 0; i < n; i++) chars.push(new Set());

      var fields = [
        { texts: puzzle.fodder,     type: 'fodder'     },
        { texts: puzzle.indicator,  type: 'indicator'  },
        { texts: puzzle.definition, type: 'definition' }
      ];

      fields.forEach(function (f) {
        if (!usedHints.has(f.type)) return;
        var texts = Array.isArray(f.texts) ? f.texts : (f.texts ? [f.texts] : []);
        texts.forEach(function (text) {
          if (!text || !text.trim()) return;
          var idx = lower.indexOf(text.toLowerCase());
          var matchLen = text.length;
          if (idx !== -1) {
            for (var i = idx; i < idx + matchLen; i++) chars[i].add(f.type);
          }
        });
      });

      var html = '', i = 0;
      while (i < n) {
        var key = Array.from(chars[i]).sort().join(',');
        var j = i + 1;
        while (j < n && Array.from(chars[j]).sort().join(',') === key) j++;
        var chunk = clue.slice(i, j).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var style = buildStyle(chars[i]);
        html += style ? '<span style="' + style + '">' + chunk + '</span>' : '<span>' + chunk + '</span>';
        i = j;
      }
      clueTextEl.innerHTML = html;
    }

    function isLetterKey(e) {
      return e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && /\S/.test(e.key);
    }

    function nextEditable(i, dir) {
      if (solved) return -1;
      for (var j = i + dir; j >= 0 && j < cells.length; j += dir) {
        if (cells[j] && !isLocked(j)) return j;
      }
      return -1;
    }

    function focusCell(j) {
      if (j >= 0 && cells[j]) { cells[j].focus(); cells[j].select(); }
    }

    function firstEmptyEditable() {
      for (var j = 0; j < cells.length; j++) {
        if (cells[j] && !isLocked(j) && !guess[j]) return j;
      }
      return nextEditable(-1, 1);
    }

    function setCell(i, ch) {
      guess[i] = ch ? ch.toUpperCase() : '';
      cells[i].value = guess[i];
      persist();
      updateResetVisibility();
      if (puzzle && puzzle._gr) renderGrid(false);
    }

    function layoutBoxes() {
      var ans = puzzle.answer.toUpperCase();
      var maxWord = 1;
      ans.split(' ').forEach(function (w) { if (w.length > maxWord) maxWord = w.length; });
      var avail = letterBoxesEl.clientWidth || 400;
      var bw = Math.floor((avail - (maxWord - 1) * 6) / maxWord);
      letterBoxesEl.style.setProperty('--bw', Math.max(20, Math.min(36, bw)) + 'px');
    }

    function lockCell(i) {
      var ans = puzzle.answer.toUpperCase();
      var el  = cells[i];
      guess[i]     = ans[i];
      el.value     = ans[i];
      el.readOnly  = true;
      el.tabIndex  = -1;
      el.classList.add('revealed');
      if (document.activeElement === el) {
        el.blur();
        var n = nextEditable(i, 1);
        focusCell(n !== -1 ? n : nextEditable(i, -1));
      }
    }

    function attachCell(inp, i) {
      inp.addEventListener('focus', function () { inp.select(); });
      inp.addEventListener('keydown', function (e) {
        if (solved || e.isComposing) return;
        if (e.key === 'Enter')      { e.preventDefault(); checkAnswer(); return; }
        if (e.key === 'ArrowLeft')  { e.preventDefault(); focusCell(nextEditable(i, -1)); return; }
        if (e.key === 'ArrowRight') { e.preventDefault(); focusCell(nextEditable(i, 1));  return; }
        if (e.key === 'Backspace') {
          e.preventDefault();
          if (guess[i]) { setCell(i, ''); }
          else {
            var p = nextEditable(i, -1);
            if (p !== -1) { setCell(p, ''); focusCell(p); }
          }
          return;
        }
        if (e.key === 'Delete') { e.preventDefault(); setCell(i, ''); return; }
        if (isLetterKey(e)) {
          e.preventDefault();
          setCell(i, e.key);
          var n = nextEditable(i, 1);
          if (n !== -1) focusCell(n); else inp.select();
        }
      });

      inp.addEventListener('input', function () {
        if (solved) return;
        var v = inp.value.replace(/\s/g, '');
        if (!v) { setCell(i, ''); return; }
        setCell(i, v.charAt(v.length - 1));
        var n = nextEditable(i, 1);
        if (n !== -1) focusCell(n);
      });
    }

    function renderBoxes() {
      var ans = puzzle.answer.toUpperCase();
      letterBoxesEl.innerHTML = '';
      cells = [];
      var wordEl = null;
      for (var i = 0; i < ans.length; i++) {
        if (ans[i] === ' ') { cells[i] = null; wordEl = null; continue; }
        if (!wordEl) {
          wordEl = document.createElement('div');
          wordEl.className = 'word';
          letterBoxesEl.appendChild(wordEl);
        }
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'letter-box';
        inp.value = guess[i] || '';
        cells[i] = inp;
        wordEl.appendChild(inp);
        attachCell(inp, i);

        if (solved) {
          inp.classList.add('correct');
          inp.readOnly = true;
          inp.value = ans[i];
        } else if (isLocked(i)) {
          lockCell(i);
        }
      }
      layoutBoxes();
    }

    function updateLetterLabel() {
      var total    = puzzle ? puzzle.answer.replace(/\s/g, '').length : 0;
      var revealed = puzzle ? knownCount() : 0;
      hintLetterLbl.textContent = 'Letter (' + revealed + '/' + total + ')';
    }

    function applyHint(type, btn) {
      if (solved || usedHints.has(type)) return;
      usedHints.add(type);
      btn.classList.add('used');
      btn.disabled = true;
      renderClue();
      persist();
      updateResetVisibility();
      refreshNav();
    }

    hintFodder.addEventListener('click',     function () { applyHint('fodder',     hintFodder);     });
    hintIndicator.addEventListener('click',  function () { applyHint('indicator',  hintIndicator);  });
    hintDefinition.addEventListener('click', function () { applyHint('definition', hintDefinition); });

    hintLetter.addEventListener('click', function () {
      if (solved) return;
      var ans       = puzzle.answer.toUpperCase();
      var available = [];
      var fallback  = [];
      for (var i = 0; i < ans.length; i++) {
        if (ans[i] === ' ') continue;
        if (isLocked(i)) continue;
        fallback.push(i);
        if (guess[i] !== ans[i]) available.push(i);
      }
      if (!fallback.length) return;
      var pool = available.length ? available : fallback;

      var pick = pool[Math.floor(Math.random() * pool.length)];
      revealedLetters.add(pick);
      lockCell(pick);

      updateLetterLabel();
      persist();
      updateResetVisibility();
      renderGrid(false);
      refreshNav();
    });

    function syncHintButtons() {
      var map = [
        ['fodder', hintFodder, hasContent(puzzle.fodder)],
        ['indicator', hintIndicator, hasContent(puzzle.indicator)],
        ['definition', hintDefinition, true]
      ];
      map.forEach(function (m) {
        var used = usedHints.has(m[0]) || !m[2];
        m[1].classList.toggle('used', used);
        m[1].disabled = used;
      });
      var total = puzzle.answer.replace(/\s/g, '').length;
      var allLetters = knownCount() >= total;
      hintLetter.classList.toggle('used', allLetters);
      hintLetter.disabled = allLetters;
    }

    function showSolved() {
      solved = true;
      checkBtn.disabled    = true;
      feedbackEl.textContent = '';

      var ansU = puzzle.answer.toUpperCase();
      for (var i = 0; i < ansU.length; i++) guess[i] = ansU[i] === ' ' ? '' : ansU[i];

      ['fodder', 'indicator', 'definition'].forEach(function (t) { usedHints.add(t); });
      renderClue();
      renderBoxes();

      explanationEl.textContent = puzzle.explanation || '';
      nextMsg.textContent = '';
      winArea.classList.remove('hidden');

      [hintFodder, hintIndicator, hintDefinition, hintLetter].forEach(function (b) { b.disabled = true; });
      updateNextButton();
      updateResetVisibility();
    }

    var feedbackTimer = null;
    function flashFeedback(msg, wrongCells, ms) {
      feedbackEl.textContent = msg;
      if (wrongCells) cells.forEach(function (c, i) {
        if (c && !isLocked(i)) c.classList.add('wrong');
      });
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(function () {
        feedbackEl.textContent = '';
        cells.forEach(function (c) { if (c) c.classList.remove('wrong'); });
      }, ms || 1200);
    }

    function checkAnswer() {
      if (solved) return;
      var ans = puzzle.answer.toUpperCase();
      var typed = '', target = '', empty = false;
      for (var i = 0; i < ans.length; i++) {
        if (ans[i] === ' ') continue;
        target += ans[i];
        typed  += guess[i] || '';
        if (!guess[i]) empty = true;
      }

      if (empty) {
        flashFeedback('Rellena todas las casillas primero', false);
        focusCell(firstEmptyEditable());
        return;
      }

      if (typed === target) {
        showSolved();
        persist();
        refreshNav();
        renderGrid(!!(puzzle._ent && puzzle._ent.isMain));
      } else {
        flashFeedback('✗ Incorrecto — inténtalo de nuevo', true);
      }
    }

    function resetCurrent() {
      if (!puzzle) return;
      var targets = [puzzle];
      if (puzzle._ent && puzzle._ent.isMain) {
        targets = puzzle._gr.entries.map(function (e) { return puzzles[e.pi]; });
      }
      targets.forEach(function (t) { delete progress.puzzles[pKey(t)]; });
      saveStore();
      loadPuzzleAt(currentPuzzleIndex);
      refreshNav();
    }

    function resetAll() {
      if (!confirm('¿Borrar TODO el progreso guardado?')) return;
      progress = { puzzles: {}, last: null };
      saveStore();
      loadPuzzleAt(0);
      refreshNav();
    }

    resetBtn.addEventListener('click', resetCurrent);
    resetAllBtn.addEventListener('click', resetAll);

    var navToggle      = document.getElementById('nav-toggle');
    var navOverlay     = document.getElementById('nav-overlay');
    var navPanel       = document.getElementById('nav-panel');
    var navClose       = document.getElementById('nav-close');
    var navContent     = document.getElementById('nav-content');

    var openGroups = new Set();
    var openCats   = new Set();

    function catKey(group, cat) { return (group || '') + '\u241F' + cat; }
    function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function openNav()  { navPanel.classList.add('open'); navOverlay.classList.add('open'); }
    function closeNav() { navPanel.classList.remove('open'); navOverlay.classList.remove('open'); }

    navToggle.addEventListener('click', openNav);
    navClose.addEventListener('click', closeNav);
    navOverlay.addEventListener('click', closeNav);

    var navTopOrder  = [];
    var navGroupData = {};
    var navTopCats   = {};

    function countSolved(items) {
      var n = 0;
      items.forEach(function (it) { if (isSolved(it.p)) n++; });
      return n;
    }
    function countHtml(done, total) {
      return '<span class="nav-count' + (done === total && total > 0 ? ' done' : '') + '">' + done + '/' + total + '</span>';
    }

    function buildNav() {
      var prevScroll = navContent.scrollTop;
      navTopOrder  = [];
      navGroupData = {};
      navTopCats   = {};
      var topSeen = {};

      puzzles.forEach(function (p, i) {
        var group = p.group || null;
        var cat   = p.category || 'Other';

        if (group) {
          if (!topSeen['g:' + group]) { topSeen['g:' + group] = true; navTopOrder.push({ kind: 'group', key: group }); }
          if (!navGroupData[group]) navGroupData[group] = { catOrder: [], cats: {}, seen: {} };
          var gd = navGroupData[group];
          var ck = catKey(group, cat);
          if (!gd.seen[ck]) { gd.seen[ck] = true; gd.catOrder.push(ck); gd.cats[ck] = { name: cat, items: [] }; }
          gd.cats[ck].items.push({ p: p, i: i });
        } else {
          var ck2 = catKey(null, cat);
          if (!topSeen['c:' + ck2]) { topSeen['c:' + ck2] = true; navTopOrder.push({ kind: 'cat', key: ck2 }); }
          if (!navTopCats[ck2]) navTopCats[ck2] = { name: cat, items: [] };
          navTopCats[ck2].items.push({ p: p, i: i });
        }
      });

      function renderPuzzleBtns(items) {
        return items.map(function (item) {
          var name = item.p.name || item.p.answer || ('Puzzle ' + (item.i + 1));
          var st   = getState(item.p);
          var lockedX = isExtra(item.p) && !isSolved(mainOf(item.p));
          var cls  = 'nav-puzzle-btn' + (lockedX ? ' locked' : (st ? (st.solved ? ' solved' : ' started') : ''));
          return '<button class="' + cls + '" data-idx="' + item.i + '">' + escHtml(name) + '</button>';
        }).join('');
      }

      function renderCat(ck, catObj) {
        var isOpen = openCats.has(ck);
        return '<div class="nav-cat" data-catkey="' + escHtml(ck) + '">'
             +   '<button class="nav-cat-label" data-catkey="' + escHtml(ck) + '">'
             +     '<span>' + escHtml(catObj.name) + '</span>'
             +     '<span class="nav-cat-arrow">' + countHtml(countSolved(catObj.items), catObj.items.length) + '</span>'
             +   '</button>'
             +   '<div class="nav-cat-list' + (isOpen ? '' : ' collapsed') + '">'
             +     renderPuzzleBtns(catObj.items)
             +   '</div>'
             + '</div>';
      }

      var html = '';
      navTopOrder.forEach(function (entry) {
        if (entry.kind === 'group') {
          var group  = entry.key;
          var gd     = navGroupData[group];
          var isOpen = openGroups.has(group);
          var gItems = [];
          gd.catOrder.forEach(function (ck) { gItems = gItems.concat(gd.cats[ck].items); });
          html += '<div class="nav-group" data-group="' + escHtml(group) + '">'
                +   '<button class="nav-group-label">'
                +     '<span>' + escHtml(group) + '</span>'
                +     '<span class="nav-cat-arrow">' + countHtml(countSolved(gItems), gItems.length) + '</span>'
                +   '</button>'
                +   '<div class="nav-group-list' + (isOpen ? '' : ' collapsed') + '">'
                +     gd.catOrder.map(function (ck) { return renderCat(ck, gd.cats[ck]); }).join('')
                +   '</div>'
                + '</div>';
        } else {
          html += renderCat(entry.key, navTopCats[entry.key]);
        }
      });
      navContent.innerHTML = html;

      navContent.querySelectorAll('.nav-group-label').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var group = this.closest('.nav-group').getAttribute('data-group');
          var list  = this.nextElementSibling;
          if (openGroups.has(group)) { openGroups.delete(group); list.classList.add('collapsed'); }
          else                       { openGroups.add(group);    list.classList.remove('collapsed'); }
        });
      });

      navContent.querySelectorAll('.nav-cat-label').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var ck   = this.getAttribute('data-catkey');
          var list = this.nextElementSibling;
          if (openCats.has(ck)) { openCats.delete(ck); list.classList.add('collapsed'); }
          else                  { openCats.add(ck);    list.classList.remove('collapsed'); }
        });
      });

      navContent.querySelectorAll('.nav-puzzle-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = parseInt(this.getAttribute('data-idx'), 10);
          loadPuzzleAt(idx);
          closeNav();
        });
      });

      var totalSolved = 0;
      puzzles.forEach(function (p) { if (isSolved(p)) totalSolved++; });
      navProgressEl.textContent = totalSolved + '/' + puzzles.length;

      navContent.scrollTop = prevScroll;
      markActiveInNav();
    }

    function markActiveInNav() {
      navContent.querySelectorAll('.nav-puzzle-btn').forEach(function (btn) {
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        btn.classList.toggle('active', idx === currentPuzzleIndex);
      });
    }

    function refreshNav() { buildNav(); }

    function updateNavActive() {
      var p = puzzles[currentPuzzleIndex];
      if (p) {
        var group = p.group || null;
        var cat   = p.category || 'Other';
        if (group) openGroups.add(group);
        openCats.add(catKey(group, cat));
      }
      markActiveInNav();
    }

    function loadPuzzleAt(idx) {
      var lockedMsg = '';
      var want = puzzles[idx];
      if (isExtra(want) && !isSolved(mainOf(want))) {
        idx = want._gr.mainIdx;
        lockedMsg = '🔒 Resuelve primero la pista principal para desbloquear las extras';
      }
      currentPuzzleIndex = idx;
      puzzle          = puzzles[idx];
      usedHints       = new Set();
      revealedLetters = new Set();
      solved          = false;

      guess = new Array(puzzle.answer.length).fill('');
      checkBtn.disabled         = false;
      feedbackEl.textContent    = '';
      nextMsg.textContent       = '';
      winArea.classList.add('hidden');

      var st = getState(puzzle);
      if (st) {
        (st.hints   || []).forEach(function (h) { usedHints.add(h); });
        (st.letters || []).forEach(function (l) { revealedLetters.add(l); });
        if (Array.isArray(st.guess) && st.guess.length === guess.length) {
          guess = st.guess.map(function (g) { return g || ''; });
        }
      }
      var ansU = puzzle.answer.toUpperCase();
      crossLocked = computeCrossLocked(puzzle);
      revealedLetters.forEach(function (l) { if (ansU[l] && ansU[l] !== ' ') guess[l] = ansU[l]; });
      crossLocked.forEach(function (l) { if (ansU[l] && ansU[l] !== ' ') guess[l] = ansU[l]; });

      syncHintButtons();
      updateLetterLabel();
      renderClue();

      if (st && st.solved) {
        showSolved();
      } else {
        renderBoxes();
        focusCell(firstEmptyEditable());
      }

      updateNextButton();
      updateResetVisibility();
      renderGrid(false);
      progress.last = pKey(puzzle);
      saveStore();
      updateNavActive();
      if (lockedMsg) flashFeedback(lockedMsg, false, 4000);
    }

    checkBtn.addEventListener('click', checkAnswer);
    window.addEventListener('resize', function () { if (puzzle) layoutBoxes(); });
    nextBtn.addEventListener('click', function () {
      var gi = solved ? gridNextIdx() : -1;
      if (gi !== -1) { loadPuzzleAt(gi); return; }
      var idx = pickRandomUnsolved(currentPuzzleIndex);
      if (idx === -1) {
        nextMsg.textContent = '🎉 No quedan pistas sin resolver.';
        return;
      }
      loadPuzzleAt(idx);
    });

    var builderModeSelect = document.getElementById('builder-mode');
    var groupRandomCount  = document.getElementById('group-random-count');
    var groupManualSelect = document.getElementById('group-manual-select');
    var builderPickerList = document.getElementById('builder-picker-list');
    var builderJsonOut    = document.getElementById('builder-json-out');

    builderModeSelect.addEventListener('change', function() {
      if (this.value === 'manual') {
        groupRandomCount.classList.add('hidden');
        groupManualSelect.classList.remove('hidden');
      } else {
        groupRandomCount.classList.remove('hidden');
        groupManualSelect.classList.add('hidden');
      }
    });

    function populateBuilderPicker() {
      builderPickerList.innerHTML = '';
      puzzles.forEach(function(p, idx) {
        var div = document.createElement('label');
        div.className = 'picker-item';
        div.innerHTML = '<input type="checkbox" value="' + idx + '"> ' + escHtml(p.name || p.answer) + ' (' + p.answer + ')';
        builderPickerList.appendChild(div);
      });
    }

    document.getElementById('btn-generate-cw').addEventListener('click', generateCrosswordJSON);

    function generateCrosswordJSON() {
      var gridId = document.getElementById('builder-grid-id').value.trim() || 'custom-grid';
      var mode = builderModeSelect.value;
      var selectedPuzzles = [];

      if (mode === 'random') {
        var count = parseInt(document.getElementById('builder-count').value, 10) || 4;
        count = Math.min(Math.max(count, 2), 15);
        var shuffled = puzzles.slice().sort(function() { return 0.5 - Math.random(); });
        selectedPuzzles = shuffled.slice(0, count);
      } else {
        var checkboxes = builderPickerList.querySelectorAll('input[type=checkbox]:checked');
        checkboxes.forEach(function(cb) {
          selectedPuzzles.push(puzzles[parseInt(cb.value, 10)]);
        });
        if (selectedPuzzles.length < 2) {
          alert('Por favor, selecciona al menos 2 pistas para formar un crucigrama.');
          return;
        }
      }

      var resultPuzzles = JSON.parse(JSON.stringify(selectedPuzzles));
      
      resultPuzzles[0].grid = {
        id: gridId,
        main: true,
        r: 0,
        c: 0,
        dir: "across"
      };

      var placed = [resultPuzzles[0]];

      for (var i = 1; i < resultPuzzles.length; i++) {
        var curr = resultPuzzles[i];
        var currAns = curr.answer.toUpperCase();
        var bestFit = null;

        for (var p = 0; p < placed.length; p++) {
          var target = placed[p];
          var targetAns = target.answer.toUpperCase();
          var tDir = target.grid.dir;
          var nextDir = tDir === 'across' ? 'down' : 'across';

          for (var c1 = 0; c1 < currAns.length; c1++) {
            for (var c2 = 0; c2 < targetAns.length; c2++) {
              if (currAns[c1] === targetAns[c2] && currAns[c1] !== ' ') {
                var r = target.grid.r + (tDir === 'down' ? c2 : 0) - (nextDir === 'down' ? c1 : 0);
                var c = target.grid.c + (tDir === 'across' ? c2 : 0) - (nextDir === 'across' ? c1 : 0);
                bestFit = { r: r, c: c, dir: nextDir };
                break;
              }
            }
            if (bestFit) break;
          }
          if (bestFit) break;
        }

        if (!bestFit) {
          bestFit = { r: (i * 2), c: 0, dir: "across" };
        }

        curr.grid = {
          id: gridId,
          main: false,
          r: bestFit.r,
          c: bestFit.c,
          dir: bestFit.dir
        };
        placed.push(curr);
      }

      var minR = 0, minC = 0;
      resultPuzzles.forEach(function(p) {
        if (p.grid.r < minR) minR = p.grid.r;
        if (p.grid.c < minC) minC = p.grid.c;
      });

      resultPuzzles.forEach(function(p) {
        p.grid.r -= minR;
        p.grid.c -= minC;
      });

      builderJsonOut.value = JSON.stringify(resultPuzzles, null, 2);
    }

    document.getElementById('btn-load-custom').addEventListener('click', function() {
      var val = builderJsonOut.value.trim();
      if (!val) {
        alert('Genera primero un crucigrama.');
        return;
      }
      try {
        var customPuzzles = JSON.parse(val);
        init(customPuzzles);
        document.getElementById('tab-play').click();
      } catch(e) {
        alert('Error en la sintaxis JSON.');
      }
    });

  })();
  </script>
</body>
</html>
