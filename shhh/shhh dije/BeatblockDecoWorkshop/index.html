<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gif2sheet::hub</title>
<style>
:root{--bg:#0c0c10;--surface:#13131a;--surface-2:#1c1c26;--border:#25253a;--text:#e2e2f0;--muted:#8a8aa6;--accent:#e8a030;--good:#5fc98a;--bad:#e5655f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
.mono,h1,button,input,select,label.k,.tag{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
header{padding:28px 20px 8px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:22px;font-weight:600}h1 span{color:var(--accent)}
header p{color:var(--muted);margin:6px 0 0}
main{max-width:1100px;margin:0 auto;padding:16px 20px 60px}
#drop{border:2px dashed var(--border);border-radius:10px;padding:34px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface);transition:.15s}
#drop.over,#drop:hover{border-color:var(--accent);color:var(--text)}
#drop b{color:var(--accent)}
button{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 12px;font-size:12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#14100a;border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){color:#14100a;filter:brightness(1.1)}
input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input.bad{border-color:var(--bad)}
#bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.sheetwrap{background:repeating-conic-gradient(#2a2a38 0 25%,#1c1c26 0 50%) 0 0/16px 16px;border:1px solid var(--border);border-radius:6px;overflow:auto;max-height:440px;text-align:center}
.sheetwrap.light{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.sheetwrap canvas{max-width:100%;height:auto;image-rendering:pixelated;display:inline-block;vertical-align:top}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.f{display:flex;flex-direction:column;gap:3px}
label.k{font-size:11px;color:var(--muted)}
.warn{color:var(--accent);font-size:12px;margin:4px 0}
.err{color:var(--bad);font-size:12px;margin:4px 0}
.state{display:grid;grid-template-columns:1fr 1.4fr 70px auto auto;gap:6px;margin-bottom:6px;align-items:center}
.state label{font-size:12px;display:flex;gap:4px;align-items:center;color:var(--muted)}
pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;overflow:auto;max-height:200px;margin:8px 0}
.prev{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}
.prev canvas{background:repeating-conic-gradient(#2a2a38 0 25%,#1c1c26 0 50%) 0 0/12px 12px;border:1px solid var(--border);border-radius:6px;image-rendering:pixelated;max-width:160px;max-height:160px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>gif2sheet<span>::hub</span></h1>
  <p>Convierte GIFs animados en spritesheet PNG + JSON para «Animated decos». Todo se procesa en tu navegador.</p>
</header>
<main>
  <div id="drop"><b>Arrastra uno o varios GIF aquí</b> o haz clic para elegirlos<input id="file" type="file" accept="image/gif" multiple hidden></div>
  <div id="bar" hidden>
    <button class="primary" id="zipAll">Descargar todo (.zip)</button>
    <button id="clearAll">Quitar todos</button>
  </div>
  <div id="list"></div>
</main>
<script>
/*GIFLOGIC-START*/
function parseGif(u8){
  let p=0;const rd=()=>u8[p++],r16=()=>{const v=u8[p]|(u8[p+1]<<8);p+=2;return v};
  const sig=String.fromCharCode(u8[0],u8[1],u8[2],u8[3],u8[4],u8[5]);
  if(sig!=='GIF87a'&&sig!=='GIF89a')throw new Error('No es un archivo GIF válido');
  p=6;const width=r16(),height=r16(),pk=rd();rd();rd();
  let gct=null;
  if(pk&0x80){const n=3*(1<<((pk&7)+1));gct=u8.subarray(p,p+n);p+=n}
  const frames=[];let loops=null,gce=null;
  const skipSub=()=>{let s;while((s=rd())>0)p+=s};
  while(p<u8.length){
    const b=rd();
    if(b===0x3B)break;
    if(b===0x21){
      const l=rd();
      if(l===0xF9){rd();const f=rd(),d=r16(),t=rd();rd();gce={disposal:(f>>2)&7,delay:d,trans:(f&1)?t:-1}}
      else if(l===0xFF){const s=rd();const id=String.fromCharCode(...u8.subarray(p,p+s));p+=s;
        if(id.startsWith('NETSCAPE')){const sz=rd();if(sz>=3&&u8[p]===1){loops=u8[p+1]|(u8[p+2]<<8)}p+=sz;skipSub()}else skipSub()}
      else skipSub();
    }else if(b===0x2C){
      const left=r16(),top=r16(),w=r16(),h=r16(),f=rd();
      let pal=gct;
      if(f&0x80){const n=3*(1<<((f&7)+1));pal=u8.subarray(p,p+n);p+=n}
      const minCode=rd();const chunks=[];let s;
      while((s=rd())>0){chunks.push(u8.subarray(p,p+s));p+=s}
      let tot=0;for(const c of chunks)tot+=c.length;
      const data=new Uint8Array(tot);let o=0;for(const c of chunks){data.set(c,o);o+=c.length}
      frames.push({left,top,w,h,interlaced:!!(f&0x40),palette:pal,minCode,data,
        delay:gce?gce.delay:0,disposal:gce?gce.disposal:0,trans:gce?gce.trans:-1});
      gce=null;
    }else if(b!==0)break;
  }
  if(!frames.length)throw new Error('El GIF no contiene frames');
  return{width,height,loops,frames};
}
function lzwDecode(minCode,data,count){
  const out=new Uint8Array(count);
  const clear=1<<minCode,eoi=clear+1;
  let size=minCode+1,next=eoi+1,prev=-1,o=0,bits=0,acc=0,ip=0;
  const pre=new Int16Array(4096),suf=new Uint8Array(4096),stack=new Uint8Array(4097);
  for(let i=0;i<clear;i++)suf[i]=i;
  while(o<count){
    while(bits<size){if(ip>=data.length)return out;acc|=data[ip++]<<bits;bits+=8}
    let code=acc&((1<<size)-1);acc>>=size;bits-=size;
    if(code===clear){size=minCode+1;next=eoi+1;prev=-1;continue}
    if(code===eoi)break;
    let sp=0,cur=code;
    if(prev===-1){out[o++]=suf[code];prev=code;continue}
    if(code>=next){stack[sp++]=first(prev);cur=prev}
    function first(c){while(c>=clear)c=pre[c];return suf[c]}
    while(cur>=clear){stack[sp++]=suf[cur];cur=pre[cur]}
    const fc=suf[cur];stack[sp++]=fc;
    while(sp>0&&o<count)out[o++]=stack[--sp];
    if(next<4096){pre[next]=prev;suf[next]=fc;next++;if(next===(1<<size)&&size<12)size++}
    prev=code;
  }
  return out;
}
function interlaceRows(h){
  const r=[];for(const[s,st]of[[0,8],[4,8],[2,4],[1,2]])for(let y=s;y<h;y+=st)r.push(y);return r;
}
/* Compone cada frame sobre un buffer RGBA reutilizado; llama onFrame(i, rgba) tras componer. */
function renderGif(gif,rgba,onFrame){
  const W=gif.width,H=gif.height;rgba.fill(0);
  let snap=null;
  gif.frames.forEach((f,i)=>{
    if(f.disposal===3)snap=new Uint8ClampedArray(rgba);
    const px=lzwDecode(f.minCode,f.data,f.w*f.h),pal=f.palette;
    const rows=f.interlaced?interlaceRows(f.h):null;
    for(let j=0;j<f.h;j++){
      const sy=rows?rows[j]:j,y=f.top+sy;if(y>=H)continue;
      for(let x=0;x<f.w;x++){
        const gx=f.left+x;if(gx>=W)continue;
        const c=px[j*f.w+x];if(c===f.trans||!pal)continue;
        const d=(y*W+gx)*4;rgba[d]=pal[c*3];rgba[d+1]=pal[c*3+1];rgba[d+2]=pal[c*3+2];rgba[d+3]=255;
      }
    }
    onFrame(i,rgba);
    if(f.disposal===2){
      for(let y=f.top;y<Math.min(H,f.top+f.h);y++)for(let x=f.left;x<Math.min(W,f.left+f.w);x++){const d=(y*W+x)*4;rgba[d]=rgba[d+1]=rgba[d+2]=rgba[d+3]=0}
    }else if(f.disposal===3&&snap){rgba.set(snap)}
  });
}
function gifTiming(gif){
  const ds=gif.frames.map(f=>(f.delay<=1?10:f.delay)*10);
  const sum=ds.reduce((a,b)=>a+b,0),avg=sum/ds.length;
  return{avgMs:avg,minMs:Math.min(...ds),maxMs:Math.max(...ds),fps:1000/avg};
}
function layoutFor(n,cols){
  const c=cols>0?Math.min(cols,n):Math.ceil(Math.sqrt(n));
  return{cols:c,rows:Math.ceil(n/c)};
}
function parsePos(v){const n=Number(v);return Number.isInteger(n)&&n>0?n:0}
function roundFps(f){return Math.max(1,Math.round(f))}
function parseFrameList(str,n){
  const out=[];const s=String(str).trim();
  if(!s)return{error:'Lista de frames vacía'};
  for(const raw of s.split(',')){
    const t=raw.trim().replace(/[–—]/g,'-');
    if(!t)return{error:'Hay una coma de más'};
    let m=t.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){const a=+m[1],b=+m[2];
      if(a>=n||b>=n)return{error:`Frame fuera de rango en «${t}» (0-${n-1})`};
      if(a<=b)for(let i=a;i<=b;i++)out.push(i);else for(let i=a;i>=b;i--)out.push(i);continue}
    m=t.match(/^\d+$/);
    if(m){const a=+t;if(a>=n)return{error:`Frame ${a} fuera de rango (0-${n-1})`};out.push(a);continue}
    return{error:`«${t}» no es válido`};
  }
  return{frames:out};
}
function buildJson(info,fpsRaw,states){
  const errors=[],stateErrors=[];
  const fps=parsePos(fpsRaw);
  if(!fps)errors.push('FPS debe ser un entero ≥ 1');
  const obj={width:info.width,height:info.height,fps:fps||0,frames:info.frames};
  const names=new Set();
  if(states&&states.length){
    obj.states=[];
    states.forEach((s,i)=>{
      const e=[];const name=(s.name||'').trim();
      if(!name)e.push('Falta el nombre');else if(names.has(name))e.push('Nombre repetido');names.add(name);
      const pl=parseFrameList(s.frames,info.frames);if(pl.error)e.push(pl.error);
      let sf=null;if(String(s.fps||'').trim()!==''){sf=parsePos(String(s.fps).trim());if(!sf)e.push('FPS del estado inválido')}
      stateErrors[i]=e.join(' · ');if(e.length)errors.push(`Estado ${i+1}: ${e.join(', ')}`);
      const st={name,frames:pl.frames||[]};if(sf)st.fps=sf;st.loop=!!s.loop;obj.states.push(st);
    });
  }
  let text=JSON.stringify(obj,null,2);
  text=text.replace(/"frames": \[\n([\s\S]*?)\n\s*\]/g,(m,body)=>'"frames": ['+body.split(',').map(x=>x.trim()).join(', ')+']');
  return{text,errors,stateErrors,hasErrors:errors.length>0};
}
/*GIFLOGIC-END*/
</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const items=[];let uid=0;
const list=$('#list'),drop=$('#drop'),file=$('#file');
drop.onclick=()=>file.click();
file.onchange=()=>{addFiles(file.files);file.value=''};
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>addFiles(ev.dataTransfer.files));
$('#clearAll').onclick=()=>{items.length=0;render()};
$('#zipAll').onclick=zipAll;

async function addFiles(fl){
  for(const f of fl){
    if(!/gif$/i.test(f.type)&&!/\.gif$/i.test(f.name))continue;
    const it={id:++uid,name:f.name.replace(/\.gif$/i,'').replace(/[^\w\-. ]+/g,'_')||'sprite',cols:'',fps:'',states:[],view:'all',light:false,error:null};
    try{
      const gif=parseGif(new Uint8Array(await f.arrayBuffer()));
      it.gif=gif;it.timing=gifTiming(gif);it.fps=String(roundFps(it.timing.fps));it.loop=gif.loops!==1;
      buildSheet(it);
    }catch(e){it.error=e.message}
    items.push(it);
  }
  render();
}
function buildSheet(it){
  const g=it.gif,n=g.frames.length,L=layoutFor(n,parsePos(it.cols));
  const c=document.createElement('canvas');c.width=g.width*L.cols;c.height=g.height*L.rows;
  const ctx=c.getContext('2d');
  const buf=new Uint8ClampedArray(g.width*g.height*4);
  const fc=document.createElement('canvas');fc.width=g.width;fc.height=g.height;const fx=fc.getContext('2d');
  renderGif(g,buf,(i,rgba)=>{
    fx.putImageData(new ImageData(new Uint8ClampedArray(rgba),g.width,g.height),0,0);
    ctx.drawImage(fc,(i%L.cols)*g.width,Math.floor(i/L.cols)*g.height);
  });
  it.sheet=c;it.layout=L;
}
function info(it){return{width:it.gif.width,height:it.gif.height,frames:it.gif.frames.length}}
function jsonOf(it){return buildJson(info(it),it.fps,it.states)}
function blobOf(c){return new Promise(r=>c.toBlob(r,'image/png'))}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const timers=new Map();
function stopPrev(id){if(timers.has(id)){clearTimeout(timers.get(id));timers.delete(id)}}

function render(){
  timers.forEach(t=>clearTimeout(t));timers.clear();
  $('#bar').hidden=!items.length;
  list.innerHTML='';
  for(const it of items)list.appendChild(cardFor(it));
}
function cardFor(it){
  const el=document.createElement('div');el.className='card';
  if(it.error){el.innerHTML=`<h2>${esc(it.name)}</h2><div class="err">${esc(it.error)}</div><button data-rm>Quitar</button>`;
    el.querySelector('[data-rm]').onclick=()=>{items.splice(items.indexOf(it),1);render()};return el}
  const g=it.gif,n=g.frames.length,t=it.timing;
  const warns=[];
  if(n===1)warns.push('El GIF tiene un solo frame.');
  if(t.minMs!==t.maxMs)warns.push(`Los frames tienen retardos distintos (${t.minMs}–${t.maxMs} ms); el juego usa un FPS fijo.`);
  if(it.sheet.width>4096||it.sheet.height>4096)warns.push(`La hoja mide ${it.sheet.width}×${it.sheet.height}px; supera 4096 px y podría dar problemas.`);
  el.innerHTML=`
  <h2><span class="mono">${esc(it.name)}.gif</span><span class="tag">${g.width}×${g.height} · ${n} frames · ~${t.fps.toFixed(1)} fps</span></h2>
  <div class="grid">
    <div><div class="sheetwrap${it.light?' light':''}" data-sw></div>
      <div class="small" style="margin-top:6px">Hoja: ${it.sheet.width}×${it.sheet.height}px (${it.layout.cols}×${it.layout.rows}) · <a href="#" data-bg style="color:var(--accent)">cambiar fondo</a></div></div>
    <div>
      <div class="row">
        <div class="f" style="flex:2"><label class="k">Nombre (PNG y JSON)</label><input data-name value="${esc(it.name)}"></div>
        <div class="f" style="width:90px"><label class="k">Columnas</label><input data-cols placeholder="auto (${layoutFor(n,0).cols})" value="${esc(it.cols)}"></div>
        <div class="f" style="width:70px"><label class="k">FPS</label><input data-fps value="${esc(it.fps)}"></div>
      </div>
      ${warns.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}
      <label class="k">Estados (opcional)</label>
      <div data-states></div>
      <button data-addstate>+ Añadir estado</button>
      <div class="prev"><canvas data-pc width="${g.width}" height="${g.height}"></canvas>
        <div class="f"><label class="k">Previsualizar</label><select data-view></select></div></div>
    </div>
  </div>
  <div data-errs></div>
  <pre data-json></pre>
  <div class="acts"><button class="primary" data-png>Descargar PNG</button><button data-js>Descargar JSON</button><button data-rm>Quitar</button></div>`;
  const sw=el.querySelector('[data-sw]');sw.appendChild(it.sheet);
  el.querySelector('[data-bg]').onclick=e=>{e.preventDefault();it.light=!it.light;sw.classList.toggle('light',it.light)};
  el.querySelector('[data-name]').oninput=e=>{it.name=e.target.value.replace(/[\\/:*?"<>|]+/g,'_')||'sprite'};
  el.querySelector('[data-cols]').onchange=e=>{it.cols=e.target.value.trim();buildSheet(it);render()};
  el.querySelector('[data-fps]').oninput=e=>{it.fps=e.target.value;refresh()};
  el.querySelector('[data-addstate]').onclick=()=>{it.states.push({name:'estado'+(it.states.length+1),frames:`0-${n-1}`,fps:'',loop:it.loop});drawStates();refresh()};
  el.querySelector('[data-rm]').onclick=()=>{items.splice(items.indexOf(it),1);render()};
  el.querySelector('[data-png]').onclick=async()=>dl(await blobOf(it.sheet),it.name+'.png');
  el.querySelector('[data-js]').onclick=()=>{const j=jsonOf(it);if(!j.hasErrors)dl(new Blob([j.text],{type:'application/json'}),it.name+'.json')};
  const sel=el.querySelector('[data-view]');
  sel.onchange=()=>{it.view=sel.value;startPrev()};

  function drawStates(){
    const box=el.querySelector('[data-states]');box.innerHTML='';
    it.states.forEach((s,i)=>{
      const r=document.createElement('div');r.className='state';
      r.innerHTML=`<input data-n placeholder="nombre" value="${esc(s.name)}"><input data-f placeholder="0-3, 5" value="${esc(s.frames)}"><input data-sf placeholder="fps" value="${esc(s.fps)}"><label><input type="checkbox" data-l ${s.loop?'checked':''} style="min-width:0"> loop</label><button data-x>✕</button>`;
      r.querySelector('[data-n]').oninput=e=>{s.name=e.target.value;refresh()};
      r.querySelector('[data-f]').oninput=e=>{s.frames=e.target.value;refresh()};
      r.querySelector('[data-sf]').oninput=e=>{s.fps=e.target.value;refresh()};
      r.querySelector('[data-l]').onchange=e=>{s.loop=e.target.checked;refresh()};
      r.querySelector('[data-x]').onclick=()=>{it.states.splice(i,1);drawStates();refresh()};
      box.appendChild(r);
    });
  }
  function refresh(){
    const j=jsonOf(it);
    el.querySelector('[data-json]').textContent=j.text;
    el.querySelector('[data-errs]').innerHTML=j.errors.map(e=>`<div class="err">✕ ${esc(e)}</div>`).join('');
    el.querySelector('[data-js]').disabled=j.hasErrors;
    el.querySelectorAll('.state').forEach((r,i)=>r.querySelector('[data-f]').classList.toggle('bad',!!j.stateErrors[i]));
    const cur=it.view;sel.innerHTML='<option value="all">Todos los frames</option>'+it.states.map((s,i)=>`<option value="${i}">${esc(s.name||'estado '+(i+1))}</option>`).join('');
    sel.value=[...sel.options].some(o=>o.value===cur)?cur:'all';it.view=sel.value;
    startPrev();
  }
  function startPrev(){
    stopPrev(it.id);
    const cv=el.querySelector('[data-pc]'),cx=cv.getContext('2d');
    let seq=[],fps=parsePos(it.fps)||12,loop=true;
    if(it.view==='all'){seq=[...Array(n).keys()]}
    else{const s=it.states[+it.view];if(!s)return;const pl=parseFrameList(s.frames,n);seq=pl.frames||[];fps=parsePos(s.fps)||fps;loop=!!s.loop}
    if(!seq.length)return;
    let k=0;
    const step=()=>{
      if(!document.body.contains(cv)){return}
      const fi=seq[k],L=it.layout;
      cx.clearRect(0,0,cv.width,cv.height);
      cx.drawImage(it.sheet,(fi%L.cols)*g.width,Math.floor(fi/L.cols)*g.height,g.width,g.height,0,0,g.width,g.height);
      k++;if(k>=seq.length){if(loop)k=0;else return}
      timers.set(it.id,setTimeout(step,1000/fps));
    };
    step();
  }
  drawStates();refresh();
  return el;
}

async function zipAll(){
  const ok=items.filter(i=>!i.error);if(!ok.length)return;
  const bad=ok.filter(i=>jsonOf(i).hasErrors);
  if(bad.length&&!confirm('Hay JSON con errores ('+bad.map(b=>b.name).join(', ')+'). Se omitirán sus JSON. ¿Continuar?'))return;
  const used=new Set(),files=[];
  for(const it of ok){
    let base=it.name,k=2;while(used.has(base))base=it.name+'_'+k++;used.add(base);
    const png=new Uint8Array(await (await blobOf(it.sheet)).arrayBuffer());
    files.push({name:base+'.png',data:png});
    const j=jsonOf(it);if(!j.hasErrors)files.push({name:base+'.json',data:new TextEncoder().encode(j.text)});
  }
  dl(makeZip(files),'gif2sheet.zip');
}
/* ZIP mínimo sin compresión (store) */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(d){let c=~0;for(let i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return(~c)>>>0}
function makeZip(files){
  const parts=[],cd=[];let off=0;const enc=new TextEncoder();
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
    parts.push(h.buffer,nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(c.buffer,nm);off+=30+nm.length+sz;
  }
  let cds=0;for(const p of cd)cds+=p.byteLength;
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:'application/zip'});
}
