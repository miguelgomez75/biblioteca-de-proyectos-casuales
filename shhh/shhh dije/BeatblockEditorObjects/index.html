<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recolor a 8 colores</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#161a20; --border:#2a2f38; --text:#e8eaed;
    --muted:#9aa3af; --accent:#ffb020;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Mono', 'Inter', ui-monospace, monospace;
    display:flex; flex-direction:column; align-items:center; padding:32px 16px;
  }
  h1{font-size:1.3rem; margin:0 0 4px; letter-spacing:.02em}
  p.sub{color:var(--muted); margin:0 0 24px; font-size:.9rem}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:24px; width:100%; max-width:640px;
  }
  .drop{
    border:2px dashed var(--border); border-radius:10px; padding:32px 16px;
    text-align:center; cursor:pointer; transition:.15s border-color;
  }
  .drop:hover, .drop.drag{border-color:var(--accent)}
  .drop span{color:var(--muted); font-size:.85rem}
  input[type=file]{display:none}
  .palette{display:flex; gap:8px; margin:18px 0; flex-wrap:wrap}
  .sw{width:26px; height:26px; border-radius:6px; border:1px solid var(--border)}
  .opts{display:flex; gap:14px; align-items:center; margin-bottom:14px; flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
  label{display:flex; align-items:center; gap:6px; cursor:pointer}
  .section-title{font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 8px}
  .scale-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.85rem}
  .scale-row input[type=number]{
    width:80px; background:#0d0f12; border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family:inherit;
  }
  .scale-row button{
    background:transparent; border:1px solid var(--border); color:var(--text);
    padding:6px 12px; font-size:.8rem; margin:0;
  }
  .scale-row button:hover{border-color:var(--accent)}
  canvas#workCanvas{display:none}
  .preview{display:flex; gap:16px; flex-wrap:wrap; margin-top:18px}
  .preview figure{flex:1; min-width:220px; margin:0; text-align:center}
  .preview img, .preview canvas.show{
    max-width:100%; border-radius:8px; border:1px solid var(--border);
    image-rendering:pixelated;
  }
  figcaption{color:var(--muted); font-size:.75rem; margin-top:6px}
  button{
    background:var(--accent); color:#1a1200; border:none; border-radius:8px;
    padding:10px 18px; font-weight:600; cursor:pointer; font-family:inherit;
    margin-top:18px;
  }
  button:disabled{opacity:.4; cursor:not-allowed}
  #status{color:var(--muted); font-size:.8rem; margin-top:10px; min-height:1em}
</style>
</head>
<body>

<h1>Recolor a 8 colores</h1>
<p class="sub">Convierte cualquier imagen a la paleta exacta de 8 colores puros, siempre a opacidad total</p>

<div class="card">

  <div class="palette">
    <div class="sw" style="background:#ffffff" title="blanco"></div>
    <div class="sw" style="background:#000000" title="negro"></div>
    <div class="sw" style="background:#ff0000" title="rojo"></div>
    <div class="sw" style="background:#0000ff" title="azul"></div>
    <div class="sw" style="background:#00ff00" title="verde"></div>
    <div class="sw" style="background:#ffff00" title="amarillo"></div>
    <div class="sw" style="background:#ff00ff" title="rosa"></div>
    <div class="sw" style="background:#00ffff" title="aqua"></div>
  </div>

  <div class="opts">
    <label><input type="radio" name="mode" value="nearest" checked> Directo (bordes limpios)</label>
    <label><input type="radio" name="mode" value="dither"> Difuminado (más detalle, con trama)</label>
  </div>

  <div class="drop" id="drop">
    <span id="dropText">Haz clic o arrastra una imagen aquí</span>
    <input type="file" id="file" accept="image/*">
  </div>

  <div class="section-title">Escalar (vecino más cercano, no genera colores nuevos)</div>
  <div class="scale-row">
    <label>Ancho <input type="number" id="widthInput" min="1"></label>
    <label>Alto <input type="number" id="heightInput" min="1"></label>
    <label><input type="checkbox" id="lockAspect" checked> proporción</label>
    <button type="button" id="resetSize">Tamaño original</button>
  </div>

  <div class="preview" id="preview" style="display:none">
    <figure>
      <img id="origImg">
      <figcaption>Original</figcaption>
    </figure>
    <figure>
      <canvas class="show" id="outCanvas"></canvas>
      <figcaption>Resultado (8 colores, opacidad total)</figcaption>
    </figure>
  </div>

  <canvas id="workCanvas"></canvas>

  <button id="downloadBtn" disabled>Descargar imagen recoloreada</button>
  <div id="status"></div>
</div>

<script>
const PALETTE = [
  [255,255,255], // blanco
  [0,0,0],       // negro
  [255,0,0],     // rojo
  [0,0,255],     // azul
  [0,255,0],     // verde
  [255,255,0],   // amarillo
  [255,0,255],   // rosa
  [0,255,255],   // aqua
];

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const dropText = document.getElementById('dropText');
const preview = document.getElementById('preview');
const origImg = document.getElementById('origImg');
const outCanvas = document.getElementById('outCanvas');
const workCanvas = document.getElementById('workCanvas');
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');
const widthInput = document.getElementById('widthInput');
const heightInput = document.getElementById('heightInput');
const lockAspect = document.getElementById('lockAspect');
const resetSize = document.getElementById('resetSize');

let currentBlobUrl = null;
let aspectRatio = 1;
let syncing = false;

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

document.querySelectorAll('input[name=mode]').forEach(r => {
  r.addEventListener('change', () => { if (origImg.src) processImage(); });
});

widthInput.addEventListener('input', () => {
  if (syncing) return;
  const w = parseInt(widthInput.value) || 1;
  if (lockAspect.checked){
    syncing = true;
    heightInput.value = Math.max(1, Math.round(w / aspectRatio));
    syncing = false;
  }
  if (origImg.src) processImage();
});
heightInput.addEventListener('input', () => {
  if (syncing) return;
  const h = parseInt(heightInput.value) || 1;
  if (lockAspect.checked){
    syncing = true;
    widthInput.value = Math.max(1, Math.round(h * aspectRatio));
    syncing = false;
  }
  if (origImg.src) processImage();
});
resetSize.addEventListener('click', () => {
  widthInput.value = origImg.naturalWidth;
  heightInput.value = origImg.naturalHeight;
  if (origImg.src) processImage();
});

function handleFile(file){
  if (!file.type.startsWith('image/')) { statusEl.textContent = 'Eso no es una imagen.'; return; }
  const reader = new FileReader();
  reader.onload = e => {
    origImg.onload = () => {
      preview.style.display = 'flex';
      dropText.textContent = file.name;
      aspectRatio = origImg.naturalWidth / origImg.naturalHeight;
      widthInput.value = origImg.naturalWidth;
      heightInput.value = origImg.naturalHeight;
      processImage();
    };
    origImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// distancia cuadrada a un color de la paleta
function nearestColor(r,g,b){
  let best = PALETTE[0], bestD = Infinity;
  for (const c of PALETTE){
    const d = (r-c[0])**2 + (g-c[1])**2 + (b-c[2])**2;
    if (d < bestD){ bestD = d; best = c; }
  }
  return best;
}

function processImage(){
  const w = Math.max(1, parseInt(widthInput.value) || origImg.naturalWidth);
  const h = Math.max(1, parseInt(heightInput.value) || origImg.naturalHeight);

  workCanvas.width = w; workCanvas.height = h;
  const wctx = workCanvas.getContext('2d', { willReadFrequently: true });
  // sin suavizado: escalado por vecino más cercano, no mezcla colores ni crea tonos nuevos
  wctx.imageSmoothingEnabled = false;
  wctx.drawImage(origImg, 0, 0, w, h);

  const imgData = wctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const mode = document.querySelector('input[name=mode]:checked').value;

  // el alfa se lleva a binario: opaco del todo o transparente del todo.
  // así no quedan bordes semitransparentes (el gris de antialiasing
  // mezclado con el fondo) PERO el fondo realmente transparente del PNG
  // se mantiene transparente, no se vuelve negro.
  const ALPHA_THRESHOLD = 128;
  for (let i = 3; i < data.length; i += 4){
    data[i] = data[i] >= ALPHA_THRESHOLD ? 255 : 0;
  }

  if (mode === 'nearest'){
    for (let i = 0; i < data.length; i += 4){
      const [r,g,b] = nearestColor(data[i], data[i+1], data[i+2]);
      data[i] = r; data[i+1] = g; data[i+2] = b;
      // el alfa ya quedó fijado arriba (0 o 255): no se toca aquí
    }
  } else {
    // Floyd–Steinberg: cada píxel de SALIDA sigue siendo exactamente
    // uno de los 8 colores; solo el error de cuantización se difunde
    // a los vecinos, lo que produce una trama que sugiere más matices.
    const buf = new Float32Array(data.length);
    for (let i = 0; i < data.length; i++) buf[i] = data[i];

    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const idx = (y*w + x) * 4;
        const r0 = buf[idx], g0 = buf[idx+1], b0 = buf[idx+2];
        const [r,g,b] = nearestColor(
          Math.max(0, Math.min(255, r0)),
          Math.max(0, Math.min(255, g0)),
          Math.max(0, Math.min(255, b0))
        );
        const er = r0 - r, eg = g0 - g, eb = b0 - b;
        data[idx] = r; data[idx+1] = g; data[idx+2] = b;
        // el alfa ya quedó fijado arriba (0 o 255): no se difunde ni se toca aquí

        const spread = (dx, dy, factor) => {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || nx >= w || ny < 0 || ny >= h) return;
          const nidx = (ny*w + nx) * 4;
          buf[nidx]   += er * factor;
          buf[nidx+1] += eg * factor;
          buf[nidx+2] += eb * factor;
        };
        spread(1, 0, 7/16);
        spread(-1, 1, 3/16);
        spread(0, 1, 5/16);
        spread(1, 1, 1/16);
      }
    }
  }

  outCanvas.width = w; outCanvas.height = h;
  outCanvas.getContext('2d').putImageData(imgData, 0, 0);

  outCanvas.toBlob(blob => {
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(blob);
    downloadBtn.disabled = false;
    statusEl.textContent = `Listo: ${w}×${h}px, sin semitransparencias, solo los 8 colores permitidos.`;
  }, 'image/png');
}

downloadBtn.addEventListener('click', () => {
  if (!currentBlobUrl) return;
  const a = document.createElement('a');
  a.href = currentBlobUrl;
  a.download = 'recoloreada-8colores.png';
  a.click();
});
</script>

</body>
</html>
