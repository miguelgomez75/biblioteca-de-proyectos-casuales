<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>audio::lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c0c10; --surface:#13131a; --surface-2:#1c1c26; --border:#25253a;
    --text:#e2e2f0; --text-2:#8080a0; --text-3:#454560; --accent:#e8a030;
    --good:#34d399; --bad:#f87171; --beat:#f97316;
    --font-ui:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
    --r:10px; --rl:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:2rem 1rem 3rem}
  header{text-align:center;margin-bottom:1.5rem}
  .logo{font-family:var(--font-mono);font-size:1.9rem;font-weight:600;letter-spacing:-.03em}
  .logo span{color:var(--accent)}
  .tagline{font-size:12px;color:var(--text-3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
  .shell{width:100%;max-width:900px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.2rem;margin-bottom:1rem}
  .sec{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}
  button{font-family:var(--font-ui);font-size:13px;font-weight:500;cursor:pointer;
    border:1px solid var(--border);border-radius:var(--r);padding:7px 13px;
    background:var(--surface-2);color:var(--text);transition:border-color .15s,transform .08s}
  button:hover:not(:disabled){border-color:#40405a}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-p{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
  .btn-p:hover:not(:disabled){opacity:.9;border-color:var(--accent)}

  /* drop */
  .drop{border:2px dashed var(--border);border-radius:var(--rl);min-height:130px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:8px;color:var(--text-3);font-size:13px;cursor:pointer;transition:border-color .2s}
  .drop.over{border-color:var(--accent)}
  .drop.loaded{border-style:solid;border-color:var(--good);cursor:default;min-height:unset;padding:14px 18px}
  input[type=file]{display:none}

  /* player */
  .player-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .play-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;flex:0 0 auto;background:var(--accent);color:#000;border-color:var(--accent)}
  .play-btn:hover:not(:disabled){opacity:.9;border-color:var(--accent)}
  .time-label{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2);white-space:nowrap}

  /* progress bar */
  .progress-wrap{position:relative;height:32px;background:var(--bg);border:1px solid var(--border);
    border-radius:6px;overflow:hidden;cursor:pointer;flex:1}
  .progress-fill{position:absolute;top:0;left:0;height:100%;background:rgba(232,160,48,.18);
    pointer-events:none;transition:width .1s linear}
  .beat-marker{position:absolute;top:0;width:2px;height:100%;background:var(--beat);opacity:.6;pointer-events:none}
  .progress-thumb{position:absolute;top:0;width:2px;height:100%;background:var(--accent);pointer-events:none}

  /* info pills */
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .pill{background:var(--bg);border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;font-family:var(--font-mono);font-size:12px}
  .pill span{color:var(--accent)}

  /* canvas */
  canvas{display:block;width:100%;border-radius:8px;background:#000}
  .canvas-label{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-bottom:6px;letter-spacing:.05em}

  /* beat flash overlay */
  #beat-flash{position:fixed;inset:0;pointer-events:none;background:var(--beat);opacity:0;z-index:999;
    transition:opacity .08s}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
    padding:8px 18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo">audio<span>::</span>lens</div>
  <div class="tagline">BPM · Espectrograma · Beat detection</div>
</header>

<div class="shell">

  <!-- CARGA -->
  <div class="card">
    <div class="sec">Archivo de audio</div>
    <div class="drop" id="drop">
      <span style="font-size:2rem">🎵</span>
      <span>Arrastra un MP3, OGG, WAV o FLAC</span>
      <span style="font-size:11px">o haz clic para seleccionar</span>
    </div>
    <input type="file" id="fileIn" accept="audio/*">
  </div>

  <!-- PLAYER + INFO -->
  <div class="card" id="player-card" style="display:none">
    <div class="sec">Reproductor</div>
    <div class="pills" id="pills"></div>
    <div class="player-row">
      <button class="play-btn" id="playBtn" disabled>▶</button>
      <span class="time-label" id="timeCur">0:00</span>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill"></div>
        <div id="beatMarkers"></div>
        <div class="progress-thumb" id="progressThumb" style="left:0"></div>
      </div>
      <span class="time-label" id="timeTot">0:00</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <label style="font-family:var(--font-mono);font-size:11px;color:var(--text-3)">Volumen</label>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1"
        style="accent-color:var(--accent);width:100px;cursor:pointer">
      <label style="font-family:var(--font-mono);font-size:11px;color:var(--text-3);margin-left:16px">Flash beats</label>
      <input type="checkbox" id="flashToggle" checked style="accent-color:var(--accent);cursor:pointer">
    </div>
  </div>

  <!-- ESPECTROGRAMA ESTÁTICO -->
  <div class="card" id="static-card" style="display:none">
    <div class="sec">Espectrograma completo (estático)</div>
    <div class="canvas-label">Frecuencia (eje Y: 0 Hz → Nyquist) · Tiempo (eje X) · Amplitud → color</div>
    <canvas id="staticCanvas" height="200"></canvas>
  </div>

  <!-- DINÁMICO -->
  <div class="card" id="live-card" style="display:none">
    <div class="sec">Espectrograma en tiempo real</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
      <label style="font-family:var(--font-mono);font-size:11px;color:var(--text-3)">Modo</label>
      <button class="btn-mode" id="modeSpec" style="background:var(--accent);color:#000;border-color:var(--accent)">Espectrograma</button>
      <button class="btn-mode" id="modeOsc">Osciloscopio</button>
    </div>
    <canvas id="liveCanvas" height="180"></canvas>
  </div>

</div>

<div id="beat-flash"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ─── elementos ─── */
const drop         = document.getElementById('drop');
const fileIn       = document.getElementById('fileIn');
const playerCard   = document.getElementById('player-card');
const staticCard   = document.getElementById('static-card');
const liveCard     = document.getElementById('live-card');
const playBtn      = document.getElementById('playBtn');
const timeCur      = document.getElementById('timeCur');
const timeTot      = document.getElementById('timeTot');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressThumb= document.getElementById('progressThumb');
const beatMarkersEl= document.getElementById('beatMarkers');
const pillsEl      = document.getElementById('pills');
const volSlider    = document.getElementById('volSlider');
const flashToggle  = document.getElementById('flashToggle');
const staticCanvas = document.getElementById('staticCanvas');
const liveCanvas   = document.getElementById('liveCanvas');
const modeSpec     = document.getElementById('modeSpec');
const modeOsc      = document.getElementById('modeOsc');
const beatFlash    = document.getElementById('beat-flash');
const toastEl      = document.getElementById('toast');

let audioCtx, sourceNode, gainNode, analyser, animRAF;
let audioBuffer = null;
let startTime = 0, pauseOffset = 0, playing = false;
let beatTimes = [];
let liveMode = 'spec'; // 'spec' | 'osc'
let spectrogramHistory = []; // columnas para el espectrograma dinámico scrollante

/* ─── utilidades ─── */
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1800);
}
function fmt(s){ const m=Math.floor(s/60); return m+':'+(Math.floor(s%60)<10?'0':'')+Math.floor(s%60); }
function pill(label,val){
  const d=document.createElement('div');
  d.className='pill'; d.innerHTML=label+': <span>'+val+'</span>'; return d;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ─── colormap (negro→azul→verde→amarillo→rojo) ─── */
function specColor(norm){
  const v=clamp(norm,0,1);
  if(v<.25){ const t=v/.25; return [0,0,Math.round(t*220)]; }
  if(v<.5){ const t=(v-.25)/.25; return [0,Math.round(t*200),Math.round(220*(1-t))]; }
  if(v<.75){ const t=(v-.5)/.25; return [Math.round(t*240),220,0]; }
  const t=(v-.75)/.25; return [240,Math.round(220*(1-t)),0];
}

/* ─── carga de audio ─── */
drop.addEventListener('click',()=>{ if(!drop.classList.contains('loaded')) fileIn.click(); });
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
fileIn.addEventListener('change',()=>{if(fileIn.files[0])loadFile(fileIn.files[0]);fileIn.value='';});

async function loadFile(file){
  if(!file.type.startsWith('audio/')){toast('Formato no soportado');return;}
  drop.innerHTML='<span style="font-size:1.3rem">⏳</span><span>Decodificando…</span>';
  try{
    const buf=await file.arrayBuffer();
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    audioBuffer=await audioCtx.decodeAudioData(buf);
    drop.innerHTML='<span style="color:var(--good)">✓</span><span style="color:var(--good)">'+file.name+'</span>';
    drop.classList.add('loaded');
    await setup(file.name);
  }catch(e){
    drop.innerHTML='<span style="color:var(--bad)">✗ Error: '+e.message+'</span>';
  }
}

/* ─── setup post-decode ─── */
async function setup(name){
  playerCard.style.display=staticCard.style.display=liveCard.style.display='block';
  playBtn.disabled=false;

  /* info */
  pillsEl.innerHTML='';
  pillsEl.appendChild(pill('Duración',fmt(audioBuffer.duration)));
  pillsEl.appendChild(pill('Sample rate',audioBuffer.sampleRate+' Hz'));
  pillsEl.appendChild(pill('Canales',audioBuffer.numberOfChannels));

  /* beats + BPM */
  beatTimes=detectBeats(audioBuffer);
  const bpm=estimateBPM(beatTimes,audioBuffer.duration);
  pillsEl.appendChild(pill('BPM estimado',bpm.toFixed(1)));
  pillsEl.appendChild(pill('Beats detectados',beatTimes.length));

  /* markers en la barra */
  beatMarkersEl.innerHTML='';
  beatTimes.forEach(t=>{
    const d=document.createElement('div');
    d.className='beat-marker';
    d.style.left=(t/audioBuffer.duration*100)+'%';
    beatMarkersEl.appendChild(d);
  });

  /* espectrograma estático */
  renderStaticSpectrogram();

  /* timeTot */
  timeTot.textContent=fmt(audioBuffer.duration);
}

/* ─── beat detection: energy-based onset ─── */
function detectBeats(buf){
  const ch=buf.getChannelData(0);
  const sr=buf.sampleRate;
  const frameSize=Math.round(sr*0.02); // 20ms
  const hopSize=Math.round(sr*0.01);   // 10ms hop
  const frames=Math.floor((ch.length-frameSize)/hopSize);

  /* RMS por frame */
  const rms=new Float32Array(frames);
  for(let i=0;i<frames;i++){
    let sum=0;
    for(let j=0;j<frameSize;j++) sum+=ch[i*hopSize+j]**2;
    rms[i]=Math.sqrt(sum/frameSize);
  }

  /* media local + umbral */
  const win=Math.round(0.4/0.01); // ventana 400ms
  const beats=[];
  let lastBeat=-0.15;
  for(let i=win;i<frames-win;i++){
    let localMean=0;
    for(let k=i-win;k<i+win;k++) localMean+=rms[k];
    localMean/=(2*win);
    const t=i*hopSize/sr;
    if(rms[i]>localMean*1.55 && rms[i]>rms[i-1] && rms[i]>=rms[i+1] && t-lastBeat>0.12){
      beats.push(t);
      lastBeat=t;
    }
  }
  return beats;
}

function estimateBPM(beats,duration){
  if(beats.length<4) return 0;
  const intervals=[];
  for(let i=1;i<beats.length;i++) intervals.push(beats[i]-beats[i-1]);
  intervals.sort((a,b)=>a-b);
  const mid=intervals[Math.floor(intervals.length/2)];
  let bpm=60/mid;
  while(bpm>200) bpm/=2;
  while(bpm<60) bpm*=2;
  return bpm;
}

/* ─── espectrograma estático ─── */
function renderStaticSpectrogram(){
  const offlineCtx=new OfflineAudioContext(1,audioBuffer.length,audioBuffer.sampleRate);
  const src=offlineCtx.createBufferSource();
  src.buffer=audioBuffer;
  const an=offlineCtx.createAnalyser();
  an.fftSize=2048;
  src.connect(an); an.connect(offlineCtx.destination);
  src.start();

  const fftSize=2048, bins=fftSize/2;
  const hopSamples=Math.round(audioBuffer.sampleRate*0.02); // ~20ms por columna
  const totalCols=Math.floor(audioBuffer.length/hopSamples);
  const W=staticCanvas.offsetWidth||800, H=200;
  staticCanvas.width=W; staticCanvas.height=H;
  const ctx=staticCanvas.getContext('2d');
  const imgData=ctx.createImageData(W,H);
  const data=imgData.data;

  /* extracción directa del PCM con FFT manual Goertzel simplificada → usamos FFT via Float32 overlap */
  const raw=audioBuffer.getChannelData(0);
  const fft=fftSize, halfBins=fft/2;
  const window=new Float32Array(fft);
  for(let i=0;i<fft;i++) window[i]=0.5-0.5*Math.cos(2*Math.PI*i/fft); // Hann

  /* muestreamos totalCols columnas, las mapeamos a W píxeles */
  const cols=Math.min(totalCols,W*4);
  const colData=[];
  for(let c=0;c<cols;c++){
    const offset=Math.floor(c*audioBuffer.length/cols);
    const re=new Float32Array(fft), im=new Float32Array(fft);
    for(let i=0;i<fft;i++){
      const s=offset+i<raw.length?raw[offset+i]:0;
      re[i]=s*window[i]; im[i]=0;
    }
    fftInPlace(re,im);
    const mag=new Float32Array(halfBins);
    for(let i=0;i<halfBins;i++) mag[i]=Math.sqrt(re[i]**2+im[i]**2);
    colData.push(mag);
  }

  /* normalizar global */
  let maxV=0;
  colData.forEach(m=>m.forEach(v=>{if(v>maxV)maxV=v;}));
  if(maxV===0)maxV=1;

  /* pintar */
  for(let px=0;px<W;px++){
    const c=Math.floor(px*cols/W);
    const mag=colData[c];
    for(let py=0;py<H;py++){
      const bin=Math.floor((H-1-py)*halfBins/H); // frecuencia baja abajo
      const norm=Math.log1p(mag[bin]/maxV*200)/Math.log1p(200);
      const [r,g,b]=specColor(norm);
      const idx=(py*W+px)*4;
      data[idx]=r; data[idx+1]=g; data[idx+2]=b; data[idx+3]=255;
    }
  }
  ctx.putImageData(imgData,0,0);

  /* línea de progreso superpuesta */
  staticCanvas._ctx=ctx;
  staticCanvas._w=W; staticCanvas._h=H;
  staticCanvas._imgData=imgData;

  /* clic en estático → seek */
  staticCanvas.style.cursor='pointer';
  staticCanvas.addEventListener('click',e=>{
    const rect=staticCanvas.getBoundingClientRect();
    const ratio=(e.clientX-rect.left)/rect.width;
    seekTo(ratio*audioBuffer.duration);
  });
}

/* ─── FFT Cooley-Tukey in-place ─── */
function fftInPlace(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1;
    for(;j&bit;bit>>=1) j^=bit;
    j^=bit;
    if(i<j){ [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; }
  }
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len;
    const wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cr=1,ci=0;
      for(let j=0;j<len/2;j++){
        const ur=re[i+j],ui=im[i+j];
        const vr=re[i+j+len/2]*cr-im[i+j+len/2]*ci;
        const vi=re[i+j+len/2]*ci+im[i+j+len/2]*cr;
        re[i+j]=ur+vr; im[i+j]=ui+vi;
        re[i+j+len/2]=ur-vr; im[i+j+len/2]=ui-vi;
        const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr;
      }
    }
  }
}

/* ─── reproducción ─── */
function buildGraph(){
  if(sourceNode){ try{sourceNode.disconnect();}catch(e){} }
  if(!analyser){
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    gainNode=audioCtx.createGain();
    gainNode.gain.value=volSlider.value;
    analyser.connect(gainNode); gainNode.connect(audioCtx.destination);
  }
  sourceNode=audioCtx.createBufferSource();
  sourceNode.buffer=audioBuffer;
  sourceNode.connect(analyser);
  sourceNode.onended=()=>{ if(playing){ playing=false; playBtn.textContent='▶'; pauseOffset=0; }};
}

function play(){
  if(audioCtx.state==='suspended') audioCtx.resume();
  buildGraph();
  startTime=audioCtx.currentTime-pauseOffset;
  sourceNode.start(0,pauseOffset);
  playing=true; playBtn.textContent='⏸';
  startLiveLoop();
}

function pause(){
  pauseOffset=audioCtx.currentTime-startTime;
  sourceNode.stop();
  playing=false; playBtn.textContent='▶';
  cancelAnimationFrame(animRAF);
}

function seekTo(t){
  t=clamp(t,0,audioBuffer.duration);
  const wasPlaying=playing;
  if(playing) pause();
  pauseOffset=t;
  updateProgress(t);
  if(wasPlaying) play();
}

playBtn.addEventListener('click',()=>{
  if(!audioBuffer)return;
  if(playing) pause(); else play();
});

volSlider.addEventListener('input',()=>{
  if(gainNode) gainNode.gain.value=volSlider.value;
});

progressWrap.addEventListener('click',e=>{
  const rect=progressWrap.getBoundingClientRect();
  seekTo((e.clientX-rect.left)/rect.width*audioBuffer.duration);
});

/* ─── loop animación ─── */
let lastBeatFlashIdx=0;

function startLiveLoop(){
  cancelAnimationFrame(animRAF);
  lastBeatFlashIdx=0;
  loop();
}

function loop(){
  if(!playing){return;}
  animRAF=requestAnimationFrame(loop);

  const cur=audioCtx.currentTime-startTime;
  updateProgress(cur);

  /* beat flash */
  if(flashToggle.checked){
    while(lastBeatFlashIdx<beatTimes.length && beatTimes[lastBeatFlashIdx]<cur){
      triggerFlash();
      lastBeatFlashIdx++;
    }
  }

  /* live canvas */
  if(liveMode==='spec') drawLiveSpec();
  else drawOsc();

  /* línea en el estático */
  drawStaticLine(cur);
}

function updateProgress(cur){
  const pct=clamp(cur/audioBuffer.duration*100,0,100);
  progressFill.style.width=pct+'%';
  progressThumb.style.left=pct+'%';
  timeCur.textContent=fmt(cur);
}

function triggerFlash(){
  beatFlash.style.opacity='0.12';
  clearTimeout(beatFlash._t);
  beatFlash._t=setTimeout(()=>beatFlash.style.opacity='0',80);
}

/* ─── espectrograma dinámico scrollante ─── */
function drawLiveSpec(){
  const W=liveCanvas.offsetWidth||800, H=180;
  if(liveCanvas.width!==W||liveCanvas.height!==H){ liveCanvas.width=W; liveCanvas.height=H; spectrogramHistory=[]; }
  const ctx=liveCanvas.getContext('2d');
  const bins=analyser.frequencyBinCount;
  const freqData=new Uint8Array(bins);
  analyser.getByteFrequencyData(freqData);

  /* desplazar imagen 1px a la izquierda */
  const img=ctx.getImageData(1,0,W-1,H);
  ctx.putImageData(img,0,0);

  /* pintar columna derecha */
  for(let py=0;py<H;py++){
    const bin=Math.floor((H-1-py)*bins/H);
    const norm=freqData[bin]/255;
    const [r,g,b]=specColor(norm);
    ctx.fillStyle='rgb('+r+','+g+','+b+')';
    ctx.fillRect(W-1,py,1,1);
  }
}

/* ─── osciloscopio ─── */
function drawOsc(){
  const W=liveCanvas.offsetWidth||800, H=180;
  if(liveCanvas.width!==W||liveCanvas.height!==H){ liveCanvas.width=W; liveCanvas.height=H; }
  const ctx=liveCanvas.getContext('2d');
  const bins=analyser.fftSize;
  const timeData=new Uint8Array(bins);
  analyser.getByteTimeDomainData(timeData);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='var(--accent)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  for(let i=0;i<W;i++){
    const s=Math.floor(i*bins/W);
    const y=(timeData[s]/128.0)*(H/2);
    i===0?ctx.moveTo(i,y):ctx.lineTo(i,y);
  }
  ctx.stroke();
  /* línea central */
  ctx.strokeStyle='rgba(232,160,48,.15)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
}

/* ─── línea de progreso sobre el estático ─── */
function drawStaticLine(cur){
  if(!staticCanvas._ctx) return;
  const ctx=staticCanvas._ctx;
  const W=staticCanvas._w, H=staticCanvas._h;
  ctx.putImageData(staticCanvas._imgData,0,0);
  const x=Math.floor(cur/audioBuffer.duration*W);
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillRect(x,0,2,H);
}

/* ─── modo live ─── */
modeSpec.addEventListener('click',()=>{
  liveMode='spec';
  modeSpec.style.background='var(--accent)'; modeSpec.style.color='#000'; modeSpec.style.borderColor='var(--accent)';
  modeOsc.style.background=''; modeOsc.style.color=''; modeOsc.style.borderColor='';
  spectrogramHistory=[];
});
modeOsc.addEventListener('click',()=>{
  liveMode='osc';
  modeOsc.style.background='var(--accent)'; modeOsc.style.color='#000'; modeOsc.style.borderColor='var(--accent)';
  modeSpec.style.background=''; modeSpec.style.color=''; modeSpec.style.borderColor='';
});

})();
</script>
