<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>recipes::hub — Recetas</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--surface:#13131a;--surface-2:#1c1c26;--border:#25253a;--border-2:#40405a;--text:#e2e2f0;--text-2:#8080a0;--text-3:#454560;--accent:#e8a030;--accent-dim:#271d08;--good:#7cc98a;--bad:#f87171;--font-ui:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;--radius:10px;--radius-lg:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(2rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
.logo{font:600 1.9rem var(--font-mono);letter-spacing:-.03em}.logo span{color:var(--accent)}
.tagline{font-size:12.5px;color:var(--text-3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
header{text-align:center;margin-bottom:1.4rem}
.shell{width:100%;max-width:1000px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem;margin-bottom:1rem}
.section-title{font:11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:.8rem}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 13px;font:500 12.5px var(--font-ui);cursor:pointer;transition:border-color .15s,transform .08s}
.btn:hover{border-color:var(--border-2)}.btn:active{transform:scale(.96)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn.icon{padding:8px 10px}

.filter-row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:13.5px var(--font-ui);padding:10px 12px;outline:none;flex:2;min-width:160px}
input:focus{border-color:var(--accent)}
select{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:12.5px var(--font-ui);padding:9px 10px;outline:none;flex:1;min-width:120px}
select:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:.8rem}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 6px 5px 12px;font:11.5px var(--font-ui);color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .x{opacity:.6}.chip .x:hover{opacity:1;color:var(--bad)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.meal-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .1s}
.meal-card:hover{border-color:var(--border-2);transform:translateY(-2px)}
.meal-card img{width:100%;aspect-ratio:1.3;object-fit:cover;display:block;background:var(--bg)}
.meal-card .mc-body{padding:.6rem .7rem}
.meal-card .mc-name{font:500 13px var(--font-ui);line-height:1.3;margin-bottom:3px}
.meal-card .mc-tags{font:10px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.03em}

.loading,.empty-msg,.error-msg{text-align:center;color:var(--text-3);font:12.5px var(--font-ui);padding:2rem 0;grid-column:1/-1}
.error-msg{color:var(--bad)}

/* ── modal detalle ── */
#overlay{position:fixed;inset:0;background:rgba(6,6,9,.78);backdrop-filter:blur(4px);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:3rem 1rem}
#overlay.show{display:flex}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:640px;width:100%;padding:1.4rem;position:relative}
#modal-close{position:absolute;top:14px;right:14px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:8px;width:32px;height:32px;cursor:pointer}
#modal-img{width:100%;border-radius:12px;aspect-ratio:1.6;object-fit:cover;margin-bottom:1rem}
#modal-name{font:600 1.4rem var(--font-ui);margin-bottom:4px;padding-right:30px}
#modal-tags{font:11px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1rem}
.modal-actions{display:flex;gap:8px;margin-bottom:1.1rem;flex-wrap:wrap}
.ing-list{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-bottom:1.2rem}
.ing-row{display:flex;justify-content:space-between;font:12.5px var(--font-ui);border-bottom:1px solid var(--border);padding:5px 0}
.ing-row b{font-weight:500}
.ing-row span{color:var(--text-3);font-family:var(--font-mono);font-size:11.5px}
.instructions{font:13.5px/1.7 var(--font-ui);color:var(--text-2);white-space:pre-line}

@media(max-width:820px){.logo{font-size:1.5rem}.ing-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">recipes<span>::</span>hub</div><div class="tagline">Recetas de todo el mundo · TheMealDB</div></header>

<div class="shell">
  <div class="card">
    <div class="section-title">Buscar</div>
    <div class="filter-row">
      <input type="text" id="search" placeholder="Buscar receta por nombre…">
      <select id="cat-select"><option value="">Todas las categorías</option></select>
      <select id="area-select"><option value="">Todas las cocinas</option></select>
      <button class="btn icon" id="random-btn" title="Receta al azar">🎲</button>
    </div>
    <div class="chips" id="fav-chips"></div>
  </div>

  <div class="card">
    <div class="section-title" id="results-title">Recetas destacadas</div>
    <div class="grid" id="grid"><div class="loading">Cargando recetas…</div></div>
  </div>
</div>

<div id="overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <img id="modal-img" src="" alt="">
    <div id="modal-name"></div>
    <div id="modal-tags"></div>
    <div class="modal-actions">
      <button class="btn" id="fav-btn">☆ Guardar en favoritos</button>
      <button class="btn" id="translate-btn">🌐 Traducir al español</button>
      <a class="btn" id="video-link" target="_blank" rel="noopener" style="display:none;text-decoration:none">▶ Ver vídeo</a>
      <a class="btn" id="source-link" target="_blank" rel="noopener" style="display:none;text-decoration:none">🔗 Fuente original</a>
    </div>
    <div class="section-title">Ingredientes</div>
    <div class="ing-list" id="ing-list"></div>
    <div class="section-title">Preparación</div>
    <div class="instructions" id="instructions"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const API = 'https://www.themealdb.com/api/json/v1/1/';
const FKEY = 'recipeshub_favs';

/* ══════════════════════════════════════════════
   CARGA INICIAL — categorías, cocinas, destacadas
══════════════════════════════════════════════ */
async function init() {
  try {
    const [catsRes, areasRes] = await Promise.all([
      fetch(API + 'list.php?c=list').then(r => r.json()),
      fetch(API + 'list.php?a=list').then(r => r.json())
    ]);
    $('#cat-select').innerHTML += (catsRes.meals || []).map(c => `<option value="${c.strCategory}">${c.strCategory}</option>`).join('');
    $('#area-select').innerHTML += (areasRes.meals || []).map(a => `<option value="${a.strArea}">${a.strArea}</option>`).join('');
  } catch (e) {}
  loadFeatured();
  renderFavChips();
}
async function loadFeatured() {
  $('#results-title').textContent = 'Recetas destacadas';
  $('#grid').innerHTML = '<div class="loading">Cargando recetas…</div>';
  try {
    const picks = await Promise.all(Array.from({length:8}, () => fetch(API + 'random.php').then(r => r.json())));
    const meals = picks.map(p => p.meals && p.meals[0]).filter(Boolean);
    renderGrid(meals);
  } catch (e) {
    $('#grid').innerHTML = '<div class="error-msg">No se pudieron cargar recetas. Comprueba tu conexión.</div>';
  }
}

/* ══════════════════════════════════════════════
   BÚSQUEDA / FILTROS
══════════════════════════════════════════════ */
let searchTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  $('#cat-select').value = ''; $('#area-select').value = '';
  searchTimer = setTimeout(() => { q ? searchByName(q) : loadFeatured(); }, 400);
});
$('#cat-select').onchange = () => { $('#search').value=''; $('#area-select').value=''; filterBy('c', $('#cat-select').value); };
$('#area-select').onchange = () => { $('#search').value=''; $('#cat-select').value=''; filterBy('a', $('#area-select').value); };

async function searchByName(q) {
  $('#results-title').textContent = `Resultados para "${q}"`;
  $('#grid').innerHTML = '<div class="loading">Buscando…</div>';
  try {
    const data = await fetch(API + 'search.php?s=' + encodeURIComponent(q)).then(r => r.json());
    renderGrid(data.meals || []);
  } catch (e) { $('#grid').innerHTML = '<div class="error-msg">Error al buscar.</div>'; }
}
async function filterBy(kind, value) {
  if (!value) return loadFeatured();
  $('#results-title').textContent = kind === 'c' ? value : 'Cocina ' + value;
  $('#grid').innerHTML = '<div class="loading">Cargando…</div>';
  try {
    const data = await fetch(API + `filter.php?${kind}=` + encodeURIComponent(value)).then(r => r.json());
    renderGrid(data.meals || []);
  } catch (e) { $('#grid').innerHTML = '<div class="error-msg">Error al filtrar.</div>'; }
}
$('#random-btn').onclick = async () => {
  const data = await fetch(API + 'random.php').then(r => r.json());
  if (data.meals) openModal(data.meals[0]);
};

/* ══════════════════════════════════════════════
   RENDER GRID
══════════════════════════════════════════════ */
function renderGrid(meals) {
  const grid = $('#grid');
  if (!meals.length) { grid.innerHTML = '<div class="empty-msg">No se encontraron recetas</div>'; return; }
  grid.innerHTML = meals.map(m => `
    <div class="meal-card" data-id="${m.idMeal}">
      <img src="${m.strMealThumb}/preview" alt="${m.strMeal}" loading="lazy">
      <div class="mc-body"><div class="mc-name">${m.strMeal}</div><div class="mc-tags">${m.strCategory || ''}${m.strArea ? ' · ' + m.strArea : ''}</div></div>
    </div>`).join('');
  grid.querySelectorAll('.meal-card').forEach(el => el.onclick = () => loadDetail(el.dataset.id));
}

/* ══════════════════════════════════════════════
   DETALLE (MODAL)
══════════════════════════════════════════════ */
async function loadDetail(id) {
  try {
    const data = await fetch(API + 'lookup.php?i=' + id).then(r => r.json());
    if (data.meals) openModal(data.meals[0]);
  } catch (e) {}
}
function mealIngredients(m) {
  const ings = [];
  for (let i = 1; i <= 20; i++) {
    const ing = m['strIngredient' + i], meas = m['strMeasure' + i];
    if (ing && ing.trim()) ings.push({ ing: ing.trim(), meas: (meas || '').trim() });
  }
  return ings;
}
function renderModalContent(m, tr) {
  $('#modal-name').textContent = tr ? tr.name : m.strMeal;
  $('#instructions').textContent = tr ? tr.instructions : (m.strInstructions || 'Sin instrucciones disponibles.');
  const ings = tr ? tr.ings : mealIngredients(m);
  $('#ing-list').innerHTML = ings.map(x => `<div class="ing-row"><b>${x.ing}</b><span>${x.meas}</span></div>`).join('');
}
let currentMeal = null, translation = { translated: false, data: null };

function openModal(m) {
  currentMeal = m;
  translation = { translated: false, data: null };
  $('#modal-img').src = m.strMealThumb;
  $('#modal-tags').textContent = [m.strCategory, m.strArea, m.strTags].filter(Boolean).join(' · ');
  renderModalContent(m, null);

  const vid = $('#video-link'), src = $('#source-link');
  if (m.strYoutube) { vid.href = m.strYoutube; vid.style.display = 'inline-block'; } else vid.style.display = 'none';
  if (m.strSource) { src.href = m.strSource; src.style.display = 'inline-block'; } else src.style.display = 'none';

  updateFavBtn(m.idMeal);
  $('#fav-btn').onclick = () => toggleFav(m);
  $('#translate-btn').textContent = '🌐 Traducir al español';
  $('#translate-btn').disabled = false;
  $('#overlay').classList.add('show');
  $('#overlay').dataset.mealId = m.idMeal;
  $('#overlay').scrollTop = 0;
}
$('#modal-close').onclick = () => $('#overlay').classList.remove('show');
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') $('#overlay').classList.remove('show'); });

/* ══════════════════════════════════════════════
   TRADUCCIÓN (Google Translate, sin clave)
══════════════════════════════════════════════ */
async function translateText(text) {
  if (!text || !text.trim()) return '';
  const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(text)}`);
  const data = await res.json();
  return data[0].map(seg => seg[0]).join('');
}
$('#translate-btn').onclick = async () => {
  if (!currentMeal) return;
  const btn = $('#translate-btn');
  if (translation.translated) {
    renderModalContent(currentMeal, null);
    translation.translated = false;
    btn.textContent = '🌐 Traducir al español';
    return;
  }
  if (translation.data) {
    renderModalContent(currentMeal, translation.data);
    translation.translated = true;
    btn.textContent = '↩ Ver original (inglés)';
    return;
  }
  btn.textContent = 'Traduciendo…'; btn.disabled = true;
  try {
    const ings = mealIngredients(currentMeal);
    const [name, instructions, ...ingNames] = await Promise.all([
      translateText(currentMeal.strMeal),
      translateText(currentMeal.strInstructions),
      ...ings.map(x => translateText(x.ing))
    ]);
    const data = { name, instructions, ings: ings.map((x,i) => ({ ing: ingNames[i] || x.ing, meas: x.meas })) };
    translation.data = data;
    translation.translated = true;
    renderModalContent(currentMeal, data);
    btn.textContent = '↩ Ver original (inglés)';
  } catch (e) {
    alert('No se pudo traducir. Comprueba tu conexión e inténtalo de nuevo.');
    btn.textContent = '🌐 Traducir al español';
  }
  btn.disabled = false;
};

/* ══════════════════════════════════════════════
   FAVORITOS (localStorage)
══════════════════════════════════════════════ */
function loadFavs() { try { return JSON.parse(localStorage.getItem(FKEY)) || []; } catch(e) { return []; } }
function isFav(id) { return loadFavs().some(f => f.id === id); }
function toggleFav(m) {
  let favs = loadFavs();
  if (isFav(m.idMeal)) favs = favs.filter(f => f.id !== m.idMeal);
  else favs.unshift({ id: m.idMeal, name: m.strMeal, thumb: m.strMealThumb });
  try { localStorage.setItem(FKEY, JSON.stringify(favs.slice(0,16))); } catch(e) {}
  updateFavBtn(m.idMeal);
  renderFavChips();
}
function updateFavBtn(id) {
  $('#fav-btn').textContent = isFav(id) ? '★ En favoritos' : '☆ Guardar en favoritos';
  $('#fav-btn').classList.toggle('go', isFav(id));
}
function renderFavChips() {
  const favs = loadFavs();
  $('#fav-chips').innerHTML = favs.length ? favs.map(f =>
    `<div class="chip" data-id="${f.id}">${f.name}<span class="x" data-remove="${f.id}">✕</span></div>`).join('') : '';
  $('#fav-chips').querySelectorAll('.chip').forEach(el => el.onclick = e => {
    if (e.target.dataset.remove) { e.stopPropagation(); removeFav(e.target.dataset.remove); return; }
    loadDetail(el.dataset.id);
  });
}
function removeFav(id) {
  const favs = loadFavs().filter(f => f.id !== id);
  try { localStorage.setItem(FKEY, JSON.stringify(favs)); } catch(e) {}
  renderFavChips();
}

init();
</script>
</body>
</html>
