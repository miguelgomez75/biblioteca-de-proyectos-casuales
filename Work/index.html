<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>panel::hub — Formato · Lector · Progreso</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--surface:#13131a;--surface-2:#1c1c26;--border:#25253a;--border-2:#40405a;--text:#e2e2f0;--text-2:#8080a0;--text-3:#454560;--accent:#e8a030;--accent-dim:#271d08;--good:#7cc98a;--good-dim:#132a17;--bad:#f87171;--bad-dim:#2a1212;--font-ui:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;--radius:10px;--radius-lg:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100dvh;padding:2rem 1rem 3rem}
.logo{font:600 1.9rem var(--font-mono);letter-spacing:-.03em;text-align:center}.logo span{color:var(--accent)}
.tagline{font-size:12.5px;color:var(--text-3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
header{margin-bottom:1.6rem}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"progress reader" "format reader";gap:1rem;align-items:start}
#panel-format{grid-area:format;min-width:0}
#panel-progress{grid-area:progress;min-width:0}
#panel-reader{grid-area:reader;min-width:0}
@media(max-width:900px){.shell{grid-template-columns:1fr;grid-template-areas:"progress" "format" "reader"}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.3rem}
.section-title{font:11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:.9rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
label{font:11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:5px}
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:13px var(--font-mono);padding:9px 11px;outline:none;width:100%}
select:focus,input:focus{border-color:var(--accent)}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:9px 14px;font:500 13px var(--font-ui);cursor:pointer;transition:border-color .15s,transform .08s;white-space:nowrap}
.btn:hover{border-color:var(--border-2)}.btn:active{transform:scale(.97)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn.sm{padding:6px 11px;font-size:12px}
.hint{font:11.5px/1.55 var(--font-mono);color:var(--text-3);margin-top:.7rem}
.field{margin-bottom:.9rem}
.field:last-child{margin-bottom:0}

/* ── formateador ── */
#fmt-controls{display:flex;flex-wrap:wrap;gap:.7rem}
#fmt-controls .field{flex:1 1 130px;margin-bottom:0}
.fmt-out{display:flex;align-items:center;gap:8px;margin-top:.9rem;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.fmt-out code{flex:1;min-width:0;font:14px var(--font-mono);color:var(--accent);overflow-x:auto;white-space:pre}
.fmt-out.empty code{color:var(--text-3)}

/* ── lector de documentos (.docx) ── */
.docx-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.8rem}
.docx-tab{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:20px;padding:6px 8px 6px 13px;font:12px var(--font-ui);cursor:pointer;max-width:220px}
.docx-tab span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docx-tab.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}
.docx-tab .x{color:var(--text-3);font-size:13px;padding:0 2px;flex-shrink:0}
.docx-tab .x:hover{color:var(--bad)}
.docx-viewport{max-height:700px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.6rem}
.docx-loading,.docx-error,.docx-empty{font:13px var(--font-ui);padding:1rem;color:var(--text-2);text-align:center}
.docx-error{color:var(--bad)}
/* docx-preview ya trae sus propios estilos (fuentes, colores, tamaño de página…),
   que son justamente los que hacen que el documento se vea "tal cual". Aquí solo
   le damos una sombra para que cada página se note como una hoja de verdad.
   El "zoom" reduce el tamaño de la página renderizada (y el espacio que ocupa,
   a diferencia de transform:scale) para que quepa mejor y deje menos margen
   alrededor; súbelo hacia 1 si lo prefieres a tamaño real. */
.docx-body-slot{display:flex;flex-direction:column;align-items:center}
.docx-body-slot .docx-wrapper{background:transparent;zoom:.72}
.docx-body-slot .docx{box-shadow:0 4px 18px rgba(0,0,0,.35)!important;margin:0 auto 1rem!important}

/* ── progreso ── */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.9rem;align-items:center}
.cat-tabs button{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:20px;padding:6px 13px;font:12px var(--font-ui);cursor:pointer}
.cat-tabs button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}
.cat-tabs button.add{border-style:dashed;color:var(--text-3)}
.cat-actions{display:flex;gap:6px;margin-bottom:.9rem}
.cat-bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-bottom:.4rem}
.cat-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.cat-count{font:12px var(--font-mono);color:var(--text-2);margin-bottom:.9rem}
.item-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.item-row{display:flex;align-items:center;gap:9px;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px}
.item-row.sel{border-color:var(--accent)}
.item-row.done .pos{color:var(--good)}
.item-row .pos{font:11px var(--font-mono);color:var(--text-3);width:28px;flex-shrink:0}
.item-row input.ans{width:auto;flex:1}
.prev-info{margin-top:.9rem;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font:12.5px/1.5 var(--font-ui);display:none}
.prev-info b{color:var(--accent)}
.empty-hint{font:12.5px var(--font-ui);color:var(--text-3);padding:.8rem 0;text-align:center}
.item-row{cursor:pointer}
.qtag{font:10px var(--font-mono);color:var(--text-2);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;flex-shrink:0;letter-spacing:.03em;min-width:26px;text-align:center}
.qtag.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-dim)}
.qtag.warn{color:var(--accent);border-color:var(--accent)}
.q-summary{font:11.5px/1.5 var(--font-mono);color:var(--text-3);margin:-.4rem 0 .9rem}
.q-summary b{color:var(--bad);font-weight:500}
.q-panel{margin-top:.9rem;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:none}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:.7rem;font:12.5px var(--font-ui)}
.q-head b{color:var(--accent)}
.q-head .q-btns{display:flex;gap:6px;flex-wrap:wrap}
.q-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.btn:disabled{opacity:.4;cursor:default}
.q-fields{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.q-field{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:7px 10px}
.q-field.copied{border-color:var(--good)}
.q-field .body{flex:1;min-width:0}
.q-field .lbl{font:11px var(--font-mono);color:var(--text-2);margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.q-field.copied .lbl{color:var(--good)}
.q-field .chip{font:10px var(--font-mono);border-radius:4px;padding:0 5px;border:1px solid}
.q-field .chip.ok{color:var(--good);border-color:var(--good);background:var(--good-dim)}
.q-field .chip.ko{color:var(--bad);border-color:var(--bad);background:var(--bad-dim)}
.q-field .txt{font:12.5px/1.5 var(--font-ui);white-space:pre-wrap;word-break:break-word;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.q-field .txt.open{display:block;max-height:220px;overflow-y:auto}
.q-field .txt.empty{color:var(--text-3);font-style:italic;cursor:default}
.q-field .btn{flex-shrink:0}
.q-alert{font:12.5px/1.5 var(--font-ui);padding:8px 10px;border-radius:8px;margin-bottom:6px}
.q-alert.bad{background:var(--bad-dim);border:1px solid var(--bad);color:var(--bad)}
.q-alert.warn{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
.q-alert.info{background:var(--surface-2);border:1px solid var(--border-2);color:var(--text-2)}
.qtag.blk{color:var(--text);border-color:var(--text-3);background:var(--surface-2);cursor:help}
.q-blocks{margin:-.4rem 0 .9rem;font:12px/1.5 var(--font-ui);color:var(--text-2)}
.q-blocks summary{cursor:pointer;font:11.5px var(--font-mono);color:var(--text-2)}
.q-blocks .blk{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding:6px 9px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.q-blocks .blk .t{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.q-blocks .blk .t b{color:var(--accent);font:500 11px var(--font-mono);display:block;margin-bottom:2px}
/* el lector acompaña al scroll: así el documento sigue a la vista mientras copias campos */
@media(min-width:901px){
  #panel-reader{position:sticky;top:1rem;max-height:calc(100dvh - 2rem);display:flex;flex-direction:column}
  #panel-reader .docx-viewport{flex:1;min-height:0;max-height:none}
}


</style>
<!-- bc-theme --><script src="../theme.js"></script>
</head>
<body>
<header>
  <div class="logo">panel<span>::</span>hub</div>
  <div class="tagline">Formato · Lector de documentos · Progreso</div>
</header>


<div class="shell">

  <!-- ═══════════════════════════════════════════════════════════
       MÓDULO 1 · FORMATEADOR
       Los controles se generan solos a partir de FORMAT_PARTS
       (ver <script>, al principio). No hace falta tocar este HTML
       para añadir/quitar piezas del código.
  ═══════════════════════════════════════════════════════════ -->
  <div id="panel-format" class="card">
    <div class="section-title">Formateador</div>
    <div id="fmt-controls"></div>
    <div class="fmt-out" id="fmt-out"><code id="fmt-code"></code>
      <button class="btn sm" id="fmt-copy">Copiar</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       MÓDULO 3 · PROGRESO
       Hasta 5 formularios; el nº de preguntas de cada uno se edita
       aquí mismo, no hace falta tocar el código para eso.
  ═══════════════════════════════════════════════════════════ -->
  <div id="panel-progress" class="card">
    <div class="section-title">Progreso<button class="btn sm" id="sync-docx">Usar documentos abiertos</button></div>
    <div class="cat-tabs" id="cat-tabs"></div>
    <div class="cat-actions" id="cat-actions"></div>
    <div class="field" id="cat-count-field">
      <label for="cat-count-input">Nº de preguntas de este formulario</label>
      <input type="number" id="cat-count-input" min="0" max="500">
    </div>
    <div class="cat-bar"><i id="cat-bar-fill"></i></div>
    <div class="cat-count" id="cat-count"></div>
    <div class="q-summary" id="q-summary"></div>
    <div class="q-blocks" id="q-blocks"></div>
    <div class="item-list" id="item-list"></div>
    <div class="prev-info" id="prev-info"></div>
    <div class="q-panel" id="q-panel"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       MÓDULO 2 · LECTOR DE DOCUMENTOS (.docx)
       Muestra Word tal cual (títulos, colores, tablas…) con la
       librería docx-preview. Varios documentos a la vez, por
       pestañas. Nada se sube a ningún sitio: todo ocurre en tu
       navegador.
  ═══════════════════════════════════════════════════════════ -->
  <div id="panel-reader" class="card">
    <div class="section-title">Lector de documentos<button class="btn sm" id="docx-open">Abrir .docx</button></div>
    <input type="file" id="docx-file" accept=".docx" multiple hidden>
    <div class="docx-tabs" id="docx-tabs"></div>
    <div class="docx-viewport" id="docx-viewport">
      <div class="docx-empty" id="docx-empty">Abre uno o varios archivos .docx para verlos aquí, tal y como están en Word.</div>
    </div>
  </div>

</div>
</div>


<!-- docx-preview necesita jszip cargado antes que él. Si algún día quieres
     otra versión, cambia el número en la URL (@x.y.z) de las dos líneas. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js"></script>
<!-- bc-theme --><script src="../theme.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch (e2) {} ta.remove();
  }
}

/* ════════════════════════════════════════════════════════════════
   MÓDULO 1 · FORMATEADOR — CONFIGURACIÓN
   ════════════════════════════════════════════════════════════════
   FORMAT_PARTS es una lista ORDENADA de piezas; el resultado final
   es la concatenación de todas, en el orden en que las escribas
   aquí. Tipos de pieza disponibles:

     { type: 'text', value: '...' }
         Texto fijo, igual siempre. No aparece ningún control para
         él en la interfaz, solo se ve en el resultado final.

     { type: 'input', id: '...', label: '...', prefix: '', numeric: false, default: '', uppercase: false }
         Campo de texto libre que escribe el usuario. "prefix" (si
         lo pones) se añade delante SIN que el usuario lo escriba
         (por ejemplo prefix:'X' para que al escribir "1" salga
         "X1"). "numeric: true" lo convierte en un campo numérico.
         "default" es el valor con el que empieza ya relleno.
         "uppercase: true" fuerza MAYÚSCULAS mientras se escribe.

     { type: 'category', id: '...', label: '...', options: [
         { label: 'Lo que ve el usuario', code: 'lo que se inserta' }, ...
       ] }
         Desplegable. "label" es lo que se ve; "code" es lo que se
         concatena cuando esa opción está elegida.

     { type: 'number', id: '...', label: '...', digits: 3, prefix: '' }
         Número que escribe el usuario, con ceros a la izquierda
         hasta "digits" cifras (3 = formato 00x, de 001 a 999).

   Configuración actual = tu ejemplo exacto:
   código de asignatura (texto libre) + "-" + idioma + "-" +
   "X" + nº de modificación (empieza en 1) + "-" + tipo de
   cuestionario + "-" + número 00x
   →  por ejemplo: DF001-ENG-X1-E0-001
   ════════════════════════════════════════════════════════════════ */
const FORMAT_PARTS = [
  { type: 'input', id: 'subject', label: 'Código de asignatura', placeholder: 'p.ej. DF001', uppercase: true },
  { type: 'text', value: '-' },
  {
    type: 'category', id: 'lang', label: 'Idioma',
    options: [
      { label: 'Inglés', code: 'ENG' },
      { label: 'Español', code: 'ESP' },
      { label: 'Portugués', code: 'POR' },
      { label: 'Francés', code: 'FRA' }
      // añade aquí más idiomas si los necesitas: { label: '...', code: '...' }
    ]
  },
  { type: 'text', value: '-' },
  { type: 'input', id: 'rev', label: 'Nº de modificación', prefix: 'X', numeric: true, default: '1' },
  { type: 'text', value: '-' },
  {
    type: 'category', id: 'tipo', label: 'Tipo de cuestionario',
    options: [
      { label: 'Auto', code: 'Auto' },
      { label: 'Reflex', code: 'Reflex' },
      { label: 'E0', code: 'E0' },
      { label: 'R1', code: 'R1' },
      { label: 'R2', code: 'R2' }
    ]
  },
  { type: 'text', value: '-' },
  { type: 'number', id: 'num', label: 'Número de pregunta', digits: 3 }
];

const fmtState = {}; // { [id]: valor actual de cada pieza con control }

function buildFormatControls() {
  const box = $('#fmt-controls');
  box.innerHTML = '';

  FORMAT_PARTS.forEach(part => {
    if (part.type === 'text') return; // separador fijo: no ocupa sitio en la interfaz, solo en el resultado
    const field = document.createElement('div');
    field.className = 'field';
    const lbl = document.createElement('label');
    lbl.textContent = part.label || part.id;
    field.appendChild(lbl);

    if (part.type === 'category') {
      const sel = document.createElement('select');
      sel.innerHTML = part.options.map((o, i) => '<option value="' + i + '">' + esc(o.label) + '</option>').join('');
      sel.addEventListener('change', () => { fmtState[part.id] = part.options[+sel.value].code; updateFormatOutput(); });
      fmtState[part.id] = part.options[0] ? part.options[0].code : '';
      field.appendChild(sel);
    } else if (part.type === 'input') {
      const inp = document.createElement('input');
      inp.type = part.numeric ? 'number' : 'text';
      if (part.numeric) inp.min = '1';
      if (part.placeholder) inp.placeholder = part.placeholder;
      inp.value = part.default || '';
      fmtState[part.id] = part.default || '';
      if (part.uppercase) inp.style.textTransform = 'uppercase';
      inp.addEventListener('input', () => {
        if (part.uppercase) { const a = inp.selectionStart, b = inp.selectionEnd; inp.value = inp.value.toUpperCase(); try { inp.setSelectionRange(a, b); } catch (e) {} }
        fmtState[part.id] = inp.value; updateFormatOutput();
      });
      field.appendChild(inp);
    } else if (part.type === 'number') {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = '0'; inp.max = String(Math.pow(10, part.digits) - 1);
      inp.placeholder = '0'.repeat(part.digits);
      inp.addEventListener('input', () => { fmtState[part.id] = inp.value; updateFormatOutput(); });
      fmtState[part.id] = '';
      field.appendChild(inp);
    }
    box.appendChild(field);
  });
}

function updateFormatOutput() {
  let out = '', missing = false;
  FORMAT_PARTS.forEach(part => {
    if (part.type === 'text') { out += part.value; return; }
    if (part.type === 'category') { out += fmtState[part.id] || ''; return; }
    if (part.type === 'input') {
      const v = fmtState[part.id];
      if (!v) { missing = true; return; }
      out += (part.prefix || '') + v;
      return;
    }
    if (part.type === 'number') {
      const raw = fmtState[part.id];
      if (raw === '' || raw === undefined) { missing = true; return; }
      const n = Math.max(0, parseInt(raw, 10) || 0);
      out += (part.prefix || '') + String(n).padStart(part.digits, '0');
    }
  });
  const box = $('#fmt-out'), code = $('#fmt-code');
  code.textContent = missing ? 'Rellena los campos para completar el código' : out;
  box.classList.toggle('empty', missing);
}

$('#fmt-copy').addEventListener('click', async () => {
  if ($('#fmt-out').classList.contains('empty')) return;
  await copyText($('#fmt-code').textContent);
  const btn = $('#fmt-copy'); const old = btn.textContent;
  btn.textContent = 'Copiado ✓'; setTimeout(() => { btn.textContent = old; }, 1200);
});

/* ════════════════════════════════════════════════════════════════
   MÓDULO 2 · LECTOR DE DOCUMENTOS (.docx)
   ════════════════════════════════════════════════════════════════
   Cada archivo que abres se renderiza UNA sola vez (con la librería
   docx-preview) y se guarda en el DOM, oculto; cambiar de pestaña
   solo alterna qué documento se muestra, es instantáneo.
   ════════════════════════════════════════════════════════════════ */
let docxTabs = [];        // [{ id, name, wrapEl, status: 'loading'|'ok'|'error' }]
let activeDocxTab = null;
let docxUid = 1;
const docsParsed = {};    // { [nombre del documento]: resultado de parseDocxQuestions }

function renderDocxTabs() {
  const bar = $('#docx-tabs');
  bar.innerHTML = docxTabs.map(t =>
    '<button class="docx-tab' + (t.id === activeDocxTab ? ' on' : '') + '" data-id="' + t.id + '">' +
      '<span class="name">' + esc(t.name) + '</span><span class="x" data-close="' + t.id + '">×</span></button>'
  ).join('');
  bar.querySelectorAll('.docx-tab').forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return;
    setActiveDocxTab(b.dataset.id);
  }));
  bar.querySelectorAll('[data-close]').forEach(x => x.addEventListener('click', e => {
    e.stopPropagation(); closeDocxTab(x.dataset.close);
  }));
}

function setActiveDocxTab(id) {
  activeDocxTab = id;
  docxTabs.forEach(t => { t.wrapEl.style.display = (t.id === id) ? '' : 'none'; });
  $('#docx-empty').style.display = docxTabs.length ? 'none' : 'block';
  renderDocxTabs();
}

function closeDocxTab(id) {
  const t = docxTabs.find(x => x.id === id);
  if (!t) return;
  t.wrapEl.remove();
  docxTabs = docxTabs.filter(x => x.id !== id);
  if (activeDocxTab === id) activeDocxTab = docxTabs.length ? docxTabs[docxTabs.length - 1].id : null;
  if (activeDocxTab) setActiveDocxTab(activeDocxTab);
  else { $('#docx-empty').style.display = 'block'; renderDocxTabs(); }
}

async function openDocxFile(file) {
  const id = 'd' + (docxUid++);
  const wrapEl = document.createElement('div');
  wrapEl.style.display = 'none';
  const styleEl = document.createElement('div'); styleEl.className = 'docx-style-slot';
  const bodyEl = document.createElement('div'); bodyEl.className = 'docx-body-slot';
  wrapEl.appendChild(styleEl); wrapEl.appendChild(bodyEl);
  $('#docx-viewport').appendChild(wrapEl);

  const tab = { id, name: file.name.replace(/\.docx$/i, ''), wrapEl, status: 'loading' };
  docxTabs.push(tab);
  setActiveDocxTab(id);

  bodyEl.innerHTML = '<div class="docx-loading">Cargando ' + esc(file.name) + '…</div>';
  try {
    const buf = await file.arrayBuffer();
    // 1) análisis de preguntas (independiente del visor: si uno falla, el otro sigue)
    try {
      tab.parsed = await parseDocxQuestions(buf.slice(0));
      tab.parsed.selfEval = /test|tarea/i.test(file.name);   // autoevaluación: todas las preguntas valen 0
      tab.parsed.rec02 = /rec02/i.test(file.name);            // recuperación 2: nota final 8,5
      tab.parsed.recEx = /rec01/i.test(file.name) || /(?<![A-Za-z])ex(?![a-z])/i.test(file.name);   // Rec01 / Ex: por defecto 20 aleatorias
      docsParsed[tab.name] = tab.parsed;
      if (typeof onDocParsed === 'function') onDocParsed(tab.name);
    } catch (pe) { tab.parseError = pe && pe.message || String(pe); delete docsParsed[tab.name]; }
    // 2) visor
    if (typeof docx === 'undefined') throw new Error('No se pudo cargar la librería docx-preview (revisa tu conexión a internet).');
    await docx.renderAsync(buf, bodyEl, styleEl, { inWrapper: true, ignoreLastRenderedPageBreak: true });
    tab.status = 'ok';
  } catch (err) {
    tab.status = 'error';
    bodyEl.innerHTML = '<div class="docx-error">No se pudo abrir «' + esc(file.name) + '»: ' + esc(err && err.message || String(err)) + '</div>';
  }
}

$('#docx-open').addEventListener('click', () => $('#docx-file').click());
$('#docx-file').addEventListener('change', e => {
  [...e.target.files].forEach(openDocxFile);
  e.target.value = '';
});

/* ════════════════════════════════════════════════════════════════
   MÓDULO 2B · ANÁLISIS DE PREGUNTAS (.docx → campos a rellenar)
   ════════════════════════════════════════════════════════════════
   Se lee el XML del propio .docx (no el HTML que pinta el visor), así
   la numeración de preguntas/opciones sale tal cual la calcula Word.

   Una pregunta sin opciones, sin tabla y sin guía de respuesta se trata como
   ENSAYO sin retroalimentación (solo el campo Enunciado).
   Tipos reconocidos (ver "Aspectos de interés"):
     · Opción múltiple  → lista de letras, cada opción con CORRETA./INCORRETA.
     · Verdadero o falso → como la anterior, pero 2 opciones (Verdadero/Falso)
     · Combinatoria     → tabla: 1ª col. apartado, 2ª col. pareja
     · Ensayo           → "Guía de respuesta" + texto

   Una pregunta se marca como NO TRATABLE (errors[]) cuando algo raro
   indica que no se puede leer fiablemente: salto en la numeración de
   preguntas, salto en las letras, opción sin CORRETA/INCORRETA, menos de
   2 opciones, enunciado vacío o estructura no reconocida. Los avisos
   (warns[]) no la bloquean: opción vacía, texto flotante ignorado…
   ════════════════════════════════════════════════════════════════ */
const QCFG = {
  optionFeedbackJoin: ' ',      // cómo unir una retroalimentación de opción repartida en varios párrafos
  imageText: '<<Aquí hay una imagen>>',
  chartText: '<<Aquí hay un gráfico>>'
};
const QTYPES = {
  mc: { label: 'Opción múltiple', short: 'OM' },
  tf: { label: 'Verdadero o falso', short: 'VF' },
  comb: { label: 'Combinatoria', short: 'CO' },
  essay: { label: 'Ensayo', short: 'EN' },
  bad: { label: 'Tipo no reconocido', short: '?' },
  missing: { label: 'Pregunta ausente', short: '?' }
};
const WNS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
// Español / portugués / inglés / francés
const RX_GUIDE = /^\s*(gu[ií]a|guide)\s+(de\s+|d['’]\s*)?(respuesta|resposta|r[eé]ponse|response|answer)s?\s*:?\s*$|^\s*(answer|response)\s+(guide|key)\s*:?\s*$/i;
const RX_MARK = /^\s*(IN)?CORR(?:ETA|ECTA|ECT|ECTE|ETO|ECTO)\b\s*[.:;!\-–—]*\s*/i;
const RX_MARK_INLINE = /(?:^|[\s.!?)\]»"”])((?:IN)?CORR(?:ETA|ECTA|ECT|ECTE|ETO|ECTO)\b)/;
// Encabezado de bloque («Bloque 1: …», «Bloco 1. …», «Block 1 – …», «Bloc 1 : …», «Bloco Comum. …»): instrucciones para montar el cuestionario, no son parte de ninguna pregunta
const RX_BLOCK = /^\s*(?:bloque|bloco|block|bloc)\s*(?:\d+\s*[.:\-–—)]|(?:comum|com[uú]n|common|commun)\b)/i;
// Puntuación al final del enunciado: «(0,75 pontos)», «(1 punto)», «(0.5 points)»…
// Comentarios de puntuación entre paréntesis dentro del enunciado: «(0,75 pontos)», «(1 punto)»,
// «(Cada item vale 0,05)», «(cada acierto vale 0,5 puntos)»…  Deben llevar un número y una palabra de puntuación.
const RX_PAREN = /\(\s*([^()]*\d[^()]*?)\s*\)/g;
const RX_SCORE_ANY = /\b(vale|valem|valen|valor|valeur|vaut|worth|value|pontos?|puntos?|points?|pts?|punts?|cada)\b/i;
const RX_SCORE_STRONG = /\b(vale|valem|valen|valor|worth|pontos?|puntos?|points?)\b/i;
const RX_TRUE = /\b(verdadero|verdadeiro|verdadera|verdadeira|true|vrai)\b/i;
const RX_FALSE = /\b(falso|falsa|false|faux|fausse)\b/i;

const qEl = (n, name) => { if (!n) return null; for (const c of n.children) if (c.localName === name) return c; return null; };
const qAttr = (n, name) => n ? (n.getAttributeNS(WNS, name) || n.getAttribute('w:' + name)) : null;
const letterOf = v => { let s = ''; while (v > 0) { v--; s = String.fromCharCode(97 + v % 26) + s; v = Math.floor(v / 26); } return s; };
const qClean = s => s.replace(/[​‌‍⁠﻿­]/g, '').replace(/[   ]/g, ' ')
  .split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('\n').replace(/\n{2,}/g, '\n').trim();

function parseNumbering(xml, toDom) {
  const res = { abs: {}, num: {} };
  if (!xml) return res;
  const d = toDom(xml);
  for (const a of d.getElementsByTagNameNS(WNS, 'abstractNum')) {
    const lv = {};
    for (const l of a.children) if (l.localName === 'lvl') {
      const st = qAttr(qEl(l, 'start'), 'val');
      lv[+qAttr(l, 'ilvl')] = { fmt: qAttr(qEl(l, 'numFmt'), 'val') || 'decimal', start: st === null || st === '' ? 1 : +st };
    }
    res.abs[qAttr(a, 'abstractNumId')] = lv;
  }
  for (const n of d.getElementsByTagNameNS(WNS, 'num')) {
    const ov = {};
    for (const o of n.children) if (o.localName === 'lvlOverride') {
      const s = qEl(o, 'startOverride'); if (s) ov[+qAttr(o, 'ilvl')] = +qAttr(s, 'val');
    }
    res.num[qAttr(n, 'numId')] = { abs: qAttr(qEl(n, 'abstractNumId'), 'val'), overrides: ov };
  }
  return res;
}

function parseStyleNums(xml, toDom) {
  const map = {};
  if (!xml) return map;
  const d = toDom(xml), raw = {};
  for (const s of d.getElementsByTagNameNS(WNS, 'style')) {
    const np = qEl(qEl(s, 'pPr'), 'numPr');
    raw[qAttr(s, 'styleId')] = {
      based: qAttr(qEl(s, 'basedOn'), 'val'),
      numId: np ? qAttr(qEl(np, 'numId'), 'val') : null,
      ilvl: np ? qAttr(qEl(np, 'ilvl'), 'val') : null
    };
  }
  for (const id in raw) {
    let cur = raw[id], g = 0;
    while (cur && cur.numId == null && cur.based && g++ < 10) cur = raw[cur.based];
    if (cur && cur.numId != null) map[id] = { numId: cur.numId, ilvl: cur.ilvl };
  }
  return map;
}

function drawingKind(d) {
  const has = n => d.getElementsByTagNameNS('*', n).length > 0;
  if (has('txbxContent')) return 'text';
  if (has('blip') || has('imagedata')) return 'image';
  if (has('chart')) return 'chart';
  return 'other';
}

/* Texto de un párrafo. Las imágenes se sustituyen por un marcador; el texto
   de cuadros de texto flotantes (p.ej. "© TODOS OS DIREITOS…") se descarta y
   se devuelve aparte; mc:Fallback se salta para no leer el contenido duplicado. */
function readPara(p) {
  const floating = []; let out = '';
  (function walk(n) {
    for (const c of n.childNodes) {
      if (c.nodeType !== 1) continue;
      switch (c.localName) {
        case 'pPr': case 'rPr': case 'Fallback': case 'del': case 'moveFrom': break;
        case 't': out += c.textContent; break;
        case 'tab': out += ' '; break;
        case 'br': case 'cr': out += '\n'; break;
        case 'noBreakHyphen': out += '-'; break;
        case 'drawing': case 'pict': case 'object': {
          const k = drawingKind(c);
          if (k === 'image') out += ' ' + QCFG.imageText + ' ';
          else if (k === 'chart') out += ' ' + QCFG.chartText + ' ';
          else if (k === 'text') floating.push([...c.getElementsByTagNameNS(WNS, 't')].map(t => t.textContent).join(''));
          break;
        }
        default: walk(c);
      }
    }
  })(p);
  return { text: qClean(out), floating };
}

function tableRows(tbl) {
  const rows = [];
  for (const tr of tbl.children) {
    if (tr.localName !== 'tr') continue;
    const cells = [];
    for (const tc of tr.children) {
      if (tc.localName !== 'tc') continue;
      const parts = [];
      for (const p of tc.children) if (p.localName === 'p') { const t = readPara(p).text; if (t) parts.push(t); }
      cells.push(parts.join('\n'));
    }
    rows.push(cells);
  }
  return rows;
}

function bodyBlocks(node, out) {
  for (const c of node.children) {
    if (c.namespaceURI !== WNS) continue;
    if (c.localName === 'p' || c.localName === 'tbl') out.push(c);
    else if (c.localName === 'sdt') bodyBlocks(qEl(c, 'sdtContent') || c, out);
  }
}

const isGuideTitle = it => it.kind === 'p' && (RX_GUIDE.test(it.text) || /respuesta-titulo|resposta-titulo/i.test(it.style || ''));
const isOptionItem = it => it.kind === 'p' && it.np && /Letter$/.test(it.np.fmt);

/* Une bloques (párrafos y tablas) en texto plano; las tablas salen como filas con tabuladores. */
function blocksToText(items, join) {
  const parts = [];
  for (const it of items) {
    if (it.kind === 'tbl') {
      const t = it.rows.filter(r => r.some(Boolean)).map(r => r.join('\t')).join('\n');
      if (t) parts.push(t);
    } else if (it.text) parts.push((it.label ? it.label + ' ' : '') + it.text);
  }
  return parts.join(join === undefined ? '\n' : join);
}

function buildQuestion(cur, n) {
  const q = { n, type: 'bad', errors: [], warns: [], fields: [] };
  const its = cur.items;
  const guideAt = its.findIndex(isGuideTitle);
  const optAt = its.findIndex(isOptionItem);
  const tblAt = its.findIndex(i => i.kind === 'tbl');

  const floats = [...cur.first.floating];
  its.forEach(i => { if (i.floating) floats.push(...i.floating); });
  [...new Set(floats.map(f => qClean(f)).filter(Boolean))].forEach(f =>
    q.warns.push('Texto flotante ignorado: «' + (f.length > 45 ? f.slice(0, 45) + '…' : f) + '»'));

  // enunciado; si termina en «(0,75 pontos)» esa puntuación se saca a q.points (info aparte, como los bloques)
  const stemOf = upto => {
    const r = blocksToText([{ kind: 'p', text: cur.first.text }, ...its.slice(0, upto)]);
    // se quitan del enunciado y se guardan en q.points (info aparte, como los bloques):
    //  · el paréntesis del final (cualquier palabra de puntuación), o
    //  · uno en medio del texto (solo con palabras claras: vale / valor / pontos / puntos / points)
    const found = [];
    let out = r.replace(RX_PAREN, (all, inner, off) => {
      const atEnd = /^[\s.]*$/.test(r.slice(off + all.length));
      if (!(atEnd ? RX_SCORE_ANY.test(inner) : RX_SCORE_STRONG.test(inner))) return all;
      found.push(inner.trim());
      return '';
    });
    if (!found.length) return r;
    q.points = found.join(' · ');
    return out.replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+([.,;:?!])/g, '$1').replace(/[ \t]+\n/g, '\n').trim();
  };

  if (guideAt >= 0) {                                   // ── ENSAYO
    q.type = 'essay';
    const stem = stemOf(guideAt);
    const fb = blocksToText(its.slice(guideAt + 1));
    if (!stem) q.errors.push('El enunciado está vacío.');
    if (!fb) q.warns.push('La guía de respuesta está vacía.');
    q.fields = [{ label: 'Enunciado', text: stem }, { label: 'Retroalimentación', text: fb }];
  } else if (optAt >= 0) {                              // ── OPCIÓN MÚLTIPLE / VERDADERO O FALSO
    if (tblAt >= 0 && tblAt < optAt) q.errors.push('Hay una tabla antes de las opciones: estructura mezclada.');
    const stem = stemOf(optAt);
    if (!stem) q.errors.push('El enunciado está vacío.');
    const opts = [];
    for (const it of its.slice(optAt)) {
      if (isOptionItem(it)) opts.push({ value: it.np.value, title: it.text, fb: [] });
      else if (it.kind === 'tbl' || it.text) opts[opts.length - 1].fb.push(it);
    }
    if (opts.length < 2) q.errors.push('Solo hay ' + opts.length + ' opción(es); se esperan al menos 2.');
    opts.forEach((o, i) => {
      if (o.value !== i + 1) q.errors.push('Salto en las letras de las opciones: en la posición ' + (i + 1) + ' aparece «' + letterOf(o.value) + ')» y se esperaba «' + letterOf(i + 1) + ')».');
    });
    opts.forEach((o, i) => {
      const L = letterOf(i + 1) + ')';
      // El texto de la opción puede ocupar varios párrafos y la marca CORRETA./INCORRETA. puede ir al
      // final de uno de ellos. Se busca la PRIMERA marca entre la opción y la siguiente: lo anterior es
      // el título y desde la marca hasta la siguiente opción es la retroalimentación (tal cual).
      // Marca válida: en MAYÚSCULAS en cualquier punto, o (en cualquier caso) al inicio de un párrafo
      // posterior o de una línea. Si no hay marca, título = la opción y retroalimentación = lo demás.
      const pieces = [o.title, ...o.fb.map(it => blocksToText([it]))];
      let hit = -1, cut = 0;
      for (let k = 0; k < pieces.length && hit < 0; k++) {
        const p = pieces[k], m1 = RX_MARK_INLINE.exec(p);
        if (m1) { hit = k; cut = m1.index + m1[0].length - m1[1].length; }
        else if (k > 0 && RX_MARK.test(p)) { hit = k; cut = 0; }
        else { const mm = /\n\s*((?:IN)?CORR(?:ETA|ECTA|ECT|ECTE|ETO|ECTO)\b)/i.exec(p); if (mm) { hit = k; cut = mm.index + mm[0].length - mm[1].length; } }
      }
      let raw;
      if (hit < 0) raw = pieces.slice(1).filter(Boolean).join(QCFG.optionFeedbackJoin).trim();
      else {
        o.title = [...pieces.slice(0, hit), pieces[hit].slice(0, cut)].map(x => x.trim()).filter(Boolean).join(' ');
        raw = [pieces[hit].slice(cut).trim(), ...pieces.slice(hit + 1)].filter(Boolean).join(QCFG.optionFeedbackJoin).trim();
      }
      o.fbText = raw;
      const m = RX_MARK.exec(raw);          // solo informativo (etiqueta verde/roja); no es obligatorio
      o.correct = m ? !m[1] : null;
      if (!o.title) q.warns.push('La opción ' + L + ' no tiene texto (¿había un cuadro de texto o una imagen?).');
    });
    const A = opts[0] && opts[0].title, B = opts[1] && opts[1].title;
    const isTF = opts.length === 2 && ((RX_TRUE.test(A) && RX_FALSE.test(B)) || (RX_FALSE.test(A) && RX_TRUE.test(B)));
    q.type = isTF ? 'tf' : 'mc';
    if (!q.errors.length) {
      const tag = o => o.correct === null ? null : o.correct ? 'correcta' : 'incorrecta';
      if (isTF) {
        q.fields = [
          { label: 'Enunciado', text: stem },
          { label: 'Opción 1', text: opts[0].title },
          { label: 'Opción 2', text: opts[1].title },
          { label: 'Retroalimentación 1', text: opts[0].fbText, tag: tag(opts[0]) },
          { label: 'Retroalimentación 2', text: opts[1].fbText, tag: tag(opts[1]) }
        ];
      } else {
        q.fields = [{ label: 'Enunciado', text: stem }];
        opts.forEach((o, i) => {
          const L = letterOf(i + 1);
          q.fields.push({ label: 'Opción ' + L + ' · título', text: o.title });
          q.fields.push({ label: 'Opción ' + L + ' · retroalimentación', text: o.fbText, tag: tag(o) });
        });
      }
    }
  } else if (tblAt >= 0) {                              // ── COMBINATORIA
    q.type = 'comb';
    const stem = stemOf(tblAt);
    if (!stem) q.errors.push('El enunciado está vacío.');
    // una tabla partida por un salto de página llega como varias tablas seguidas: se unen en una sola
    const tbls = its.filter(i => i.kind === 'tbl');
    if (tbls.length > 1) q.warns.push('La tabla estaba partida en ' + tbls.length + ' partes (¿salto de página?): se han unido.');
    if (its.slice(tblAt + 1).some(i => i.kind === 'p' && i.text)) q.warns.push('Hay texto entre o después de las tablas que se ha ignorado.');
    const pairs = [];
    tbls.flatMap(t => t.rows).forEach((r, ri) => {
      const cell = s => (s || '').replace(/\n+/g, ' ').trim();
      const title = cell(r[0]), pair = r.slice(1).map(cell).filter(Boolean).join(' ');
      if (!title && !pair) return;
      if (r.length < 2) q.errors.push('La fila ' + (ri + 1) + ' de la tabla tiene una sola columna.');
      else if (!title || !pair) q.warns.push('La fila ' + (ri + 1) + ' de la tabla está incompleta.');
      pairs.push({ title, pair });
    });
    if (pairs.length < 2) q.errors.push('La tabla tiene menos de 2 filas con contenido.');
    if (!q.errors.length) {
      q.fields = [{ label: 'Enunciado', text: stem }];
      pairs.forEach((p, i) => {
        q.fields.push({ label: 'Apartado ' + (i + 1) + ' · título', text: p.title });
        q.fields.push({ label: 'Apartado ' + (i + 1) + ' · pareja', text: p.pair });
      });
    }
  } else {                                              // ── ENSAYO SIN RETROALIMENTACIÓN (solo enunciado)
    q.type = 'essay';
    const stem = stemOf(its.length);
    if (!stem) q.errors.push('El enunciado está vacío.');
    q.fields = [{ label: 'Enunciado', text: stem }];
  }
  if (q.errors.length) q.fields = [];
  return q;
}

async function parseDocxQuestions(buf) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip no está cargado');
  const zip = await JSZip.loadAsync(buf);
  const read = async n => { const f = zip.file(n); return f ? f.async('string') : null; };
  const docXml = await read('word/document.xml');
  if (!docXml) throw new Error('El archivo no contiene word/document.xml');
  const dp = new DOMParser();
  const toDom = s => dp.parseFromString(s, 'application/xml');
  const doc = toDom(docXml);
  if (doc.getElementsByTagName('parsererror').length) throw new Error('No se pudo leer el XML del documento');
  const numbering = parseNumbering(await read('word/numbering.xml'), toDom);
  const styleNums = parseStyleNums(await read('word/styles.xml'), toDom);
  const body = doc.getElementsByTagNameNS(WNS, 'body')[0];
  if (!body) throw new Error('Documento sin cuerpo');

  // contadores de listas (por definición abstracta, como hace Word)
  const counters = {}, seenNum = new Set();
  function bump(numId, lvl) {
    const n = numbering.num[numId];
    if (!n) return { fmt: 'decimal', value: 1, abs: 'x' + numId };
    const cs = counters[n.abs] || (counters[n.abs] = []);
    if (!seenNum.has(numId)) { seenNum.add(numId); for (const l in n.overrides) cs[l] = undefined; }
    const lv = (numbering.abs[n.abs] || {})[lvl] || { fmt: 'decimal', start: 1 };
    const start = n.overrides[lvl] !== undefined ? n.overrides[lvl] : lv.start;
    cs[lvl] = cs[lvl] === undefined ? start : cs[lvl] + 1;
    for (let k = lvl + 1; k < 9; k++) cs[k] = undefined;
    return { fmt: lv.fmt, value: cs[lvl], abs: n.abs };
  }

  const blocks = []; bodyBlocks(body, blocks);
  const items = [];
  for (const b of blocks) {
    if (b.localName === 'tbl') { items.push({ kind: 'tbl', rows: tableRows(b) }); continue; }
    const pPr = qEl(b, 'pPr');
    const style = qAttr(qEl(pPr, 'pStyle'), 'val') || '';
    const npEl = qEl(pPr, 'numPr');
    let numId = npEl ? qAttr(qEl(npEl, 'numId'), 'val') : null;
    let ilvl = npEl ? qAttr(qEl(npEl, 'ilvl'), 'val') : null;
    if (numId == null && styleNums[style]) { numId = styleNums[style].numId; if (ilvl == null) ilvl = styleNums[style].ilvl; }
    const { text, floating } = readPara(b);
    const it = { kind: 'p', text, floating, style, np: null, label: '' };
    if (numId != null && numId !== '0') {
      const lvl = +(ilvl || 0), r = bump(numId, lvl);
      it.np = { fmt: r.fmt, lvl, value: r.value, abs: r.abs };
      it.label = r.fmt === 'bullet' ? '•' : /Letter$/.test(r.fmt)
        ? (r.fmt.startsWith('upper') ? letterOf(r.value).toUpperCase() : letterOf(r.value)) + ')'
        : /^decimal/.test(r.fmt) ? r.value + '.' : '';
    }
    items.push(it);
  }

  // reparto en preguntas
  const questions = [], preface = [], docWarnings = [], blockNotes = [];
  let cur = null, mainAbs = null, last = 0;
  const mkBad = (k, msg) => ({ n: k, type: 'missing', errors: [msg], warns: [], fields: [] });
  function closeCur() {
    if (!cur) return;
    const expected = last + 1; let idx = cur.shown, extra = null;
    if (idx > expected) {
      for (let k = expected; k < idx; k++) {
        questions.push(mkBad(k, 'Falta la pregunta #' + k + ': la numeración ' + (last ? 'salta de #' + last + ' a #' + idx : 'empieza en #' + idx) +
          '. Es probable que esté en un encabezado o cuadro de texto.'));
      }
    } else if (idx < expected) {
      extra = 'Numeración repetida o reiniciada: el documento muestra #' + idx + ' y se esperaba #' + expected + '.';
      idx = expected;
    }
    const q = buildQuestion(cur, idx);
    if (extra) { q.errors.unshift(extra); q.fields = []; }
    questions.push(q); last = idx; cur = null;
  }
  for (const it of items) {
    const isQ = it.kind === 'p' && it.np && /^decimal/.test(it.np.fmt) && it.np.lvl === 0 &&
      !(cur && cur.guide && mainAbs !== null && it.np.abs !== mainAbs);
    if (isQ) {
      closeCur();
      if (mainAbs === null) mainAbs = it.np.abs;
      cur = { shown: it.np.value, first: it, items: [], guide: false };
      continue;
    }
    if (it.kind === 'p' && it.text && !isOptionItem(it) && RX_BLOCK.test(it.text)) {
      blockNotes.push({ text: it.text, before: (cur ? cur.shown : last) + 1 });   // se aplica a la pregunta siguiente
      continue;
    }
    if (!cur) {
      if (it.kind === 'p' && it.text) preface.push(it.text);
      if (isOptionItem(it)) docWarnings.push('Hay una opción («' + it.text.slice(0, 30) + '») antes de la primera pregunta.');
      continue;
    }
    if (isGuideTitle(it)) cur.guide = true;
    cur.items.push(it);
  }
  closeCur();

  const bad = questions.filter(q => q.errors.length).length;
  const warn = questions.filter(q => !q.errors.length && q.warns.length).length;
  return { total: last, questions, preface, docWarnings, blocks: blockNotes, bad, warn };
}

/* ════════════════════════════════════════════════════════════════
   MÓDULO 3 · PROGRESO
   ════════════════════════════════════════════════════════════════
   A diferencia del formateador, aquí los formularios (hasta 5) y su
   nº de preguntas se editan desde la propia interfaz -los guarda el
   navegador-, no hace falta tocar el código para el uso normal.
   ════════════════════════════════════════════════════════════════ */
const FORMCATS_KEY = 'panelhub_formcats';       // [{ id, name, count }]
const FORMANSWERS_KEY = 'panelhub_formanswers'; // { [catId]: { [posición 0-based]: 'respuesta' } }
const MAX_FORMS = 5;

let formCats = [];
let formAnswers = {};
let activeCat = null;
let selectedItem = null; // { catId, index }

function loadFormState() {
  try {
    const cats = JSON.parse(localStorage.getItem(FORMCATS_KEY));
    formCats = Array.isArray(cats) && cats.length ? cats : [{ id: 'cat1', name: 'Formulario 1', count: 5 }];
  } catch (e) { formCats = [{ id: 'cat1', name: 'Formulario 1', count: 5 }]; }
  try { formAnswers = JSON.parse(localStorage.getItem(FORMANSWERS_KEY)) || {}; } catch (e) { formAnswers = {}; }
  activeCat = formCats[0] ? formCats[0].id : null;
}
function saveFormCats() { try { localStorage.setItem(FORMCATS_KEY, JSON.stringify(formCats)); } catch (e) {} }
function saveFormAnswers() { try { localStorage.setItem(FORMANSWERS_KEY, JSON.stringify(formAnswers)); } catch (e) {} }

function renderCatTabs() {
  const bar = $('#cat-tabs');
  bar.innerHTML = formCats.map(c =>
    '<button data-id="' + c.id + '" class="' + (c.id === activeCat ? 'on' : '') + '">' + esc(c.name) + '</button>'
  ).join('') + (formCats.length < MAX_FORMS ? '<button class="add" id="cat-add">+ formulario</button>' : '');

  bar.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => {
    activeCat = b.dataset.id; selectedItem = null; renderCatTabs(); renderItemList();
  });
  const addBtn = $('#cat-add');
  if (addBtn) addBtn.onclick = addCategory;

  $('#cat-actions').innerHTML = activeCat
    ? '<button class="btn sm" id="cat-rename">Renombrar</button><button class="btn sm" id="cat-delete">Borrar formulario</button>'
    : '';
  const r = $('#cat-rename'); if (r) r.onclick = renameCategory;
  const d = $('#cat-delete'); if (d) d.onclick = deleteCategory;
}

function addCategory() {
  if (formCats.length >= MAX_FORMS) return;
  const name = prompt('Nombre del nuevo formulario:', 'Formulario ' + (formCats.length + 1));
  if (!name) return;
  const id = 'cat' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  formCats.push({ id, name: name.trim(), count: 5 });
  formAnswers[id] = {};
  activeCat = id; selectedItem = null;
  saveFormCats(); saveFormAnswers();
  renderCatTabs(); renderItemList();
}
function renameCategory() {
  const cat = formCats.find(c => c.id === activeCat); if (!cat) return;
  const name = prompt('Nuevo nombre para «' + cat.name + '»:', cat.name);
  if (!name) return;
  cat.name = name.trim(); saveFormCats(); renderCatTabs();
}
function deleteCategory() {
  const cat = formCats.find(c => c.id === activeCat); if (!cat) return;
  if (!confirm('¿Borrar el formulario «' + cat.name + '» y todas sus respuestas? No se puede deshacer.')) return;
  formCats = formCats.filter(c => c.id !== cat.id);
  delete formAnswers[cat.id];
  activeCat = formCats[0] ? formCats[0].id : null; selectedItem = null;
  saveFormCats(); saveFormAnswers();
  renderCatTabs(); renderItemList();
}

/* Por cada pestaña abierta en el lector: crea su formulario si no existe (hasta
   el máximo de 5), lo enlaza con el documento (cat.doc) y pone el nº de preguntas
   detectado por el análisis. No borra formularios ni respuestas. Si tu caso real necesita
   que la lista de formularios "sea" exactamente la de documentos abiertos
   (añadiendo Y quitando), cambia esta función para que reconstruya
   formCats entero a partir de docxTabs en vez de solo añadir lo que falte. */
function syncCategoriesFromDocx() {
  let added = 0, updated = 0, noRoom = 0, lastTouched = null;
  const lines = [];
  let pristine = formCats.length === 1 && formCats[0].id === 'cat1' && formCats[0].name === 'Formulario 1' &&
    !Object.values(formAnswers.cat1 || {}).some(v => (v || '').trim());
  for (const t of docxTabs) {
    const p = t.parsed;
    let cat = formCats.find(c => c.doc === t.name) || formCats.find(c => c.name === t.name);
    if (!cat && pristine) {            // el «Formulario 1» vacío del primer uso se aprovecha para el primer documento
      cat = formCats[0]; cat.name = t.name; cat.count = p && p.total ? p.total : cat.count;
      pristine = false; updated++; lastTouched = cat;
    }
    if (!cat) {
      if (formCats.length >= MAX_FORMS) { noRoom++; continue; }
      const id = 'cat' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + added;
      cat = { id, name: t.name, count: p && p.total ? p.total : 5 };
      formCats.push(cat); formAnswers[id] = {};
      added++; lastTouched = cat;
    } else if (p && p.total && cat.count !== p.total) {
      cat.count = p.total; updated++;
    }
    cat.doc = t.name;
    lines.push('· ' + t.name + ': ' + (p
      ? p.total + ' preguntas' + (p.bad ? ', ' + p.bad + ' no tratable(s) (' + p.questions.filter(q => q.errors.length).map(q => '#' + q.n).join(', ') + ')' : '')
      : (t.parseError ? 'no se pudo analizar (' + t.parseError + ')' : 'aún sin analizar')));
  }
  if (lastTouched) { activeCat = lastTouched.id; selectedItem = null; }
  if (!activeCat && formCats.length) activeCat = formCats[0].id;
  saveFormCats(); saveFormAnswers();
  renderCatTabs(); renderItemList();
  alert(!docxTabs.length ? 'No hay ningún documento abierto en el lector.'
    : 'Formularios nuevos: ' + added + ' · con nº de preguntas actualizado: ' + updated + (noRoom ? ' · sin hueco (máx. ' + MAX_FORMS + '): ' + noRoom : '') + '\n\n' + lines.join('\n'));
}
$('#sync-docx').addEventListener('click', syncCategoriesFromDocx);

$('#cat-count-input').addEventListener('input', e => {
  const cat = formCats.find(c => c.id === activeCat); if (!cat) return;
  cat.count = Math.max(0, parseInt(e.target.value, 10) || 0);
  saveFormCats();
  renderItemList();
});

/* Busca, dentro del MISMO formulario y hacia atrás desde "fromIndex",
   la pregunta más reciente que tenga EXACTAMENTE la misma respuesta
   (sin distinguir mayúsculas/minúsculas ni espacios al principio o al
   final). Si tu caso real necesita distinguir mayúsculas de minúsculas,
   quita los dos ".toLowerCase()". Si en vez de "misma posición dentro
   del mismo formulario" lo que quieres es comparar con OTROS formularios
   en esa misma posición, cambia el bucle para recorrer formCats en vez
   de los índices de uno solo. */
function findPreviousSameAnswer(catId, fromIndex, answer) {
  const a = (answer || '').trim().toLowerCase();
  if (!a) return null;
  const answers = formAnswers[catId] || {};
  for (let i = fromIndex - 1; i >= 0; i--) {
    const prev = (answers[i] || '').trim().toLowerCase();
    if (prev && prev === a) return i;
  }
  return null;
}

function updateProgressSummary(cat) {
  const answers = formAnswers[cat.id] || {};
  const doneCount = Object.keys(answers).filter(k => +k < cat.count && (answers[k] || '').trim() !== '').length;
  $('#cat-count').textContent = doneCount + ' de ' + cat.count + ' respondidas';
  $('#cat-bar-fill').style.width = (cat.count ? doneCount / cat.count * 100 : 0) + '%';
}

function updatePrevInfo() {
  updateFieldsPanel();
  const info = $('#prev-info');
  if (!selectedItem || selectedItem.catId !== activeCat) { info.style.display = 'none'; return; }
  const cat = formCats.find(c => c.id === activeCat);
  const answers = formAnswers[cat.id] || {};
  const val = answers[selectedItem.index] || '';
  if (!val.trim()) { info.style.display = 'none'; return; }
  const prevIdx = findPreviousSameAnswer(cat.id, selectedItem.index, val);
  info.style.display = 'block';
  info.innerHTML = 'Pregunta <b>#' + (selectedItem.index + 1) + '</b>, respuesta «<b>' + esc(val.trim()) + '</b>». ' +
    (prevIdx !== null
      ? 'La última anterior con la misma respuesta es la <b>#' + (prevIdx + 1) + '</b>.'
      : 'No hay ninguna pregunta anterior con esta misma respuesta.');
}

/* ── campos de la pregunta seleccionada (a petición) ── */
const copiedFields = {};   // { 'catId:índice': Set(nº de campo) } — solo en memoria

function currentParsed(cat) { return cat ? (docsParsed[cat.doc] || docsParsed[cat.name] || null) : null; }

/* Instrucciones de bloque («Bloco 1. O sistema selecionará…»): se guardan aparte, no son campos de pregunta. */
let blocksOpen = false;
function renderBlocks(parsed) {
  const box = $('#q-blocks');
  const bl = parsed && parsed.blocks || [];
  const self = !!(parsed && parsed.selfEval);
  const pts = parsed && !self ? parsed.questions.filter(q => q.points) : [];
  const notes = [];   // avisos según el nombre del archivo
  if (parsed && !self) {
    if (parsed.rec02) notes.push(['Rec02', 'La puntuación final de este cuestionario no es 10 sino 8,5.']);
    if (parsed.recEx) {
      if (!bl.length && !pts.length) notes.push(['Rec01 / Ex', 'No se especifica nada en el documento: por defecto son 20 preguntas aleatorias.']);
      notes.push(['Rec01 / Ex', 'Ante la duda, si ya existe un cuestionario del mismo tipo configurado en otro idioma, revísalo.']);
    }
  }
  if (!bl.length && !pts.length && !self && !notes.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<details' + (blocksOpen ? ' open' : '') + '><summary>Bloques y puntuaciones (' + bl.length + ' bloques · ' + (self ? 'todas valen 0' : pts.length + ' puntuaciones') + (notes.length ? ' · ' + notes.length + ' notas' : '') + ')</summary>' +
    notes.map(n => '<div class="blk"><div class="t"><b>' + n[0] + '</b>' + esc(n[1]) + '</div></div>').join('') +
    (self ? '<div class="blk"><div class="t"><b>autoevaluación</b>El nombre del archivo contiene «test» o «tarea»: todas las preguntas valen 0 puntos (no cuentan para la nota), aunque el documento indique otra cosa.</div></div>' : '') +
    bl.map((b, i) => '<div class="blk"><div class="t"><b>antes de la pregunta #' + b.before + '</b>' + esc(b.text) + '</div><button class="btn sm" data-b="' + i + '">Copiar</button></div>').join('') +
    (pts.length ? '<div class="blk"><div class="t"><b>puntuación por pregunta</b>' + pts.map(q => '#' + q.n + ': ' + esc(q.points)).join('\n') + '</div></div>' : '') + '</details>';
  const det = box.querySelector('details');
  det.addEventListener('toggle', () => { blocksOpen = det.open; });
  box.querySelectorAll('button[data-b]').forEach(btn => btn.addEventListener('click', async () => {
    await copyText(bl[+btn.dataset.b].text);
    const old = btn.textContent; btn.textContent = 'Copiado ✓'; setTimeout(() => { btn.textContent = old; }, 1200);
  }));
}
function blkTag(parsed, i) {
  const bk = parsed ? (parsed.blocks || []).filter(b => b.before === i + 1) : [];
  const q = parsed && parsed.questions[i];
  const pt = parsed && parsed.selfEval ? '0' : q && q.points;
  return (bk.length ? '<span class="qtag blk" title="' + esc(bk.map(b => b.text).join('\n')) + '">B</span>' : '') +
    (pt ? '<span class="qtag" title="Puntuación (solo informativa)">' + esc((String(pt).match(/\d+(?:[.,]\d+)?/) || [String(pt)])[0]) + '</span>' : '');
}

function updateQSummary(cat) {
  const el = $('#q-summary');
  const parsed = currentParsed(cat);
  renderBlocks(parsed);
  if (!parsed) { el.innerHTML = ''; return; }
  const badNums = parsed.questions.filter(q => q.errors.length).map(q => '#' + q.n);
  let t = 'Analizado: ' + parsed.total + ' preguntas';
  if (parsed.warn) t += ' · ' + parsed.warn + ' con avisos';
  if (badNums.length) t += ' · <b>no tratables: ' + badNums.join(', ') + '</b>';
  if (cat.count !== parsed.total) t += ' · ojo: el formulario tiene ' + cat.count + ' y el documento ' + parsed.total;
  el.innerHTML = t;
}

function updateFieldsPanel() {
  const box = $('#q-panel');
  const cat = formCats.find(c => c.id === activeCat);
  if (!cat || !selectedItem || selectedItem.catId !== activeCat || selectedItem.index >= cat.count) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const parsed = currentParsed(cat);
  if (!parsed) {
    box.innerHTML = '<div class="empty-hint">Abre en el lector el .docx de este formulario (con su mismo nombre, o usa «Usar documentos abiertos») para ver aquí los campos de cada pregunta.</div>';
    return;
  }
  const idx = selectedItem.index, q = parsed.questions[idx];
  if (!q) { box.innerHTML = '<div class="q-alert bad">La pregunta #' + (idx + 1) + ' no existe en el documento (solo tiene ' + parsed.total + ').</div>'; return; }
  const t = QTYPES[q.type] || QTYPES.bad;
  const key = cat.id + ':' + idx;
  const done = copiedFields[key] || (copiedFields[key] = new Set());

  let h = '<div class="q-head"><span>Pregunta <b>#' + q.n + '</b> · ' + esc(t.label) + (q.fields.length ? ' · ' + q.fields.length + ' campos' : '') + '</span>';
  const isLast = idx + 1 >= cat.count;
  const isFirst = idx === 0;
  const gotoBtn = id => '<button class="btn sm" id="' + id + 'p"' + (isFirst ? ' disabled title="Es la primera pregunta del formulario"' : '') + '>‹ Anterior</button>' +
    '<button class="btn sm" id="' + id + '"' + (isLast ? ' disabled title="Es la última pregunta del formulario"' : '') + '>Siguiente pregunta ›</button>';
  h += '<span class="q-btns">' + (q.fields.length ? '<button class="btn sm go" id="q-next">Copiar siguiente ▸</button><button class="btn sm" id="q-reset" title="Quitar las marcas de copiado">↺</button>' : '') + gotoBtn('q-goto') + '</span>';
  h += '</div>';
  (parsed.blocks || []).filter(b => b.before === q.n).forEach(b => { h += '<div class="q-alert info">Aquí empieza un bloque (solo informativo): ' + esc(b.text) + '</div>'; });
  if (parsed.selfEval) h += '<div class="q-alert info">Puntuación (solo informativo): 0 · autoevaluación (test/tarea)</div>';
  else if (q.points) h += '<div class="q-alert info">Puntuación (solo informativo): ' + esc(q.points) + '</div>';
  q.errors.forEach(e => { h += '<div class="q-alert bad">⚠ No se puede tratar en el index: ' + esc(e) + '</div>'; });
  q.warns.forEach(w => { h += '<div class="q-alert warn">' + esc(w) + '</div>'; });
  if (q.fields.length) {
    h += '<div class="q-fields">' + q.fields.map((f, k) => {
      const empty = !f.text;
      return '<div class="q-field' + (done.has(k) ? ' copied' : '') + '" data-k="' + k + '"><div class="body">' +
        '<div class="lbl">' + esc(f.label) + (f.tag ? '<span class="chip ' + (f.tag === 'correcta' ? 'ok' : 'ko') + '">' + f.tag + '</span>' : '') + '</div>' +
        '<div class="txt' + (empty ? ' empty' : '') + '">' + (empty ? '(vacío)' : esc(f.text)) + '</div></div>' +
        '<button class="btn sm">' + (done.has(k) ? 'Copiado ✓' : 'Copiar') + '</button></div>';
    }).join('') + '</div><div class="q-foot">' + gotoBtn('q-goto2') + '</div>';
  }
  box.innerHTML = h;

  const flash = row => { row.classList.add('copied'); row.querySelector('button').textContent = 'Copiado ✓'; };
  const copyField = async k => {
    await copyText(q.fields[k].text);
    done.add(k);
    const row = box.querySelector('.q-field[data-k="' + k + '"]');
    if (row) { flash(row); row.scrollIntoView({ block: 'nearest' }); }
  };
  box.querySelectorAll('.q-field').forEach(row => {
    const k = +row.dataset.k;
    row.querySelector('button').addEventListener('click', () => copyField(k));
    row.querySelector('.txt').addEventListener('click', e => { if (q.fields[k].text) e.currentTarget.classList.toggle('open'); });
  });
  const nx = $('#q-next');
  if (nx) nx.addEventListener('click', () => {
    const k = q.fields.findIndex((f, i) => !done.has(i));
    if (k < 0) { nx.textContent = 'Todo copiado ✓'; setTimeout(() => { nx.textContent = 'Copiar siguiente ▸'; }, 1200); return; }
    copyField(k);
  });
  const rs = $('#q-reset');
  if (rs) rs.addEventListener('click', () => { done.clear(); updateFieldsPanel(); });

  // ir a la siguiente pregunta: enfoca su respuesta (eso selecciona la pregunta y rehace este panel)
  const go = d => {
    const t = idx + d;
    if (t < 0 || t >= cat.count) return;
    const list = $('#item-list'), inp = list.querySelector('.ans[data-i="' + t + '"]');
    if (!inp) return;
    inp.focus({ preventScroll: true });
    const row = inp.closest('.item-row');
    if (row.offsetTop < list.scrollTop) list.scrollTop = row.offsetTop - 6;
    else if (row.offsetTop + row.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = row.offsetTop + row.offsetHeight - list.clientHeight + 6;
  };
  ['#q-goto', '#q-goto2'].forEach(s => { const b = $(s); if (b) b.addEventListener('click', () => go(1)); });
  ['#q-gotop', '#q-goto2p'].forEach(s => { const b = $(s); if (b) b.addEventListener('click', () => go(-1)); });
}

/* Se llama cuando un .docx termina de analizarse: refresca el formulario enlazado. */
function onDocParsed(name) {
  const linked = formCats.some(c => (c.doc || c.name) === name || c.name === name);
  if (linked) renderItemList();
}

function renderItemList() {
  const cat = formCats.find(c => c.id === activeCat);
  const list = $('#item-list');
  const countField = $('#cat-count-field');

  if (!cat) {
    countField.style.display = 'none';
    list.innerHTML = '<div class="empty-hint">Crea un formulario con «+ formulario» para empezar.</div>';
    $('#cat-count').textContent = ''; $('#cat-bar-fill').style.width = '0%';
    $('#prev-info').style.display = 'none';
    updateFieldsPanel(); updateQSummary(null);
    return;
  }
  countField.style.display = '';
  $('#cat-count-input').value = cat.count;
  if (!formAnswers[cat.id]) formAnswers[cat.id] = {};
  const answers = formAnswers[cat.id];

  updateProgressSummary(cat);
  updateQSummary(cat);

  if (!cat.count) {
    list.innerHTML = '<div class="empty-hint">Pon un número de preguntas mayor que 0.</div>';
    $('#prev-info').style.display = 'none';
    updateFieldsPanel();
    return;
  }

  const parsed = currentParsed(cat);
  let rows = '';
  for (let i = 0; i < cat.count; i++) {
    const val = answers[i] || '';
    const sel = selectedItem && selectedItem.catId === cat.id && selectedItem.index === i;
    const q = parsed && parsed.questions[i];
    let tag = '';
    if (parsed) {
      if (!q) tag = '<span class="qtag bad" title="Esta pregunta no existe en el documento">—</span>';
      else {
        const t = QTYPES[q.type] || QTYPES.bad;
        const cls = q.errors.length ? 'bad' : q.warns.length ? 'warn' : '';
        const tip = t.label + (q.errors.length ? ' · NO TRATABLE: ' + q.errors[0] : q.warns.length ? ' · ' + q.warns[0] : '');
        tag = '<span class="qtag ' + cls + '" title="' + esc(tip) + '">' + (q.errors.length ? '⚠ ' : '') + t.short + '</span>';
      }
    }
    rows += '<div class="item-row' + (val.trim() ? ' done' : '') + (sel ? ' sel' : '') + '" data-i="' + i + '">' +
      '<span class="pos">#' + (i + 1) + '</span>' + tag + blkTag(parsed, i) +
      '<input type="text" class="ans" data-i="' + i + '" placeholder="respuesta…" value="' + esc(val) + '"></div>';
  }
  list.innerHTML = rows;

  list.querySelectorAll('.item-row').forEach(r => r.addEventListener('click', e => {
    if (e.target.tagName !== 'INPUT') r.querySelector('.ans').focus();
  }));
  list.querySelectorAll('.ans').forEach(inp => {
    const i = +inp.dataset.i;
    inp.addEventListener('focus', () => {
      selectedItem = { catId: cat.id, index: i };
      list.querySelectorAll('.item-row').forEach(r => r.classList.toggle('sel', +r.dataset.i === i));
      updatePrevInfo();
    });
    inp.addEventListener('input', () => {
      answers[i] = inp.value;
      saveFormAnswers();
      inp.closest('.item-row').classList.toggle('done', inp.value.trim() !== '');
      updateProgressSummary(cat);
      if (selectedItem && selectedItem.catId === cat.id && selectedItem.index === i) updatePrevInfo();
    });
  });

  updatePrevInfo();
}

/* ════════════════════════════════════════════════════════════════
   ARRANQUE
   ════════════════════════════════════════════════════════════════ */
buildFormatControls();
updateFormatOutput();
loadFormState();
renderCatTabs();
renderItemList();


</script>
</body>
