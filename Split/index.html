<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>split::hub — Reparto de gastos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--surface:#13131a;--surface-2:#1c1c26;--border:#25253a;--border-2:#40405a;--text:#e2e2f0;--text-2:#8080a0;--text-3:#454560;--accent:#e8a030;--accent-dim:#271d08;--good:#7cc98a;--good-dim:#132a17;--bad:#f87171;--bad-dim:#2a1212;--font-ui:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;--radius:10px;--radius-lg:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 3rem}
.logo{font:600 1.9rem var(--font-mono);letter-spacing:-.03em}.logo span{color:var(--accent)}
.tagline{font-size:12.5px;color:var(--text-3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
header{text-align:center;margin-bottom:1.4rem}
.shell{width:100%;max-width:980px}
.group-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.group-bar select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font:13px var(--font-ui);padding:9px 12px;outline:none;flex:1;min-width:160px}
.group-bar select:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 340px;gap:1rem;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.4rem;margin-bottom:1rem}
.section-title{font:11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:.9rem;display:flex;justify-content:space-between;align-items:center}

input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:13px var(--font-mono);padding:9px 11px;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:9px 14px;font:500 13px var(--font-ui);cursor:pointer;transition:border-color .15s,transform .08s;white-space:nowrap}
.btn:hover{border-color:var(--border-2)}.btn:active{transform:scale(.97)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn.go:disabled{opacity:.4;cursor:default;transform:none}
.btn.icon{padding:8px 10px;color:var(--text-3);font-size:14px}
.btn.icon:hover{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px}

/* ── miembros ── */
.member-form{display:flex;gap:8px;margin-bottom:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 8px 6px 13px;font:12.5px var(--font-ui)}
.chip button{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;line-height:1;padding:2px}
.chip button:hover{color:var(--bad)}
.empty-hint{font:12.5px var(--font-ui);color:var(--text-3);padding:.6rem 0}

/* ── gastos ── */
.expense-form{display:flex;flex-direction:column;gap:10px;padding:1rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row > *{flex:1;min-width:120px}
label{font:11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:5px}
select{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:13px var(--font-ui);padding:9px 10px;outline:none;width:100%}
select:focus{border-color:var(--accent)}
.split-toggle{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px;width:fit-content}
.split-toggle button{appearance:none;border:none;background:transparent;color:var(--text-2);font:500 12px var(--font-ui);padding:6px 11px;border-radius:6px;cursor:pointer}
.split-toggle button.on{background:var(--accent);color:#000;font-weight:600}
.split-people{display:flex;flex-direction:column;gap:6px}
.split-row{display:flex;align-items:center;gap:8px;font:13px var(--font-ui)}
.split-row input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.split-row .pname{flex:1}
.split-row .pamount{width:88px;text-align:right}
.split-row.disabled{opacity:.4}
.split-sum{font:12px var(--font-mono);color:var(--text-3);text-align:right}
.split-sum.bad{color:var(--bad)}
.form-actions{display:flex;justify-content:flex-end;gap:8px}

.exp-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.exp-row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px}
.exp-info{flex:1;min-width:0}
.exp-desc{font:13px var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-meta{font:11px var(--font-mono);color:var(--text-3);margin-top:2px}
.exp-amount{font:13px var(--font-mono);color:var(--accent);white-space:nowrap}

/* ── balances / liquidación ── */
.bal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--border);font:13px var(--font-ui)}
.bal-row:last-child{border-bottom:none}
.bal-amount{font:13px var(--font-mono)}
.bal-amount.pos{color:var(--good)}.bal-amount.neg{color:var(--bad)}
.settle-list{display:flex;flex-direction:column;gap:8px;margin-top:.4rem}
.settle-row{display:flex;align-items:center;gap:8px;font:12.5px var(--font-ui);padding:9px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.settle-row b{color:var(--text)}
.settle-row .arrow{color:var(--text-3)}
.settle-row .amt{margin-left:auto;font:12.5px var(--font-mono);color:var(--accent);white-space:nowrap}
.settled{color:var(--good);font:13px var(--font-ui);text-align:center;padding:.6rem 0}
.io-row{display:flex;gap:8px;margin-top:1rem}

@media(max-width:820px){.grid{grid-template-columns:1fr}.logo{font-size:1.5rem}}
</style>
</head>
<body>
<header><div class="logo">split<span>::</span>hub</div><div class="tagline">Reparte gastos entre grupos y salda cuentas</div></header>

<div class="shell">
  <div class="group-bar">
    <select id="group-select"></select>
    <button class="btn" id="new-group">Nuevo grupo</button>
    <button class="btn" id="rename-group">Renombrar</button>
    <button class="btn icon" id="delete-group" title="Borrar grupo">🗑</button>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="section-title">Integrantes</div>
        <form class="member-form" id="member-form">
          <input type="text" id="member-input" placeholder="Nombre…" maxlength="30" autocomplete="off">
          <button type="submit" class="btn">Añadir</button>
        </form>
        <div class="chips" id="member-chips"></div>
      </div>

      <div class="card">
        <div class="section-title">Añadir gasto</div>
        <form class="expense-form" id="expense-form">
          <div class="form-row">
            <div><label for="exp-desc">Concepto</label><input type="text" id="exp-desc" placeholder="Cena, gasolina…" maxlength="60"></div>
            <div style="max-width:130px"><label for="exp-amount">Importe (€)</label><input type="number" id="exp-amount" min="0" step="0.01" placeholder="0.00"></div>
          </div>
          <div class="form-row">
            <div><label for="exp-payer">Pagado por</label><select id="exp-payer"></select></div>
          </div>
          <div>
            <label>Repartir</label>
            <div class="split-toggle">
              <button type="button" class="on" data-mode="equal">Partes iguales</button>
              <button type="button" data-mode="custom">Importes propios</button>
            </div>
          </div>
          <div class="split-people" id="split-people"></div>
          <div class="split-sum" id="split-sum"></div>
          <div class="form-actions"><button type="submit" class="btn go" id="add-expense-btn">Añadir gasto</button></div>
        </form>
        <div class="section-title">Historial de gastos</div>
        <div class="exp-list" id="exp-list"></div>
        <div class="empty-hint" id="exp-empty">Todavía no hay gastos en este grupo</div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="section-title">Balance</div>
        <div id="bal-list"></div>
        <div class="empty-hint" id="bal-empty">Añade integrantes y gastos para ver el balance</div>
      </div>
      <div class="card">
        <div class="section-title">Cómo saldar cuentas</div>
        <div class="settle-list" id="settle-list"></div>
        <div class="empty-hint" id="settle-empty">Nada que saldar todavía</div>
      </div>
      <div class="card">
        <div class="section-title">Grupo</div>
        <div class="io-row">
          <button class="btn sm" id="export-group" style="flex:1">Exportar JSON</button>
          <button class="btn sm" id="import-group" style="flex:1">Importar JSON</button>
        </div>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const STORE_KEY = 'splithub_groups';
const ACTIVE_KEY = 'splithub_active';
const fmt = c => (c / 100).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
let uidMember = 1, uidExpense = 1;
let splitMode = 'equal';

/* ── persistencia ── */
function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { return {}; }
}
function saveAll(all) { try { localStorage.setItem(STORE_KEY, JSON.stringify(all)); } catch (e) {} }
function getActiveId() { try { return localStorage.getItem(ACTIVE_KEY); } catch (e) { return null; } }
function setActiveId(id) { try { localStorage.setItem(ACTIVE_KEY, id); } catch (e) {} }

let groups = loadAll();
let activeId = getActiveId();

function newGroup(name) {
  const id = 'g' + Date.now() + Math.random().toString(36).slice(2, 6);
  groups[id] = { id, name, members: [], expenses: [] };
  return id;
}
if (!activeId || !groups[activeId]) {
  if (!Object.keys(groups).length) activeId = newGroup('Mi grupo');
  else activeId = Object.keys(groups)[0];
}
function group() { return groups[activeId]; }
function persist() { saveAll(groups); }

/* recalcula los contadores internos a partir de lo cargado */
function resyncCounters() {
  Object.values(groups).forEach(g => {
    g.members.forEach(m => { const n = +m.id.replace(/\D/g, '') || 0; if (n >= uidMember) uidMember = n + 1; });
    g.expenses.forEach(e => { const n = +e.id.replace(/\D/g, '') || 0; if (n >= uidExpense) uidExpense = n + 1; });
  });
}
resyncCounters();

/* ── selector de grupo ── */
function renderGroupSelect() {
  const sel = $('#group-select');
  sel.innerHTML = Object.values(groups)
    .map(g => `<option value="${g.id}"${g.id === activeId ? ' selected' : ''}>${esc(g.name)}</option>`).join('');
}
$('#group-select').onchange = e => { activeId = e.target.value; setActiveId(activeId); renderAll(); };
$('#new-group').onclick = () => {
  const name = prompt('Nombre del nuevo grupo:', 'Grupo ' + (Object.keys(groups).length + 1));
  if (!name) return;
  activeId = newGroup(name.trim()); setActiveId(activeId); persist(); renderAll();
};
$('#rename-group').onclick = () => {
  const name = prompt('Nuevo nombre del grupo:', group().name);
  if (!name) return;
  group().name = name.trim(); persist(); renderGroupSelect();
};
$('#delete-group').onclick = () => {
  if (Object.keys(groups).length <= 1) return alert('No puedes borrar el único grupo que tienes.');
  if (!confirm('¿Borrar el grupo "' + group().name + '" y todos sus datos? No se puede deshacer.')) return;
  delete groups[activeId]; activeId = Object.keys(groups)[0]; setActiveId(activeId); persist(); renderAll();
};

/* ── miembros ── */
$('#member-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('#member-input'); const name = input.value.trim();
  if (!name) return;
  group().members.push({ id: 'm' + uidMember++, name });
  input.value = ''; persist(); renderAll();
});
function deleteMember(id) {
  const g = group();
  const used = g.expenses.some(ex => ex.paidBy === id || ex.splits.hasOwnProperty(id));
  if (used && !confirm('Este integrante tiene gastos asociados. Al quitarlo se borrarán esos gastos. ¿Continuar?')) return;
  if (used) g.expenses = g.expenses.filter(ex => ex.paidBy !== id && !ex.splits.hasOwnProperty(id));
  g.members = g.members.filter(m => m.id !== id);
  persist(); renderAll();
}
function renderMembers() {
  const g = group();
  $('#member-chips').innerHTML = g.members.length ? g.members.map(m =>
    `<span class="chip">${esc(m.name)}<button data-id="${m.id}" title="Quitar">✕</button></span>`).join('')
    : '<div class="empty-hint">Añade a las personas del grupo</div>';
  $('#member-chips').querySelectorAll('button').forEach(b => b.onclick = () => deleteMember(b.dataset.id));

  const payer = $('#exp-payer');
  const prev = payer.value;
  payer.innerHTML = g.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  if (g.members.some(m => m.id === prev)) payer.value = prev;
}

/* ── formulario de gasto ── */
document.querySelectorAll('.split-toggle button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.split-toggle button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); splitMode = b.dataset.mode; renderSplitPeople();
});

function renderSplitPeople() {
  const g = group(); const wrap = $('#split-people');

  if (!g.members.length) { wrap.innerHTML = '<div class="empty-hint">Añade integrantes primero</div>'; $('#split-sum').textContent = ''; return; }

  /* conserva la marca/desmarca de quien ya tenía fila; un integrante que aparece
     por primera vez (recién añadido al grupo) entra marcado por defecto */
  const priorChecked = new Map(
    [...wrap.querySelectorAll('.split-row input[type=checkbox]')].map(c => [c.dataset.id, c.checked])
  );

  wrap.innerHTML = g.members.map(m => {
    const on = priorChecked.has(m.id) ? priorChecked.get(m.id) : true;
    return `<div class="split-row${on ? '' : ' disabled'}">
      <input type="checkbox" data-id="${m.id}" ${on ? 'checked' : ''}>
      <span class="pname">${esc(m.name)}</span>
      ${splitMode === 'custom' ? `<input type="number" class="pamount" data-id="${m.id}" min="0" step="0.01" placeholder="0.00" ${on ? '' : 'disabled'}>` : ''}
    </div>`;
  }).join('');

  wrap.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = renderSplitPeople);
  if (splitMode === 'custom') wrap.querySelectorAll('.pamount').forEach(inp => inp.oninput = updateSplitSum);
  updateSplitSum();
}

function participantIds() {
  return [...document.querySelectorAll('#split-people input[type=checkbox]:checked')].map(c => c.dataset.id);
}
function updateSplitSum() {
  const amountVal = parseFloat($('#exp-amount').value) || 0;
  const totalCents = Math.round(amountVal * 100);
  const sumEl = $('#split-sum');
  if (splitMode === 'equal') {
    const n = participantIds().length;
    sumEl.className = 'split-sum';
    sumEl.textContent = n ? `${n} persona(s) · ${fmt(Math.round(totalCents / n))} cada una (aprox.)` : '';
    return;
  }
  const inputs = [...document.querySelectorAll('#split-people .pamount:not(:disabled)')];
  const enteredCents = inputs.reduce((s, i) => s + Math.round((parseFloat(i.value) || 0) * 100), 0);
  const diff = totalCents - enteredCents;
  sumEl.className = 'split-sum' + (diff !== 0 ? ' bad' : '');
  sumEl.textContent = diff === 0
    ? 'Cuadra con el importe total ✓'
    : `Faltan ${fmt(Math.abs(diff))} ${diff > 0 ? 'por repartir' : 'de más'}`;
}
$('#exp-amount').addEventListener('input', updateSplitSum);

function splitEqually(totalCents, ids) {
  const n = ids.length;
  const base = Math.floor(totalCents / n);
  let remainder = totalCents - base * n;
  const out = {};
  ids.forEach(id => { out[id] = base + (remainder > 0 ? 1 : 0); if (remainder > 0) remainder--; });
  return out;
}

$('#expense-form').addEventListener('submit', e => {
  e.preventDefault();
  const g = group();
  const desc = $('#exp-desc').value.trim() || 'Gasto';
  const amountVal = parseFloat($('#exp-amount').value);
  const totalCents = Math.round((amountVal || 0) * 100);
  const payer = $('#exp-payer').value;
  const ids = participantIds();

  if (!g.members.length) return alert('Añade al menos a un integrante.');
  if (!totalCents || totalCents <= 0) return alert('Indica un importe mayor que 0.');
  if (!payer) return alert('Indica quién pagó.');
  if (!ids.length) return alert('Selecciona al menos una persona para repartir el gasto.');

  let splits;
  if (splitMode === 'equal') {
    splits = splitEqually(totalCents, ids);
  } else {
    splits = {};
    let sum = 0;
    document.querySelectorAll('#split-people .pamount:not(:disabled)').forEach(inp => {
      const c = Math.round((parseFloat(inp.value) || 0) * 100);
      splits[inp.dataset.id] = c; sum += c;
    });
    if (sum !== totalCents) return alert('Los importes personalizados no suman el total del gasto.');
  }

  g.expenses.push({ id: 'e' + uidExpense++, desc, amountCents: totalCents, paidBy: payer, splits, at: new Date().toISOString() });
  persist();
  $('#exp-desc').value = ''; $('#exp-amount').value = '';
  splitMode = 'equal';
  document.querySelectorAll('.split-toggle button').forEach(b => b.classList.toggle('on', b.dataset.mode === 'equal'));
  $('#split-people').innerHTML = '';
  renderAll();
});

function deleteExpense(id) {
  group().expenses = group().expenses.filter(e => e.id !== id);
  persist(); renderAll();
}
function renderExpenses() {
  const g = group();
  const byId = Object.fromEntries(g.members.map(m => [m.id, m.name]));
  const list = $('#exp-list');
  $('#exp-empty').style.display = g.expenses.length ? 'none' : 'block';
  list.innerHTML = [...g.expenses].reverse().map(ex => {
    const date = new Date(ex.at).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
    const n = Object.keys(ex.splits).length;
    return `<div class="exp-row">
      <div class="exp-info">
        <div class="exp-desc">${esc(ex.desc)}</div>
        <div class="exp-meta">${esc(byId[ex.paidBy] || '—')} pagó · entre ${n} · ${date}</div>
      </div>
      <div class="exp-amount">${fmt(ex.amountCents)}</div>
      <button class="btn icon" data-id="${ex.id}" title="Borrar gasto">✕</button>
    </div>`;
  }).join('');
  list.querySelectorAll('button').forEach(b => b.onclick = () => deleteExpense(b.dataset.id));
}

/* ── balances ── */
function computeBalances() {
  const g = group();
  const bal = Object.fromEntries(g.members.map(m => [m.id, 0]));
  g.expenses.forEach(ex => {
    if (bal[ex.paidBy] === undefined) return;
    bal[ex.paidBy] += ex.amountCents;
    Object.entries(ex.splits).forEach(([id, c]) => { if (bal[id] !== undefined) bal[id] -= c; });
  });
  return bal;
}
function renderBalances() {
  const g = group(); const bal = computeBalances();
  const list = $('#bal-list');
  $('#bal-empty').style.display = g.members.length ? 'none' : 'block';
  list.innerHTML = g.members.map(m => {
    const c = bal[m.id] || 0;
    const cls = c > 0 ? 'pos' : c < 0 ? 'neg' : '';
    const txt = c > 0 ? `le deben ${fmt(c)}` : c < 0 ? `debe ${fmt(-c)}` : 'en paz';
    return `<div class="bal-row"><span>${esc(m.name)}</span><span class="bal-amount ${cls}">${txt}</span></div>`;
  }).join('');
  return bal;
}

/* ── plan de liquidación (mínimo de transferencias) ── */
function settlePlan(bal, members) {
  const byId = Object.fromEntries(members.map(m => [m.id, m.name]));
  const debtors = [], creditors = [];
  Object.entries(bal).forEach(([id, c]) => {
    if (c < -1) debtors.push({ id, amount: -c });
    else if (c > 1) creditors.push({ id, amount: c });
  });
  debtors.sort((a, b) => b.amount - a.amount);
  creditors.sort((a, b) => b.amount - a.amount);
  const moves = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const d = debtors[i], c = creditors[j];
    const amount = Math.min(d.amount, c.amount);
    if (amount > 0) moves.push({ from: byId[d.id], to: byId[c.id], amount });
    d.amount -= amount; c.amount -= amount;
    if (d.amount <= 1) i++;
    if (c.amount <= 1) j++;
  }
  return moves;
}
function renderSettle(bal) {
  const g = group();
  const moves = settlePlan(bal, g.members);
  const list = $('#settle-list'), empty = $('#settle-empty');
  if (!g.members.length) { list.innerHTML = ''; empty.style.display = 'block'; empty.textContent = 'Añade integrantes para calcular la liquidación'; return; }
  if (!moves.length) { list.innerHTML = ''; empty.style.display = 'block'; empty.textContent = 'Todas las cuentas están saldadas'; return; }
  empty.style.display = 'none';
  list.innerHTML = moves.map(m =>
    `<div class="settle-row"><b>${esc(m.from)}</b><span class="arrow">→</span><b>${esc(m.to)}</b><span class="amt">${fmt(m.amount)}</span></div>`
  ).join('');
}

/* ── exportar / importar ── */
$('#export-group').onclick = () => {
  const blob = new Blob([JSON.stringify(group(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (group().name || 'grupo').replace(/[^\w\-]+/g, '_') + '.json';
  a.click();
};
$('#import-group').onclick = () => $('#import-file').click();
$('#import-file').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.members) || !Array.isArray(data.expenses)) throw new Error('formato no válido');
    const id = newGroup(data.name || 'Grupo importado');
    groups[id].members = data.members; groups[id].expenses = data.expenses;
    activeId = id; setActiveId(id); resyncCounters(); persist(); renderAll();
  } catch (err) { alert('No se pudo importar el archivo: ' + err.message); }
  e.target.value = '';
};

/* ── render general ── */
function renderAll() {
  renderGroupSelect();
  renderMembers();
  renderSplitPeople();
  renderExpenses();
  const bal = renderBalances();
  renderSettle(bal);
}
renderAll();
</script>
</body>
