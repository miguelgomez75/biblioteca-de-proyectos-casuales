<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>weather::hub — Clima</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--surface:#13131a;--surface-2:#1c1c26;--border:#25253a;--border-2:#40405a;--text:#e2e2f0;--text-2:#8080a0;--text-3:#454560;--accent:#e8a030;--accent-dim:#271d08;--good:#7cc98a;--bad:#f87171;--font-ui:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;--radius:10px;--radius-lg:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(2rem + env(safe-area-inset-top,0px)) 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
.logo{font:600 1.9rem var(--font-mono);letter-spacing:-.03em}.logo span{color:var(--accent)}
.tagline{font-size:12.5px;color:var(--text-3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
header{text-align:center;margin-bottom:1.4rem}
.shell{width:100%;max-width:820px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem;margin-bottom:1rem;position:relative}
.section-title{font:11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 13px;font:500 12.5px var(--font-ui);cursor:pointer;transition:border-color .15s,transform .08s}
.btn:hover{border-color:var(--border-2)}.btn:active{transform:scale(.96)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.btn.sel{border-color:var(--accent);color:var(--accent)}

.search-row{display:flex;gap:8px}
input[type=text]{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:13.5px var(--font-ui);padding:10px 12px;outline:none;flex:1}
input:focus{border-color:var(--accent)}
.results-list{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.result-item{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;font:12.5px var(--font-ui)}
.result-item:hover{border-color:var(--border-2)}
.result-item small{color:var(--text-3);display:block;font:11px var(--font-mono);margin-top:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:.7rem}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font:11.5px var(--font-ui);color:var(--text-2);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.loading,.error-msg{text-align:center;color:var(--text-3);font:12.5px var(--font-ui);padding:1.5rem 0}
.error-msg{color:var(--bad)}

#current{display:none}
#current.show{display:block}
.cur-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.cur-loc{font:600 1.25rem var(--font-ui)}
.cur-sub{font:11.5px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.cur-temp{font:700 3.2rem var(--font-mono);line-height:1;display:flex;align-items:center;gap:10px}
.cur-icon{font-size:2.6rem}
.cur-desc{font:13px var(--font-ui);color:var(--text-2);margin-top:2px}
.cur-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:1rem}
.cur-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:.6rem .8rem}
.cur-stat b{display:block;font:600 1rem var(--font-ui)}
.cur-stat span{font:10px var(--font-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.03em}

#hourly{display:none}
#hourly.show{display:block}
.hourly-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.hour-card{flex-shrink:0;width:66px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.6rem .3rem;text-align:center}
.hour-card .h-time{font:11px var(--font-mono);color:var(--text-3)}
.hour-card .h-icon{font-size:1.4rem;margin:5px 0}
.hour-card .h-temp{font:600 13px var(--font-ui)}

#daily{display:none}
#daily.show{display:block}
.day-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.day-row:last-child{border-bottom:none}
.day-name{width:80px;font:500 12.5px var(--font-ui)}
.day-icon{font-size:1.3rem;width:32px;text-align:center}
.day-bar-wrap{flex:1;height:5px;background:var(--surface-2);border-radius:3px;position:relative}
.day-bar{position:absolute;height:100%;border-radius:3px;background:linear-gradient(90deg,#6ea8d8,var(--accent))}
.day-temps{font:12px var(--font-mono);color:var(--text-2);width:75px;text-align:right}
.day-temps b{color:var(--text)}

.unit-toggle{display:flex;gap:4px}
.footer-note{font:11px var(--font-mono);color:var(--text-3);text-align:center;margin-top:.4rem}

@media(max-width:820px){.logo{font-size:1.5rem}.cur-temp{font-size:2.4rem}}
</style>
</head>
<body>
<header><div class="logo">weather<span>::</span>hub</div><div class="tagline">Clima actual, por horas y a 7 días</div></header>

<div class="shell">
  <div class="card">
    <div class="section-title">Ubicación<div class="unit-toggle"><button class="btn sm sel" id="unit-c">°C</button><button class="btn sm" id="unit-f">°F</button></div></div>
    <div class="search-row">
      <input type="text" id="search" placeholder="Buscar ciudad…">
      <button class="btn" id="geo-btn">📍 Mi ubicación</button>
    </div>
    <div class="results-list" id="results"></div>
    <div class="chips" id="recent-chips"></div>
  </div>

  <div class="card" id="status-card">
    <div class="loading">Busca una ciudad o usa tu ubicación para ver el clima</div>
  </div>

  <div class="card" id="current">
    <div class="cur-top">
      <div>
        <div class="cur-loc" id="cur-loc"></div>
        <div class="cur-sub" id="cur-sub"></div>
      </div>
      <div class="cur-temp"><span class="cur-icon" id="cur-icon"></span><span id="cur-temp-val"></span></div>
    </div>
    <div class="cur-desc" id="cur-desc"></div>
    <div class="cur-grid">
      <div class="cur-stat"><b id="cur-feels"></b><span>Sensación</span></div>
      <div class="cur-stat"><b id="cur-humidity"></b><span>Humedad</span></div>
      <div class="cur-stat"><b id="cur-wind"></b><span>Viento</span></div>
      <div class="cur-stat"><b id="cur-precip"></b><span>Precipitación</span></div>
    </div>
  </div>

  <div class="card" id="hourly">
    <div class="section-title">Próximas 24 horas</div>
    <div class="hourly-scroll" id="hourly-scroll"></div>
  </div>

  <div class="card" id="daily">
    <div class="section-title">7 días</div>
    <div id="daily-list"></div>
  </div>

  <div class="footer-note">Datos meteorológicos de Open-Meteo.com</div>
</div>

<script>
const $ = s => document.querySelector(s);

/* ══════════════════════════════════════════════
   CÓDIGOS METEOROLÓGICOS (WMO)
══════════════════════════════════════════════ */
const WMO = {
  0:['Despejado','☀️'],1:['Mayormente despejado','🌤️'],2:['Parcialmente nublado','⛅'],3:['Nublado','☁️'],
  45:['Niebla','🌫️'],48:['Niebla helada','🌫️'],
  51:['Llovizna ligera','🌦️'],53:['Llovizna','🌦️'],55:['Llovizna intensa','🌧️'],
  56:['Llovizna helada','🌧️'],57:['Llovizna helada intensa','🌧️'],
  61:['Lluvia ligera','🌧️'],63:['Lluvia','🌧️'],65:['Lluvia intensa','🌧️'],
  66:['Lluvia helada','🌧️'],67:['Lluvia helada intensa','🌧️'],
  71:['Nieve ligera','🌨️'],73:['Nieve','🌨️'],75:['Nieve intensa','❄️'],77:['Granizo fino','🌨️'],
  80:['Chubascos ligeros','🌦️'],81:['Chubascos','🌧️'],82:['Chubascos intensos','⛈️'],
  85:['Chubascos de nieve','🌨️'],86:['Chubascos de nieve intensos','❄️'],
  95:['Tormenta','⛈️'],96:['Tormenta con granizo','⛈️'],99:['Tormenta severa con granizo','⛈️']
};
const wmoDesc = c => (WMO[c] || ['—','🌡️'])[0];
const wmoIcon = c => (WMO[c] || ['—','🌡️'])[1];

/* ══════════════════════════════════════════════
   ESTADO
══════════════════════════════════════════════ */
let unit = 'c';
let lastData = null;
const RKEY = 'weatherhub_recent';

function toF(c) { return Math.round(c * 9/5 + 32); }
function fmtTemp(c) { return Math.round(unit === 'c' ? c : c * 9/5 + 32) + '°'; }

/* ══════════════════════════════════════════════
   BÚSQUEDA DE CIUDADES (Open-Meteo Geocoding)
══════════════════════════════════════════════ */
let searchTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { $('#results').innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 350);
});
async function doSearch(q) {
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=es&format=json`);
    const data = await res.json();
    const list = $('#results');
    if (!data.results || !data.results.length) { list.innerHTML = '<div class="result-item">Sin resultados</div>'; return; }
    list.innerHTML = data.results.map(r => `
      <div class="result-item" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.name}" data-country="${r.country || ''}">
        ${r.name}${r.admin1 ? ', ' + r.admin1 : ''}
        <small>${r.country || ''}${r.timezone ? ' · ' + r.timezone : ''}</small>
      </div>`).join('');
    list.querySelectorAll('.result-item[data-lat]').forEach(el => el.onclick = () => {
      loadWeather(+el.dataset.lat, +el.dataset.lon, el.dataset.name, el.dataset.country);
      $('#results').innerHTML = ''; $('#search').value = '';
    });
  } catch (err) {
    $('#results').innerHTML = '<div class="result-item">Error al buscar. Comprueba tu conexión.</div>';
  }
}

$('#geo-btn').onclick = () => {
  if (!navigator.geolocation) return showError('Tu navegador no permite geolocalización.');
  showLoading('Localizando…');
  navigator.geolocation.getCurrentPosition(
    pos => loadWeather(pos.coords.latitude, pos.coords.longitude, 'Tu ubicación', ''),
    () => showError('No se pudo acceder a tu ubicación.')
  );
};

/* ══════════════════════════════════════════════
   CARGA DE CLIMA (Open-Meteo Forecast)
══════════════════════════════════════════════ */
function showLoading(msg) {
  $('#status-card').style.display = 'block';
  $('#status-card').innerHTML = `<div class="loading">${msg}</div>`;
  $('#current').classList.remove('show'); $('#hourly').classList.remove('show'); $('#daily').classList.remove('show');
}
function showError(msg) {
  $('#status-card').style.display = 'block';
  $('#status-card').innerHTML = `<div class="error-msg">${msg}</div>`;
}
async function loadWeather(lat, lon, name, country) {
  showLoading('Cargando clima…');
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.current) throw new Error('sin datos');
    lastData = { data, name, country, lat, lon };
    renderWeather();
    $('#status-card').style.display = 'none';
    saveRecent(name, country, lat, lon);
  } catch (err) {
    showError('No se pudo cargar el clima. Inténtalo de nuevo.');
  }
}

function renderWeather() {
  if (!lastData) return;
  const { data, name, country } = lastData;
  const c = data.current;
  $('#current').classList.add('show');
  $('#cur-loc').textContent = name + (country ? ', ' + country : '');
  $('#cur-sub').textContent = data.timezone + ' · actualizado ' + new Date(c.time).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  $('#cur-icon').textContent = wmoIcon(c.weather_code);
  $('#cur-temp-val').textContent = fmtTemp(c.temperature_2m);
  $('#cur-desc').textContent = wmoDesc(c.weather_code);
  $('#cur-feels').textContent = fmtTemp(c.apparent_temperature);
  $('#cur-humidity').textContent = Math.round(c.relative_humidity_2m) + '%';
  $('#cur-wind').textContent = Math.round(c.wind_speed_10m) + ' km/h';
  $('#cur-precip').textContent = (c.precipitation ?? 0) + ' mm';

  // horario: próximas 24h desde la hora actual
  const nowIdx = data.hourly.time.findIndex(t => new Date(t) >= new Date(c.time));
  const hrs = [];
  for (let i = Math.max(nowIdx,0); i < Math.max(nowIdx,0) + 24 && i < data.hourly.time.length; i++) hrs.push(i);
  $('#hourly').classList.add('show');
  $('#hourly-scroll').innerHTML = hrs.map(i => `
    <div class="hour-card">
      <div class="h-time">${new Date(data.hourly.time[i]).toLocaleTimeString('es-ES',{hour:'2-digit'})}</div>
      <div class="h-icon">${wmoIcon(data.hourly.weather_code[i])}</div>
      <div class="h-temp">${fmtTemp(data.hourly.temperature_2m[i])}</div>
    </div>`).join('');

  // diario
  const allMax = data.daily.temperature_2m_max, allMin = data.daily.temperature_2m_min;
  const globalMax = Math.max(...allMax), globalMin = Math.min(...allMin);
  $('#daily').classList.add('show');
  $('#daily-list').innerHTML = data.daily.time.map((t,i) => {
    const dname = i === 0 ? 'Hoy' : new Date(t).toLocaleDateString('es-ES',{weekday:'short'});
    const lo = allMin[i], hi = allMax[i];
    const left = ((lo - globalMin) / (globalMax - globalMin || 1)) * 100;
    const width = ((hi - lo) / (globalMax - globalMin || 1)) * 100;
    return `<div class="day-row">
      <div class="day-name">${dname}</div>
      <div class="day-icon">${wmoIcon(data.daily.weather_code[i])}</div>
      <div class="day-bar-wrap"><div class="day-bar" style="left:${left}%;width:${Math.max(width,6)}%"></div></div>
      <div class="day-temps"><b>${fmtTemp(hi)}</b> / ${fmtTemp(lo)}</div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════════
   UNIDADES
══════════════════════════════════════════════ */
$('#unit-c').onclick = () => { unit='c'; $('#unit-c').classList.add('sel'); $('#unit-f').classList.remove('sel'); renderWeather(); };
$('#unit-f').onclick = () => { unit='f'; $('#unit-f').classList.add('sel'); $('#unit-c').classList.remove('sel'); renderWeather(); };

/* ══════════════════════════════════════════════
   RECIENTES (localStorage)
══════════════════════════════════════════════ */
function loadRecent() { try { return JSON.parse(localStorage.getItem(RKEY)) || []; } catch(e) { return []; } }
function saveRecent(name, country, lat, lon) {
  let list = loadRecent().filter(r => r.name !== name);
  list.unshift({ name, country, lat, lon });
  try { localStorage.setItem(RKEY, JSON.stringify(list.slice(0,6))); } catch(e) {}
  renderChips();
}
function renderChips() {
  const list = loadRecent();
  $('#recent-chips').innerHTML = list.map(r => `<div class="chip" data-lat="${r.lat}" data-lon="${r.lon}" data-name="${r.name}" data-country="${r.country||''}">${r.name}</div>`).join('');
  $('#recent-chips').querySelectorAll('.chip').forEach(el => el.onclick = () => loadWeather(+el.dataset.lat, +el.dataset.lon, el.dataset.name, el.dataset.country));
}
renderChips();

// carga inicial: primer reciente si existe
const initial = loadRecent()[0];
if (initial) loadWeather(initial.lat, initial.lon, initial.name, initial.country);
</script>
</body>
</html>
